# Fixture d'ExceptionLogLevelCoverageTest (issue #357) : ce que le conteneur
# de test ne compile pas. Seules les entrées marquées « signalée » doivent
# ressortir du recensement.
framework:
    exceptions:
        # Commune à tous les environnements, donc compilée en test : pas signalée.
        DomainException:
            log_level: info

when@test:
    framework:
        exceptions:
            # Compilée en test : pas signalée.
            LogicException:
                log_level: info

when@prod:
    framework:
        exceptions:
            # Signalée.
            RuntimeException:
                log_level: info
