_security_logout:
    resource: security.route_loader.logout
    type: service
    # Restreint à POST : par défaut la route générée accepte n'importe quelle
    # méthode, ce qui permet une déconnexion forcée en CSRF (une simple balise
    # <img src="/api/logout"> sur un site tiers). Le CsrfCookieRequestSubscriber
    # ne protège que POST/PUT/PATCH/DELETE, donc GET restait un trou.
    methods: POST
