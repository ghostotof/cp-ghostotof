# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.cv_file_path: '%env(resolve:CV_FILE_PATH)%'
    app.cv_download_filename: '%env(CV_DOWNLOAD_FILENAME)%'
    app.contact_sender_email: '%env(CONTACT_SENDER_EMAIL)%'
    app.contact_recipient_email: '%env(CONTACT_RECIPIENT_EMAIL)%'
    # Nom de marque du site, repris dans l'en-tête des e-mails sortants
    # (Twig global brand_name, cf. config/packages/twig.yaml). Valeur littérale :
    # elle ne change pas d'un environnement à l'autre.
    app.brand_name: 'CP-Ghostotof'
    # URL publique du frontend, pour construire les liens des e-mails sortants
    # (ex. lien de définition de mot de passe d'un utilisateur invité).
    app.frontend_base_url: '%env(APP_FRONTEND_BASE_URL)%'
    # Manifeste des paquets déployés, produit au build et embarqué dans l'image.
    # Sous config/ et non var/ : c'est une donnée du déploiement, figée avec lui,
    # là où var/ est le seul répertoire inscriptible en production.
    app.watch_package_manifest_path: '%kernel.project_dir%/config/watch/package-manifest.json'
    app.watch_deployed_versions_path: '%kernel.project_dir%/config/watch/deployed-versions.json'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Chemins du manifeste de paquets (contexte Portfolio/Watch). Le lock npm
    # n'existe que là où le dépôt frontend est accessible — au build, pas dans
    # le conteneur backend de développement : son absence est un cas prévu.
    App\Portfolio\Watch\Infrastructure\Manifest\LockFilePackageManifestBuilder:
        arguments:
            $composerLockPath: '%kernel.project_dir%/composer.lock'
            $npmLockPath: '%kernel.project_dir%/../frontend/package-lock.json'
            $manifestPath: '%app.watch_package_manifest_path%'

    App\Portfolio\Watch\Infrastructure\Manifest\FilePackageManifestReader:
        arguments:
            $manifestPath: '%app.watch_package_manifest_path%'

    # Versions relevées au `docker build` depuis les manifestes k8s, `.env` et le
    # lock npm. La racine du dépôt n'est visible qu'au build et, en dev, par les
    # montages en lecture seule du docker-compose.
    App\Portfolio\Watch\Infrastructure\Manifest\DeployedVersionsBuilder:
        arguments:
            $repositoryRoot: '%kernel.project_dir%/..'
            $npmLockPath: '%kernel.project_dir%/../frontend/package-lock.json'
            $outputPath: '%app.watch_deployed_versions_path%'
            $tagOverrides: []

    App\Portfolio\Watch\Infrastructure\Manifest\FileDeployedVersionsReader:
        arguments:
            $versionsPath: '%app.watch_deployed_versions_path%'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Seule source d'appels sortants de l'application, rendue publique en
        # test pour que les tests fonctionnels puissent la remplacer.
        #
        # C'est bien la classe concrète qu'il faut viser, pas l'alias
        # ReleaseCycleSourceInterface : un service privé n'ayant qu'un
        # consommateur est « inliné » à la compilation, si bien que
        # TestContainer::set() sur l'alias reste sans effet. Rendre l'alias
        # public ne suffit pas — la référence injectée pointe sur la classe.
        #
        # Sans cela, un test croirait simuler le fournisseur tout en l'appelant
        # réellement : il passerait, et la CI casserait au premier incident chez
        # le tiers.
        App\Portfolio\Watch\Infrastructure\Http\EndOfLifeDateClient:
            public: true
