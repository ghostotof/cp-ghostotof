# Verrou des limiteurs de débit (issue #272).
#
# Sans verrou, RateLimiter::consume() fait un lire-modifier-écrire non atomique
# sur cache.app : vingt requêtes simultanées sur la même clé ne décomptaient
# qu'une seule unité. Dès que ce composant est configuré, chaque limiteur de
# rate_limiter.yaml (lock_factory: 'auto') et ceux de login_throttling
# reçoivent lock.factory — RateLimiterStorageTest le vérifie.
#
# Le store doit être partagé entre pods : un advisory lock PostgreSQL sur la
# base de l'application, jamais flock ni semaphore (locaux au pod, ADR 0005).
# pg_advisory: dérive le DSN de DATABASE_URL (schéma suffixé de +advisory, cf.
# PostgresAdvisoryLockDsnEnvVarProcessor) : pas de second secret à router, pas
# de table ni de migration.
framework:
    lock: '%env(pg_advisory:resolve:DATABASE_URL)%'
