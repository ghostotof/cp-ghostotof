security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Security\User\Domain\Entity\CpgUser: auto

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        cpg_users:
            entity:
                class: App\Security\User\Domain\Entity\CpgUser
                property: username

        # ADR 0003 D6 : reconnaît un jeton du palier de base (marqueur "guest"
        # dans le payload JWT signé) sans jamais interroger Doctrine — voir
        # GuestUserProvider. Retombe sur cpg_users pour tout le reste, donc
        # aucun changement de comportement pour un compte réel.
        guest_users:
            id: App\Security\User\Infrastructure\Security\GuestUserProvider

        app_users:
            chain:
                providers: [guest_users, cpg_users]

    firewalls:
        # Ensure dev tools and static assets are always allowed
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Point d'entrée du login : reçoit {"username": ..., "password": ...} en JSON et
        # délègue la génération/pose du JWT (cookie httpOnly "BEARER") aux handlers
        # Lexik. Stateless : aucune session n'est créée côté serveur.
        #
        # Le pattern est borné sur `check_path` exactement (audit 2026-09-16,
        # constat A23). Il valait `^/api/login`, qui capturait aussi
        # `/api/login_checkx`, `/api/loginfoo` ou un futur `/api/login-history` :
        # ce firewall n'a qu'un `json_login` cloué sur `check_path` et ne lit
        # **aucun** JWT, une route ajoutée sous ce préfixe y serait donc traitée
        # en anonyme, le cookie BEARER du visiteur jamais regardé. Le firewall
        # décide sur le chemin décodé (rawurldecode, comme le routeur, issue
        # #77) : `/api/login%5Fcheck` reste bien le login, throttling et garde
        # anti-CSRF compris. AccessControlAnchoringTest pince la borne,
        # LoginFirewallScopeTest le comportement.
        login:
            pattern: ^/api/login_check$
            stateless: true
            provider: cpg_users
            # Anti-brute-force : au-delà de 5 tentatives infructueuses en 15 min,
            # les suivantes sont rejetées en 429 sans même vérifier le mot de
            # passe. Symfony limite par IP *et* par couple (IP, identifiant),
            # via le composant rate-limiter (stockage cache, compatible avec ce
            # firewall stateless). Complémentaire du rate limiter "contact_form".
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            json_login:
                check_path: /api/login_check
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Toutes les autres routes /api : authentification par JWT extrait du cookie
        # "BEARER" (voir config/packages/lexik_jwt_authentication.yaml). "logout.path"
        # est intercepté par le composant Security avant tout contrôleur : c'est
        # App\Security\Authentication\Infrastructure\Jwt\CookieLogoutListener qui
        # construit la réponse (cookies BEARER + XSRF-TOKEN expirés).
        #
        # Le pattern reste volontairement nu (`^/api`, sans `(/|$)`), à rebours
        # du resserrement du firewall ci-dessus : c'est l'attrape-tout de l'API,
        # et le borner ferait sortir les chemins voisins (`/apix…`) de *tout*
        # firewall — donc aussi de tout access_control, l'AccessListener étant un
        # listener de firewall. Ce serait retirer de la protection, à rebours de
        # « protégé par défaut ». Inscrit à ce titre dans l'allow-list
        # d'AccessControlAnchoringTest, avec la même justification.
        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            jwt: ~
            logout:
                path: /api/logout

    # ADR 0003 : ROLE_USER est le palier de base (authentifié, sans plus) ;
    # ROLE_TRUSTED (identifiant, accordé nominativement) et ROLE_SUPER
    # l'englobent. Doit rester déclaré avant tout access_control qui
    # référence ROLE_TRUSTED.
    role_hierarchy:
        ROLE_TRUSTED: [ROLE_USER]
        ROLE_SUPER: [ROLE_TRUSTED]

    # Note: Only the *first* matching rule is applied.
    #
    # Chaque `path` est une regex, ancrée aux deux bouts par `(/|$)` : la règle
    # couvre sa route et son sous-arbre, rien d'autre. Sans cette ancre,
    # `^/api/cv` capturait `/api/cv-export` et `^/api/case-studies` aurait
    # capturé un futur `/api/case-studies-drafts` avec le rôle de la règle
    # voisine, quel que soit le palier que cette route devait exiger — et comme
    # seule la première règle compte, une entrée ajoutée plus bas n'y aurait
    # rien changé (issue #78, pt 2). Un chemin voisin n'hérite donc d'aucune
    # protection implicite : il reçoit sa propre règle, ou
    # ApiRouteExposureTest le signale. AccessControlAnchoringTest pince l'ancre.
    access_control:
        - { path: ^/api/backoffice(/|$), roles: ROLE_SUPER }
        - { path: ^/api/me(/|$), roles: ROLE_TRUSTED }
        - { path: ^/api/cv(/|$), roles: ROLE_TRUSTED }
        # ADR 0003 D5 : contenu du palier de base — publiable en soi, mais pas
        # anonyme. ROLE_USER suffit (le jeton D6 comme un compte réel).
        - { path: ^/api/case-studies(/|$), roles: ROLE_USER }
        # Même palier. Le chemin ne commence pas par /api/cv, sinon la règle
        # ROLE_TRUSTED ci-dessus le capturerait (première règle qui matche —
        # l'ancre n'y change rien, /api/cv/anonymous serait dans son sous-arbre).
        - { path: ^/api/anonymous-cv(/|$), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Security\User\Domain\Entity\CpgUser:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
