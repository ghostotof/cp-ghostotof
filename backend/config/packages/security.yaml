security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        # bcrypt et son coût écrits en clair, pas `auto` (issue #590, constat
        # A10). Sous `auto`, Symfony essaie SodiumPasswordHasher après un échec
        # sur un hachage à rehacher, qui refait un bcrypt complet : un compte
        # au hachage ancien coûtait deux dérivations, l'égaliseur des échecs de
        # login n'en paie qu'une. Avec `bcrypt`, les hashers secondaires
        # (Pbkdf2, MessageDigest) refusent sur-le-champ tout hachage à `$`.
        # Un hachage argon se vérifie toujours, et une connexion réussie
        # rehache encore. Le coût est écrit pour qu'aucun nouveau défaut de
        # Symfony ne le change en silence.
        #
        # **Avant de changer l'algorithme ou le coût**, lire « Avant de changer
        # password_hashers » dans k8s/README.md : la vérification se fait au
        # coût *stocké*, donc chaque compte au hachage ancien répond en un
        # temps à lui jusqu'à sa prochaine connexion réussie.
        # CpgUserPasswordHasherTest fige ces valeurs dans chaque environnement.
        App\Security\User\Domain\Entity\CpgUser:
            algorithm: bcrypt
            cost: 13

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # Sans `property` : le fournisseur passe alors par
        # CpgUserRepository::loadUserByIdentifier() (issue #418). Avec
        # `property: username`, il levait lui-même `User "<identifiant>" not
        # found.`, message que le canal `security` journalise en production —
        # et l'identifiant tenté est parfois un mot de passe tapé dans le
        # mauvais champ. Ne pas remettre l'option.
        cpg_users:
            entity:
                class: App\Security\User\Domain\Entity\CpgUser

        # ADR 0003 D6 : reconnaît un jeton du palier de base (marqueur "guest"
        # dans le payload JWT signé) sans jamais interroger Doctrine — voir
        # BaseAccessUserProvider. Retombe sur cpg_users pour tout le reste, donc
        # aucun changement de comportement pour un compte réel.
        base_access_users:
            id: App\Security\User\Infrastructure\Security\BaseAccessUserProvider

        app_users:
            chain:
                providers: [base_access_users, cpg_users]

        # Firewall `mcp` (#648) : l'utilisateur est une connexion MCP, relue
        # avec son jeton par McpBearerAuthenticator, dont le badge porte son
        # propre chargeur. Ce fournisseur ne charge donc rien (tout chargement
        # par identifiant échoue, sans le citer) et ne rafraîchit rien (le
        # firewall est sans état) ; il n'existe que parce que SecurityBundle en
        # exige un par firewall dès que plusieurs sont déclarés. Jamais
        # `cpg_users` ici : ce serait un chemin qui charge un compte par son
        # identifiant de connexion sur /api/mcp.
        mcp_connections:
            id: App\Mcp\Connection\Infrastructure\Security\McpConnectionUserProvider

    firewalls:
        # Pas de firewall `dev` (`^/(_profiler|_wdt|assets|build)/`,
        # `security: false`) : celui du squelette Symfony a été supprimé le
        # 2026-09-22 (reliquat du 3e audit, T5.7, issue #239). Ni
        # WebProfilerBundle ni AssetMapper ne sont installés, aucune de ces
        # routes n'existe dans aucun environnement, et le réserver à `dev` par
        # un bloc `when@dev` est refusé par SecurityBundle (un firewall ne peut
        # pas être ajouté depuis un second bloc de config). Fonctionnellement
        # neutre : un chemin hors de tout firewall est servi comme un chemin
        # `security: false`. AccessControlAnchoringTest l'empêche de revenir.

        # Point d'entrée du login : reçoit {"username": ..., "password": ...} en JSON et
        # délègue la génération/pose du JWT (cookie httpOnly "BEARER") aux handlers
        # Lexik. Stateless : aucune session n'est créée côté serveur.
        #
        # Le pattern est borné sur `check_path` exactement (audit 2026-09-16,
        # constat A23). Il valait `^/api/login`, qui capturait aussi
        # `/api/login_checkx`, `/api/loginfoo` ou un futur `/api/login-history` :
        # ce firewall n'a qu'un `json_login` cloué sur `check_path` et ne lit
        # **aucun** JWT, une route ajoutée sous ce préfixe y serait donc traitée
        # en anonyme, le cookie BEARER du visiteur jamais regardé. Le firewall
        # décide sur le chemin décodé (rawurldecode, comme le routeur, issue
        # #77) : `/api/login%5Fcheck` reste bien le login, throttling et garde
        # anti-CSRF compris. AccessControlAnchoringTest pince la borne,
        # LoginFirewallScopeTest le comportement.
        login:
            pattern: ^/api/login_check$
            stateless: true
            provider: cpg_users
            # Anti-brute-force : au-delà de 5 tentatives infructueuses en 15 min,
            # les suivantes sont rejetées sans même vérifier le mot de passe,
            # en 429 `/errors/rate-limited` avec Retry-After comme tout refus de
            # débit (issue #399 : LoginThrottlingRefusalListener remplace le 401
            # « Too many failed login attempts » du failure handler de Lexik,
            # cf. LoginThrottlingTest). Les autres échecs gardent le 401 de
            # Lexik. Symfony limite par IP *et* par couple (IP, identifiant),
            # via le composant rate-limiter (stockage cache, compatible avec ce
            # firewall stateless). Complémentaire du rate limiter "contact_form".
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            json_login:
                check_path: /api/login_check
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Serveur MCP (ADR 0006 D4) : un client MCP n'est pas un navigateur et ne
        # s'authentifie jamais par cookie. Ce firewall, déclaré avant `api`, ne
        # lit donc pas le cookie BEARER : c'est ce qui rend sûre l'exclusion de
        # /api/mcp de la garde CSRF (CsrfCookieRequestSubscriber) — une page
        # tierce qui ferait poster le navigateur d'une personne de confiance n'y
        # emprunterait aucune identité. Son seul authentificateur (#648) est
        # celui de la connexion MCP : `Authorization: Bearer <jeton opaque>`,
        # relu en base à chaque requête avec la connexion, le compte et ses
        # rôles, en une requête (McpBearerAuthenticator). Sans cet en-tête, ou
        # sous un autre schéma (le `Basic` du Basic Auth de la préprod), la
        # requête reste anonyme ; un jeton présenté et refusé est un 401
        # `invalid_token` sur toute requête. Pas de `jwt`, aucun cookie lu.
        # Borné par `$` : la route n'a pas de sous-chemin, un voisin
        # (`/api/mcpx`) retombe dans `api` (AccessControlAnchoringTest).
        mcp:
            pattern: ^/api/mcp$
            stateless: true
            provider: mcp_connections
            custom_authenticators:
                - App\Mcp\Connection\Infrastructure\Security\McpBearerAuthenticator

        # Les deux documents de métadonnées OAuth de la connexion MCP (#647,
        # RFC 9728 et RFC 8414), hors /api parce que la norme fixe leur chemin
        # (chemin bien connu suivi de celui de la ressource ou de l'émetteur).
        # Stateless, aucun authentificateur, aucun cookie lu — un document
        # public, identique pour tous. Un firewall chacun, plutôt qu'aucun :
        # une route hors /api a son propre firewall et sa propre règle
        # access_control (RouterScopeTest), jamais une exposition implicite. Bornés par `$` sur leur chemin exact, le `.`
        # échappé : un voisin (`/.well-known/oauth-authorization-server` seul,
        # `…/api/mcpx`) ne relève d'aucun firewall et le routeur lui répond
        # 404 (AccessControlAnchoringTest). Placés avant `api` comme `mcp`,
        # même si leurs chemins ne commencent pas par /api.
        oauth_resource_metadata:
            pattern: ^/\.well-known/oauth-protected-resource/api/mcp$
            stateless: true

        oauth_server_metadata:
            pattern: ^/\.well-known/oauth-authorization-server/api/oauth$
            stateless: true

        # Les trois points du serveur d'autorisation OAuth de la connexion MCP
        # (#647) : autorisation, jeton, révocation. Stateless, aucun
        # authentificateur, aucun cookie lu. Un client MCP n'est pas un
        # navigateur ; le point d'autorisation, que le navigateur de la
        # personne atteint, ne fait que valider la demande et renvoyer
        # vers la page de consentement — l'identité n'est lue qu'au
        # consentement. Sous le firewall `api`, un cookie BEARER illisible
        # vaudrait un 401 au lieu de la réponse anonyme. Le consentement
        # (`/api/oauth/consent`) n'est pas ici : il lit la personne, il reste
        # sous `api`. Borné par `$` sur les trois chemins exacts : un voisin
        # (`/api/oauth/authorizex`, `/api/oauth/authorize/x`) retombe dans
        # `api` (AccessControlAnchoringTest). Avant `api`, comme `mcp`.
        oauth:
            pattern: ^/api/oauth/(authorize|token|revoke)$
            stateless: true

        # Toutes les autres routes /api : authentification par JWT extrait du cookie
        # "BEARER" (voir config/packages/lexik_jwt_authentication.yaml). "logout.path"
        # est intercepté par le composant Security avant tout contrôleur : c'est
        # App\Security\Authentication\Infrastructure\Jwt\CookieLogoutListener qui
        # construit la réponse (cookies BEARER + XSRF-TOKEN expirés).
        #
        # Le pattern reste volontairement nu (`^/api`, sans `(/|$)`), à rebours
        # du resserrement du firewall ci-dessus : c'est l'attrape-tout de l'API,
        # et le borner ferait sortir les chemins voisins (`/apix…`) de *tout*
        # firewall — donc aussi de tout access_control, l'AccessListener étant un
        # listener de firewall. Ce serait retirer de la protection, à rebours de
        # « protégé par défaut ». Inscrit à ce titre dans l'allow-list
        # d'AccessControlAnchoringTest, avec la même justification.
        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            jwt: ~
            logout:
                path: /api/logout

    # ADR 0003 : ROLE_USER est le palier de base (authentifié, sans plus) ;
    # ROLE_TRUSTED (identifiant, accordé nominativement) et ROLE_SUPER
    # l'englobent. Doit rester déclaré avant tout access_control qui
    # référence ROLE_TRUSTED.
    role_hierarchy:
        ROLE_TRUSTED: [ROLE_USER]
        ROLE_SUPER: [ROLE_TRUSTED]

    # Note: Only the *first* matching rule is applied.
    #
    # Chaque `path` est une regex, ancrée aux deux bouts par `(/|$)` : la règle
    # couvre sa route et son sous-arbre, rien d'autre. Sans cette ancre,
    # `^/api/cv` capturait `/api/cv-export` et `^/api/case-studies` aurait
    # capturé un futur `/api/case-studies-drafts` avec le rôle de la règle
    # voisine, quel que soit le palier que cette route devait exiger — et comme
    # seule la première règle compte, une entrée ajoutée plus bas n'y aurait
    # rien changé (issue #78, pt 2). Un chemin voisin n'hérite donc d'aucune
    # protection implicite : il reçoit sa propre règle, ou
    # ApiRouteExposureTest le signale. AccessControlAnchoringTest pince l'ancre.
    access_control:
        - { path: ^/api/backoffice(/|$), roles: ROLE_SUPER }
        - { path: ^/api/me(/|$), roles: ROLE_TRUSTED }
        - { path: ^/api/cv(/|$), roles: ROLE_TRUSTED }
        # Assistant de carrière (spec 0005 D4, ADR 0004 D2 amendée) : il répond
        # à partir du CV, donc du même palier que lui. Placée avant les règles
        # ROLE_USER ; le préfixe ne commence pas par /api/cv.
        - { path: ^/api/assistant(/|$), roles: ROLE_TRUSTED }
        # Consentement à une connexion MCP (#647, ADR 0006 D3) : il accorde à un
        # client la lecture du corpus nominatif au nom de la personne, donc le
        # palier de confiance, comme /api/cv. Sous le firewall `api` (cookie de
        # la personne) et la garde CSRF ; les trois autres points OAuth
        # (`oauth`, sans authentificateur) n'ont pas de règle et ne sont pas
        # sous ce préfixe. Avant les règles ROLE_USER.
        - { path: ^/api/oauth/consent(/|$), roles: ROLE_TRUSTED }
        # ADR 0003 D5 : contenu du palier de base — publiable en soi, mais pas
        # anonyme. ROLE_USER suffit (le jeton D6 comme un compte réel).
        - { path: ^/api/case-studies(/|$), roles: ROLE_USER }
        # Même palier. Le chemin ne commence pas par /api/cv, sinon la règle
        # ROLE_TRUSTED ci-dessus le capturerait (première règle qui matche —
        # l'ancre n'y change rien, /api/cv/anonymous serait dans son sous-arbre).
        - { path: ^/api/anonymous-cv(/|$), roles: ROLE_USER }
        # Les deux documents de métadonnées OAuth (#647), publics par nature :
        # un client MCP les lit avant toute connexion. Aux motifs exacts de
        # leurs firewalls. En dernier : leurs chemins sont hors /api, aucune
        # règle ci-dessus ne peut les capturer ni être capturée par elles, et
        # la règle du backoffice reste la première de la liste.
        - { path: ^/\.well-known/oauth-protected-resource/api/mcp$, roles: PUBLIC_ACCESS }
        - { path: ^/\.well-known/oauth-authorization-server/api/oauth$, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            # Même algorithme qu'ailleurs (issue #590), seul le coût change.
            App\Security\User\Domain\Entity\CpgUser:
                algorithm: bcrypt
                cost: 4 # Lowest possible value for bcrypt
