# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # En environnement déployé, l'application ne reçoit de trafic que via
    # l'ingress (dev : via le service nginx "web"), tous deux sur des IP
    # privées. `private_ranges` fait confiance aux en-têtes X-Forwarded-* de
    # ces sauts, ce qui permet à Request::getClientIp() de retrouver l'IP
    # réelle du visiteur — indispensable au rate limiter du formulaire de
    # contact, qui sinon regrouperait tous les visiteurs sous l'unique IP du
    # pod ingress. L'ingress-nginx *ajoute* l'IP source à X-Forwarded-For
    # (comportement par défaut, `use-forwarded-headers` désactivé) : un
    # X-Forwarded-For forgé par un client externe est donc neutralisé.
    trusted_proxies: private_ranges
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Niveau de journalisation de l'ErrorListener du noyau, qui met sinon en
    # `critical` toute exception hors HttpExceptionInterface et en `error` tout
    # 4xx HTTP (tests/Shared/Infrastructure/Http/ApiExceptionLogLevelTest.php ;
    # ExceptionLogLevelCoverageTest exige une entrée pour chaque exception
    # métier rendue avec un statut, issue #348).
    # Ici plutôt qu'en `#[WithLogLevel]` : le domaine ne dépend pas de HttpKernel.
    # Ne viser que des classes précises : un mapping sur HttpException
    # abaisserait le niveau de tous les 4xx de l'application.
    # Commun à tous les environnements, jamais sous `when@prod` : le garde-fou
    # lit ce mapping compilé dans le conteneur de test, qui ne voit pas `prod`
    # (issue #357).
    exceptions:
        # Ici, `log_level` seulement, jamais `status_code` pour une exception
        # métier rendue en problem+json (issue #322) : avec un `status_code`,
        # ErrorListener::logKernelException (priorité 0) remplace l'exception
        # par une HttpException avant ApiProblemResponseListener (-98), qui ne
        # voit alors plus de ProblemExceptionInterface. Le `type` disparaîtrait
        # sans bruit, le statut étant déjà porté par getStatus().
        # Erreur du client, bornes D6 comprises : pas un incident.
        App\Ai\Assistant\Domain\Exception\InvalidConversationException:
            log_level: info
        # Quota horaire atteint (D6) : le comportement attendu de la borne.
        App\Ai\Assistant\Domain\Exception\AssistantRateLimitExceededException:
            log_level: info
        # Corps au-delà de 128 Kio (spec 0005 M4) : erreur du client.
        App\Ai\Assistant\Infrastructure\Http\RequestBodyTooLargeException:
            log_level: info
        # Panne d'un tiers : la cause (classe, statut) est déjà sur `ai_usage`.
        # `warning` reste visible en production (LOG_LEVEL=warning).
        App\Ai\Assistant\Domain\Exception\AssistantUnavailableException:
            log_level: warning
        # Quota du palier de base atteint (ADR 0003 D6, issue #322) : le
        # comportement attendu de la borne. Avant #322, un écouteur dédié
        # rendait le 429 avant la journalisation du noyau, qui ne le voyait
        # jamais ; il passe désormais par logKernelException, et sans cette
        # entrée il sortirait en `critical` (ni HttpException, ni 4xx connu).
        App\Security\User\Domain\Exception\BaseAccessRateLimitExceededException:
            log_level: info

        # --- Exceptions rendues par API Platform (`exception_to_status`) ---
        # logKernelException (priorité 0) les voit aussi, avant API Platform
        # (-96) : sans entrée, chacune sortait en `critical` — une 404 de
        # backoffice, un 409 de saisie ou un quota atteint étaient autant
        # d'alertes de production (issue #348). Règle : `info` pour une erreur
        # du client (4xx), `warning` pour la panne d'un tiers (503) ou pour un
        # signal qu'aucune autre trace ne porte, l'un et l'autre visibles en
        # production. La règle ne vaut que pour ces exceptions métier : les 4xx
        # HTTP du framework (404/405 du routeur, 422 de validation, 403) restent
        # en `error`. ExceptionLogLevelCoverageTest exige une entrée pour chaque
        # clé de `exception_to_status` et chaque ProblemExceptionInterface de
        # src/, hors dispenses justifiées, et un niveau conforme au statut.
        #
        # Formulaire de contact : quota par IP en `info`, comme celui de
        # base-access — leur trace retenue est l'événement `security_audit`
        # (`contact-throttled`, `base-access-throttled`, avec l'IP et le chemin,
        # issue #356). Puis la remise de l'e-mail, voir
        # AccountInvitationDeliveryException plus bas.
        App\Contact\Domain\Exception\ContactRateLimitExceededException:
            log_level: info
        App\Contact\Domain\Exception\ContactMessageDeliveryException:
            log_level: warning
        # Assistant de traduction (ADR 0004) : panne du fournisseur, quota.
        App\Ai\Translation\Domain\Exception\TranslationUnavailableException:
            log_level: warning
        # Le quota est la borne de dépense, même sur un compte ROLE_SUPER
        # compromis (rate_limiter.yaml). Son refus est tracé sur `ai_usage` avec
        # le compte et l'échéance (SymfonyTranslationRateLimiter, issue #356),
        # comme celui de l'assistant de parcours : `info` ici, comme lui.
        App\Ai\Translation\Domain\Exception\TranslationRateLimitExceededException:
            log_level: info
        # Contenus du portfolio : introuvable, conflit, saisie invalide.
        App\Portfolio\Experience\Domain\Exception\ExperienceTechnologyAlreadyExistsException:
            log_level: info
        App\Portfolio\Experience\Domain\Exception\ExperienceTechnologyNotFoundException:
            log_level: info
        App\Portfolio\Contribution\Domain\Exception\ContributionNotFoundException:
            log_level: info
        App\Portfolio\CaseStudy\Domain\Exception\CaseStudyNotFoundException:
            log_level: info
        App\Portfolio\AnonymousCv\Domain\Exception\AnonymousCvSectionNotFoundException:
            log_level: info
        App\Portfolio\Incident\Domain\Exception\IncidentNotFoundException:
            log_level: info
        App\Portfolio\Watch\Domain\Exception\WatchedProductNotFoundException:
            log_level: info
        App\Portfolio\Watch\Domain\Exception\WatchedProductSlugAlreadyUsedException:
            log_level: info
        App\Portfolio\Watch\Domain\Exception\WatchedProductSlugIsImmutableException:
            log_level: info
        App\Portfolio\Watch\Domain\Exception\InvalidWatchedProductException:
            log_level: info
        App\Portfolio\Shared\Domain\Exception\InvalidLocaleException:
            log_level: info
        App\Portfolio\Shared\Domain\Exception\TranslationAlreadyExistsException:
            log_level: info
        App\Portfolio\Shared\Domain\Exception\UnknownTranslationGroupException:
            log_level: info
        App\Portfolio\Shared\Domain\Exception\UnknownOrderEntryException:
            log_level: info
        App\Portfolio\Shared\Domain\Exception\IncompleteOrderException:
            log_level: info
        App\Portfolio\Quality\Domain\Exception\QualityPrincipleNotFoundException:
            log_level: info
        App\Portfolio\Quality\Domain\Exception\QualityTraitNotFoundException:
            log_level: info
        # Pas une erreur du client : la locale a déjà passé Locale::fromString,
        # c'est la ligne de réglages qui manque en base (seed absent, ligne
        # supprimée), et toute la page « À propos » répond 404 sur une route
        # publique. Un défaut de données, donc visible en production.
        App\Portfolio\About\Domain\Exception\AboutSettingsNotFoundException:
            log_level: warning
        App\Portfolio\About\Domain\Exception\AboutSiteCardNotFoundException:
            log_level: info
        App\Portfolio\About\Domain\Exception\AboutMeCardNotFoundException:
            log_level: info
        # Administration des comptes (backoffice, ROLE_SUPER).
        App\Security\User\Domain\Exception\CpgUserNotFoundException:
            log_level: info
        App\Security\User\Domain\Exception\CannotDeleteOwnAccountException:
            log_level: info
        App\Security\User\Domain\Exception\CannotDeleteLastSuperAdminException:
            log_level: info
        App\Security\User\Domain\Exception\CannotModifyOwnRolesException:
            log_level: info
        App\Security\User\Domain\Exception\CannotDemoteLastSuperAdminException:
            log_level: info
        App\Security\User\Domain\Exception\EmailAlreadyUsedException:
            log_level: info
        App\Security\User\Domain\Exception\AccountNotAwaitingActivationException:
            log_level: info
        # Envoi de l'invitation, comme la remise du message de contact : levées
        # dans un handler du worker, où ni ce mapping ni `exception_to_status`
        # n'agissent. Entrées défensives pour un appel *direct* au service
        # depuis la pile HTTP seulement : via un bus Messenger synchrone,
        # l'exception arriverait enveloppée dans HandlerFailedException, et
        # aucune des deux entrées ne la reconnaîtrait.
        App\Security\User\Domain\Exception\AccountInvitationDeliveryException:
            log_level: warning
        # Parcours public de définition de mot de passe. Un jeton inconnu est
        # tracé sur `security_audit` (`password-setup-token-rejected`, avec IP
        # et chemin, issue #356) : ce journal n'est plus sa seule trace, il
        # rentre dans la règle des 4xx. Un lien expiré est le cas ordinaire
        # d'une invitation ouverte trop tard ; un lien déjà consommé, fusionné
        # avec lui dans la réponse, a son propre événement
        # (`password-setup-token-replayed`).
        App\Security\User\Domain\Exception\InvalidPasswordSetupTokenException:
            log_level: info
        App\Security\User\Domain\Exception\PasswordSetupTokenExpiredException:
            log_level: info
        # Quota par IP : tracé sur `security_audit` (`password-setup-throttled`,
        # issue #356), comme ceux du contact et de base-access.
        App\Security\User\Domain\Exception\PasswordSetupRateLimitExceededException:
            log_level: info
        # Corps de requête illisible sur une opération API Platform (issue #355) :
        # erreur du client, sur des POST publics donc à la main de n'importe
        # qui. Sa trace retenue est l'access log de nginx (le 400 et l'IP).
        # L'entrée large `Serializer\ExceptionInterface`, elle, n'a pas
        # d'entrée ici, à dessein : un JSON de sortie non encodable reste en
        # `critical`.
        App\Shared\Infrastructure\ApiPlatform\MalformedRequestBodyException:
            log_level: info

        # Content-Type refusé (415) : une erreur du client, jamais un incident.
        # Seule entrée de cette liste à ne viser ni une exception métier de
        # src/ ni une clé de `exception_to_status`, et c'est voulu (issue #320,
        # justifiée dans ExceptionLogLevelCoverageTest) : la classe est levée
        # par #[MapRequestPayload(acceptFormat)] sur /api/assistant/answers,
        # mais aussi par ContentNegotiationProvider, DeserializeProvider,
        # ParameterProvider et DeserializeListener d'API Platform — donc sur
        # **toute** route de l'API, backoffice compris. Avec LOG_LEVEL=warning,
        # aucun 415 n'apparaît dans les journaux de production.
        Symfony\Component\HttpKernel\Exception\UnsupportedMediaTypeHttpException:
            log_level: info

    # Aucune session, dans aucun environnement (audit 2026-09-16, constat A23).
    # L'application est sans état de bout en bout : les deux firewalls sont
    # `stateless: true`, l'authentification tient dans un JWT en cookie, il n'y
    # a ni formulaire Symfony, ni message flash, ni `getSession()` dans `src/`.
    #
    # La désactiver n'est pas qu'un nettoyage. Le gestionnaire par défaut écrit
    # les sessions sous `%kernel.cache_dir%/sessions`, donc sous `var/`, alors
    # que les pods tournent en `readOnlyRootFilesystem` avec le seul `var/log`
    # monté (ADR 0005) : une session démarrée par mégarde en production serait
    # exactement le défaut que l'ADR proscrit — une écriture qui échoue sans
    # bruit. Sans session, l'erreur est franche (`SessionNotFoundException`) et
    # apparaît en test ou en développement, pas en production.
    #
    # Corollaire à connaître avant de réactiver quoi que ce soit : un formulaire
    # Symfony (`framework.form`) ou une protection CSRF à jeton en session en
    # auraient besoin. Le CSRF de ce projet est un double-submit par cookie
    # (CsrfCookieRequestSubscriber), sans état par construction.
    # StatelessSessionTest pince l'invariant.
    session: false

    http_client:
        scoped_clients:
            # Client dédié aux appels Symfony AI (cf. config/packages/ai.yaml).
            # Séparé du client par défaut pour que ses bornes ne s'appliquent
            # qu'à lui : 40 s de timeout, sous les 60 s de fastcgi_read_timeout
            # (nginx) et de l'ingress, sans quoi le client attendrait une réponse
            # que le reverse proxy a déjà abandonnée ; max_redirects 0, même règle
            # que les clients de Portfolio/Watch (ADR 0002) — un fournisseur
            # détourné n'obtient pas de levier vers le réseau interne.
            ai.http_client:
                base_uri: 'https://api.anthropic.com'
                timeout: 40
                max_redirects: 0
            # Même bornes pour l'assistant de parcours (spec 0005, ADR 0004 D5) :
            # consommé par la plateforme Scaleway déclarée dans services.yaml, le
            # bundle ne sachant pas le lui transmettre (spec 0005 D2).
            ai.scaleway.http_client:
                base_uri: 'https://api.scaleway.ai'
                timeout: 40
                # `timeout` est un délai d'inactivité : un flux qui goutte (un
                # fragment toutes les 39 s) le repousserait sans fin et tiendrait un
                # worker php-fpm. Plafond total, large au-dessus d'une réponse de
                # 1 024 jetons (spec 0005 D6). `fastcgi_read_timeout` (nginx) et le
                # délai de lecture de l'ingress, 60 s par défaut, mesurent l'attente
                # entre deux lectures, pas un total : le risque d'un 504 HTML avant le
                # 503 typé n'existe qu'avant le premier octet, et cette attente-là
                # est bornée ici sous 60 s.
                max_duration: 50
                max_redirects: 0

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        # Pas de `session.storage_factory_id: session.storage.factory.mock_file`
        # ici : la session est désactivée partout (voir plus haut), l'environnement
        # de test compris — c'est précisément là qu'on veut voir échouer un code
        # qui en démarrerait une.
