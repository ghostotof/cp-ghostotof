nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'X-XSRF-TOKEN']
        expose_headers: ['Link']
        # Indispensable pour que le navigateur envoie/reçoive le cookie httpOnly du
        # JWT lors des requêtes cross-port (frontend Vite sur un port distinct de nginx).
        allow_credentials: true
        max_age: 3600
    paths:
        '^/api':
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_credentials: true
