framework:
    rate_limiter:
        # Anti-spam sur POST /api/contact (endpoint public, sans authentification
        # ni CSRF — cf. App\Contact\Presentation\ApiResource\ContactMessageResource
        # et CsrfCookieRequestSubscriber). Complète le honeypot : celui-ci ne freine
        # que les bots naïfs, ceci borne le débit quel que soit l'émetteur.
        # Clé de limitation : l'IP du visiteur (cf. SymfonyContactRateLimiter).
        contact_form:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'

        # Anti-brute-force sur POST /api/account/password-setup et …/validate
        # (endpoint public, sans authentification ni CSRF). Borne les tentatives
        # de deviner un jeton valide ou de forcer un mot de passe sur un jeton
        # connu mais pas encore consommé. Clé : l'IP de l'appelant
        # (cf. SymfonyPasswordSetupRateLimiter).
        account_password_setup:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'

        # Anti-abus sur l'endpoint d'accès au palier de base (ADR 0003 D6,
        # POST /api/account/base-access) : émet un jeton ROLE_USER sans
        # compte persisté. Aucun effet de bord coûteux (pas d'e-mail, pas de
        # hash de mot de passe) contrairement aux deux limiteurs ci-dessus —
        # plafond volontairement plus haut, mais borné : sans lui, l'endpoint
        # devient un distributeur de jetons (D6). Clé : l'IP de l'appelant
        # (cf. SymfonyBaseAccessRateLimiter).
        base_access:
            policy: 'sliding_window'
            limit: 20
            interval: '1 hour'

        # Quota de l'assistant de traduction du backoffice (ADR 0004, D5 —
        # POST /api/backoffice/translations). Premier limiteur du projet sur une
        # route authentifiée : la clé est le compte (username), pas l'IP. Avec
        # le plafond de jetons et le timeout du client HTTP, c'est ce qui borne
        # la dépense chez le fournisseur même sur une boucle côté UI ou un
        # compte ROLE_SUPER compromis (cf. SymfonyTranslationRateLimiter).
        translation_assistant:
            policy: 'sliding_window'
            limit: 30
            interval: '1 hour'
