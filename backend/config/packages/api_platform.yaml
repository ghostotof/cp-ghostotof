api_platform:
    title: Hello API Platform
    version: 1.0.0
    # Le reste de l'API (/api/me, /api/cv, /api/login_check) répond en JSON
    # brut, jamais en JSON-LD/Hydra : on garde ce même format pour les
    # ApiResource, plutôt que le format jsonld activé par défaut par API
    # Platform, pour que le frontend consomme un simple tableau/objet.
    formats:
        json: ['application/json']
    # Sans ceci, API Platform tente de sérialiser les erreurs (ex. échec de
    # validation Assert sur ContactMessageResource) au format jsonld par
    # défaut, qui n'est pas dans `formats` ci-dessus : 500 "Serialization for
    # the format jsonld is not supported" au lieu du 422 attendu. À défaut
    # d'une ApiResource avec opération d'écriture avant App\Contact, ce
    # défaut de config n'avait encore jamais été exercé.
    error_formats:
        json: ['application/json']
    # Le point d'entrée Hydra (GET /api) est coupé partout, pas seulement en
    # production (issue #360). Il ne sait parler que jsonld, jsonhal, jsonapi
    # ou html — formats fixés en dur par le bundle (ApiPlatformExtension,
    # paramètre `entrypoint_formats`), un `json` ajouté aux `docs_formats` en
    # est retiré —, et le projet n'en déclare aucun : actif en dev et en test,
    # il ne répondait jamais, sinon par une UnsupportedFormatException
    # `critical`. La documentation reste servie en dev par /api/docs.
    enable_entrypoint: false
    # Statut HTTP des exceptions métier levées sous une opération API Platform :
    # sans entrée ici ni ProblemExceptionInterface::getStatus(), l'exception
    # remonterait en 500. Une ProblemExceptionInterface qui déclare son statut
    # n'a pas besoin d'entrée : c'est le cas des quotas du contact, de la
    # traduction et de la définition du mot de passe depuis l'issue #369
    # (`type` /errors/rate-limited, 429). Si elle en a une, l'entrée doit
    # répéter ce statut : la table, consultée la première
    # (ErrorListener::getStatusCode), fixe le statut HTTP, alors que getStatus()
    # remplit le `status` du corps. ProblemStatusMatchesExceptionToStatusTest
    # rougit sur une contradiction.
    #
    # ATTENTION, deux pièges de cette clé, l'un et l'autre vérifiés dans le
    # vendor de la version installée :
    #
    #  1. déclarer `exception_to_status` **remplace** la valeur par défaut
    #     d'API Platform, elle ne la complète pas (`->defaultValue([...])` dans
    #     Configuration::addExceptionToStatusSection, vendor/api-platform/symfony/
    #     Bundle/DependencyInjection/Configuration.php:622). Deux des trois
    #     entrées par défaut sont donc rétablies en fin de liste ci-dessous,
    #     la troisième retirée à dessein (issue #373) ;
    #  2. la résolution prend la **première** entrée qui correspond, dans
    #     l'ordre de déclaration, et `is_a($exception, $class, true)` reconnaît
    #     aussi les interfaces et les classes parentes (ErrorListener::getStatusCode,
    #     vendor/api-platform/symfony/EventListener/ErrorListener.php:167). Une
    #     entrée large doit donc rester **après** les entrées précises — d'où la
    #     place des défauts, tout en bas.
    #
    # Toute nouvelle entrée en appelle une seconde, dans `framework.exceptions`
    # (framework.yaml) : son `log_level`. Le noyau journalise l'exception
    # avant qu'API Platform la rende, et sans entrée la met en `critical`
    # (issue #348). ExceptionLogLevelCoverageTest rougit sur un oubli — y
    # compris pour un `exceptionToStatus` porté par une ressource ou une
    # opération (issue #357). Ce mapping reste commun à tous les
    # environnements : ExceptionMappingEnvironmentParityTest refuse un
    # `when@prod` comme un `when@test`.
    exception_to_status:
        # Aujourd'hui seulement levée dans SendContactMessageHandler (worker
        # Messenger async, jamais dans la pile HTTP synchrone) : entrée
        # défensive pour éviter un 500 générique si ce service était un jour
        # appelé directement depuis un Processor API Platform. Elle ne vaut pas
        # pour un bus Messenger synchrone, qui envelopperait l'exception dans
        # HandlerFailedException (issue #348).
        App\Contact\Domain\Exception\ContactMessageDeliveryException: 503
        # Assistant de traduction (ADR 0004) : fournisseur injoignable, délai
        # dépassé ou réponse hors schéma. 503 comme la remise d'un e-mail —
        # le service est indisponible, la requête était bonne — et un `type`
        # stable /errors/translation-unavailable pour le frontend.
        App\Ai\Translation\Domain\Exception\TranslationUnavailableException: 503
        # Aucune exception d'Ai/Assistant ici, ni celle du quota de
        # POST /api/account/base-access, à dessein : leurs routes sont des
        # contrôleurs, pas des opérations API Platform. ApiProblemResponseListener
        # (Shared, priorité -98, issue #322) les rend avec le statut que porte
        # chacune via ProblemExceptionInterface::getStatus(). Une entrée ajoutée
        # ici ne serait jamais lue.
        App\Portfolio\Experience\Domain\Exception\ExperienceTechnologyAlreadyExistsException: 409
        App\Portfolio\Experience\Domain\Exception\ExperienceTechnologyNotFoundException: 404
        App\Portfolio\Contribution\Domain\Exception\ContributionNotFoundException: 404
        App\Portfolio\CaseStudy\Domain\Exception\CaseStudyNotFoundException: 404
        App\Portfolio\AnonymousCv\Domain\Exception\AnonymousCvSectionNotFoundException: 404
        App\Portfolio\Incident\Domain\Exception\IncidentNotFoundException: 404
        App\Portfolio\Watch\Domain\Exception\WatchedProductNotFoundException: 404
        App\Portfolio\Watch\Domain\Exception\WatchedProductSlugAlreadyUsedException: 409
        # Changer le slug d'un produit suivi revient à en suivre un autre :
        # l'entité ne l'expose pas en écriture, et le refus est explicite plutôt
        # que silencieux (409 comme la collision de slug, c'est bien un conflit
        # avec l'état existant).
        App\Portfolio\Watch\Domain\Exception\WatchedProductSlugIsImmutableException: 409
        # Version obligatoire pour une source « manual », interdite pour une
        # source runtime : c'est une saisie invalide, donc 422 comme les erreurs
        # de validation — surtout pas 500, l'auteur peut corriger lui-même.
        App\Portfolio\Watch\Domain\Exception\InvalidWatchedProductException: 422
        # Point d'audit I3 : remplace un mapping `ValueError: 404` fourre-tout.
        # Celui-ci déguisait en « 404 Not Found » *toute* ValueError levée dans
        # la pile HTTP, y compris un bug sans rapport avec la locale — un vrai
        # défaut serait passé inaperçu sous un 404 plausible. Le segment d'URL
        # {locale} passe désormais par Locale::fromString() (cf. le helper
        # uriVariableLocale du trait ResolvesUriVariables), qui lève cette
        # exception précise. Les champs "locale" des DTO de backoffice, eux,
        # sont déjà bornés en amont par #[Assert\Choice] (422, pas 404).
        App\Portfolio\Shared\Domain\Exception\InvalidLocaleException: 404
        # Spec 0004 D3 : rattacher une entrée à un groupe de traduction. Le
        # groupe qui porte déjà cette langue est un conflit avec l'existant
        # (409), pas une saisie invalide — l'index unique
        # (translation_group, locale) le refuserait de toute façon, mais en 500 ;
        # un groupe qu'aucune entrée du périmètre ne porte, lui, est bien une
        # saisie invalide (422). Les deux portent un `type` stable, le frontend
        # n'a donc pas à lire le `detail` localisé.
        App\Portfolio\Shared\Domain\Exception\TranslationAlreadyExistsException: 409
        App\Portfolio\Shared\Domain\Exception\UnknownTranslationGroupException: 422
        # Spec 0004 D4 : PUT …/order exige l'ensemble exact des clés du
        # périmètre. Une clé inconnue (ou dupliquée) et une clé manquante sont
        # toutes deux une saisie invalide (422), pas une 404 ni un 409 : la
        # ressource visée (l'entrée d'ordre) existe, c'est son contenu qui ne
        # correspond plus au périmètre relu côté serveur — le frontend
        # recharge la liste plutôt que de réessayer l'envoi automatiquement.
        App\Portfolio\Shared\Domain\Exception\UnknownOrderEntryException: 422
        App\Portfolio\Shared\Domain\Exception\IncompleteOrderException: 422
        App\Portfolio\Quality\Domain\Exception\QualityPrincipleNotFoundException: 404
        App\Portfolio\Quality\Domain\Exception\QualityTraitNotFoundException: 404
        App\Portfolio\About\Domain\Exception\AboutSettingsNotFoundException: 404
        App\Portfolio\About\Domain\Exception\AboutSiteCardNotFoundException: 404
        App\Portfolio\About\Domain\Exception\AboutMeCardNotFoundException: 404
        App\Security\User\Domain\Exception\CpgUserNotFoundException: 404
        App\Security\User\Domain\Exception\CannotDeleteOwnAccountException: 409
        App\Security\User\Domain\Exception\CannotDeleteLastSuperAdminException: 409
        App\Security\User\Domain\Exception\CannotModifyOwnRolesException: 409
        App\Security\User\Domain\Exception\CannotDemoteLastSuperAdminException: 409
        App\Security\User\Domain\Exception\EmailAlreadyUsedException: 409
        App\Security\User\Domain\Exception\AccountNotAwaitingActivationException: 409
        # Levée par SendAccountInvitationHandler (worker Messenger async) ;
        # entrée défensive pour un appel direct, même réserve que la remise du
        # message de contact ci-dessus (HandlerFailedException).
        App\Security\User\Domain\Exception\AccountInvitationDeliveryException: 503
        # Parcours public de définition de mot de passe (/api/account/password-setup) :
        # jeton inconnu -> 404, expiré ou déjà consommé -> 410 (cas fusionnés
        # pour ne pas révéler qu'un lien a servi). Le 429 du quota IP vient de
        # PasswordSetupRateLimitExceededException::getStatus() (issue #369).
        App\Security\User\Domain\Exception\InvalidPasswordSetupTokenException: 404
        App\Security\User\Domain\Exception\PasswordSetupTokenExpiredException: 410
        # Corps de requête que le Serializer refuse (JSON illisible, racine qui
        # n'est pas un objet), requalifié à la seule frontière de la
        # désérialisation par MalformedRequestBodyProvider (issue #355) : une
        # classe précise, qui porte son propre `log_level` sans baisser
        # l'encodage de sortie, que l'entrée large ci-dessous rend en 500
        # depuis l'issue #360. Elle reçoit aussi un `id` dans le corps d'un PUT
        # (`api_allow_update: false`, plus bas, issue #373).
        App\Shared\Infrastructure\ApiPlatform\MalformedRequestBodyException: 400
        # --- Défauts d'API Platform, rétablis (audit A15 / T5.1) ---
        # Écrasés depuis toujours par la simple présence de la clé ci-dessus.
        # Conséquence mesurée : sur n'importe quel POST public, un corps qui
        # n'est pas du JSON (« Syntax error ») ou un champ du mauvais type
        # (`{"token":123}`) remontait en **500**, alors que la requête est
        # fautive, pas le serveur — un anonyme pouvait donc produire des 500 à
        # volonté (borné seulement par les quotas par IP) et noyer les vraies
        # erreurs serveur dans les journaux.
        #
        # ExceptionInterface du Serializer couvrait alors les deux cas,
        # NotEncodableValueException (JSON illisible) et
        # NotNormalizableValueException (mauvais type d'attribut), d'où son
        # 400. **Elle ne les couvre plus**, et ce défaut-là n'est donc **pas**
        # rétabli à l'identique (issue #360) : le mauvais type est collecté en
        # 422 (`collect_denormalization_errors`, plus bas), le corps illisible
        # sort en MalformedRequestBodyException (plus haut, issue #355). Ce qui
        # arrive encore ici est un défaut du serveur : un JSON de sortie non
        # encodable (`NaN` d'une colonne `double precision`), un Serializer
        # mal configuré, un format négocié sans encodeur. D'où **500**, en
        # accord avec son niveau : aucun `log_level` ne la vise
        # (ExceptionLogLevelCoverageTest::EXEMPT), elle reste en `critical`.
        # Ce 500 est celui qu'API Platform donnerait sans l'entrée (repli de
        # toute exception non mappée) : elle est gardée à dessein, pour que le
        # choix se lise ici, à l'endroit où l'on « rétablirait le défaut ». Ne
        # pas la remettre à 400 : ServerSideSerializerFailureTest rougirait, et
        # hors debug le `detail` de l'encodeur (« Inf and NaN cannot be JSON
        # encoded ») repartirait chez le visiteur — API Platform ne le masque
        # que sur un 5xx. Volontairement en dernier : c'est l'entrée la plus
        # large de la liste.
        Symfony\Component\Serializer\Exception\ExceptionInterface: 500
        # Même raisonnement, même 500 (issue #373) : API Platform la rend en
        # 400, sous-classe ItemNotFoundException comprise. Le seul chemin
        # client trouvé — un `id` dans le corps d'un PUT, parti en résolution
        # d'IRI — sort désormais en MalformedRequestBodyException
        # (`api_allow_update: false`, plus bas). Reste la pagination (aucun
        # provider de src/ ne pagine : `?page=0` répond 200), l'IriConverter
        # (aucune ressource n'accepte d'IRI du client ; une IRI impossible à
        # générer est un défaut de configuration) et la lecture des
        # métadonnées : des défauts du serveur, en `critical`. Deux chemins
        # client la rouvriraient, en 500 : la pagination, le jour où un
        # provider paginera (`?page=0`), et une relation en `writableLink`,
        # pour laquelle AbstractItemNormalizer::denormalizeRelation repose
        # `api_allow_update: true` (`{"rel":{"id":"x"}}`). Leur donner alors
        # une classe précise, à la #355, avant de les brancher. Ne pas la
        # remettre à 400.
        ApiPlatform\Metadata\Exception\InvalidArgumentException: 500
        # Troisième défaut d'API Platform, `Doctrine\ORM\OptimisticLockException: 409`,
        # **retiré** (issue #373) : aucune entité n'est versionnée (pas de
        # #[ORM\Version] dans src/), et la seule levée possible aujourd'hui,
        # OptimisticLockException::notVersioned(), est une erreur de
        # programmation — un 500 `critical`, ce que donne l'absence d'entrée.
        # Le jour où une entité sera versionnée, le conflit concurrent est un
        # 409 du client : lui donner alors une entrée et un `log_level`.
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        # Arbitrage du 2026-09-22 (reliquat du 3e audit, issue #239). Sans
        # cette option, la première NotNormalizableValueException interrompt la
        # désérialisation et remontait via l'entrée large `ExceptionInterface`
        # ci-dessus, alors à 400 : un champ du mauvais type JSON (`{"name":123}`) répondait
        # un 400 anonyme, sans dire quel champ. Avec elle, le Serializer
        # collecte ces erreurs (PartialDenormalizationException) et API
        # Platform les convertit en ValidationException : **422** avec un
        # tableau `violations` nommant le champ, la forme que les formulaires
        # du frontend affichent déjà pour un Assert. Le JSON illisible, lui,
        # reste un 400 (rien à collecter), tout comme une racine qui n'est pas
        # un objet : MalformedRequestBodyException depuis l'issue #355.
        # MalformedRequestBodyTest épingle les deux frontières.
        collect_denormalization_errors: true
        # Issue #373 : aucune ressource ne se met à jour par IRI. Sans ce
        # réglage, un `id` dans le corps d'un PUT (« standard » en API
        # Platform 4 : aucun objet à peupler) partait en résolution d'IRI
        # (ItemNormalizerTrait::updateObjectToPopulate) et sortait en
        # ItemNotFoundException pour un `id` inconnu, 400 sous l'entrée large
        # d'API Platform mais journalisée `critical`. Avec lui, le Serializer
        # refuse la clé (« Update is not allowed for this operation »), d'où
        # MalformedRequestBodyException, 400 en `info`, quel que soit l'`id`.
        # Un `denormalizationContext` déclaré sur une ressource ou une
        # opération est **fusionné** avec ce défaut
        # (OperationDefaultsTrait::addGlobalDefaults) ; seuls un tableau vide
        # ou un `api_allow_update: true` explicite le neutralisent, ce que
        # MalformedRequestBodyTest::testEveryUpdateOperationRefusesAnUpdateByIri
        # verrait sur chaque PUT/PATCH.
        denormalization_context:
            api_allow_update: false

when@prod:
    api_platform:
        # Coupe /api/docs(.json) et /api/docs.jsonld en production : la SPA
        # appelle des endpoints en dur, personne d'autre n'a besoin du schéma
        # OpenAPI, et le laisser ouvert offrait à un visiteur non authentifié
        # la cartographie complète de l'API — y compris /api/backoffice/*.
        # Reste actif en dev pour l'exploration. Le point d'entrée Hydra /api,
        # lui, est coupé dans tous les environnements (plus haut, issue #360).
        enable_docs: false
