api_platform:
    title: Hello API Platform
    version: 1.0.0
    # Le reste de l'API (/api/me, /api/cv, /api/login_check) répond en JSON
    # brut, jamais en JSON-LD/Hydra : on garde ce même format pour les
    # ApiResource, plutôt que le format jsonld activé par défaut par API
    # Platform, pour que le frontend consomme un simple tableau/objet.
    formats:
        json: ['application/json']
    # Sans ceci, API Platform tente de sérialiser les erreurs (ex. échec de
    # validation Assert sur ContactMessageResource) au format jsonld par
    # défaut, qui n'est pas dans `formats` ci-dessus : 500 "Serialization for
    # the format jsonld is not supported" au lieu du 422 attendu. À défaut
    # d'une ApiResource avec opération d'écriture avant App\Contact, ce
    # défaut de config n'avait encore jamais été exercé.
    error_formats:
        json: ['application/json']
    # Sans cette entrée, ContactRateLimitExceededException remonterait en 500
    # (exception métier non reconnue par API Platform) au lieu du 429 attendu.
    exception_to_status:
        App\Contact\Domain\Exception\ContactRateLimitExceededException: 429
        # Aujourd'hui seulement levée dans SendContactMessageHandler (worker
        # Messenger async, jamais dans la pile HTTP synchrone) : entrée
        # défensive pour éviter un 500 générique si ce handler était un jour
        # invoqué de façon synchrone depuis un Processor API Platform.
        App\Contact\Domain\Exception\ContactMessageDeliveryException: 503
        # Assistant de traduction (ADR 0004) : fournisseur injoignable, délai
        # dépassé ou réponse hors schéma. 503 comme la remise d'un e-mail —
        # le service est indisponible, la requête était bonne — et un `type`
        # stable /errors/translation-unavailable pour le frontend.
        App\Ai\Translation\Domain\Exception\TranslationUnavailableException: 503
        App\Ai\Translation\Domain\Exception\TranslationRateLimitExceededException: 429
        App\Portfolio\Experience\Domain\Exception\ExperienceTechnologyAlreadyExistsException: 409
        App\Portfolio\Experience\Domain\Exception\ExperienceTechnologyNotFoundException: 404
        App\Portfolio\Contribution\Domain\Exception\ContributionNotFoundException: 404
        App\Portfolio\CaseStudy\Domain\Exception\CaseStudyNotFoundException: 404
        App\Portfolio\AnonymousCv\Domain\Exception\AnonymousCvSectionNotFoundException: 404
        App\Portfolio\Incident\Domain\Exception\IncidentNotFoundException: 404
        App\Portfolio\Watch\Domain\Exception\WatchedProductNotFoundException: 404
        App\Portfolio\Watch\Domain\Exception\WatchedProductSlugAlreadyUsedException: 409
        # Changer le slug d'un produit suivi revient à en suivre un autre :
        # l'entité ne l'expose pas en écriture, et le refus est explicite plutôt
        # que silencieux (409 comme la collision de slug, c'est bien un conflit
        # avec l'état existant).
        App\Portfolio\Watch\Domain\Exception\WatchedProductSlugIsImmutableException: 409
        # Version obligatoire pour une source « manual », interdite pour une
        # source runtime : c'est une saisie invalide, donc 422 comme les erreurs
        # de validation — surtout pas 500, l'auteur peut corriger lui-même.
        App\Portfolio\Watch\Domain\Exception\InvalidWatchedProductException: 422
        # Point d'audit I3 : remplace un mapping `ValueError: 404` fourre-tout.
        # Celui-ci déguisait en « 404 Not Found » *toute* ValueError levée dans
        # la pile HTTP, y compris un bug sans rapport avec la locale — un vrai
        # défaut serait passé inaperçu sous un 404 plausible. Le segment d'URL
        # {locale} passe désormais par Locale::fromString() (cf. le helper
        # uriVariableLocale du trait ResolvesUriVariables), qui lève cette
        # exception précise. Les champs "locale" des DTO de backoffice, eux,
        # sont déjà bornés en amont par #[Assert\Choice] (422, pas 404).
        App\Portfolio\Shared\Domain\Exception\InvalidLocaleException: 404
        # Spec 0004 D3 : rattacher une entrée à un groupe de traduction. Le
        # groupe qui porte déjà cette langue est un conflit avec l'existant
        # (409), pas une saisie invalide — l'index unique
        # (translation_group, locale) le refuserait de toute façon, mais en 500 ;
        # un groupe qu'aucune entrée du périmètre ne porte, lui, est bien une
        # saisie invalide (422). Les deux portent un `type` stable, le frontend
        # n'a donc pas à lire le `detail` localisé.
        App\Portfolio\Shared\Domain\Exception\TranslationAlreadyExistsException: 409
        App\Portfolio\Shared\Domain\Exception\UnknownTranslationGroupException: 422
        # Spec 0004 D4 : PUT …/order exige l'ensemble exact des clés du
        # périmètre. Une clé inconnue (ou dupliquée) et une clé manquante sont
        # toutes deux une saisie invalide (422), pas une 404 ni un 409 : la
        # ressource visée (l'entrée d'ordre) existe, c'est son contenu qui ne
        # correspond plus au périmètre relu côté serveur — le frontend
        # recharge la liste plutôt que de réessayer l'envoi automatiquement.
        App\Portfolio\Shared\Domain\Exception\UnknownOrderEntryException: 422
        App\Portfolio\Shared\Domain\Exception\IncompleteOrderException: 422
        App\Portfolio\Quality\Domain\Exception\QualityPrincipleNotFoundException: 404
        App\Portfolio\Quality\Domain\Exception\QualityTraitNotFoundException: 404
        App\Portfolio\About\Domain\Exception\AboutSettingsNotFoundException: 404
        App\Portfolio\About\Domain\Exception\AboutSiteCardNotFoundException: 404
        App\Portfolio\About\Domain\Exception\AboutMeCardNotFoundException: 404
        App\Security\User\Domain\Exception\CpgUserNotFoundException: 404
        App\Security\User\Domain\Exception\CannotDeleteOwnAccountException: 409
        App\Security\User\Domain\Exception\CannotDeleteLastSuperAdminException: 409
        App\Security\User\Domain\Exception\CannotModifyOwnRolesException: 409
        App\Security\User\Domain\Exception\CannotDemoteLastSuperAdminException: 409
        App\Security\User\Domain\Exception\EmailAlreadyUsedException: 409
        App\Security\User\Domain\Exception\AccountNotAwaitingActivationException: 409
        # Levée par SendAccountInvitationHandler (worker Messenger async) ;
        # entrée défensive au cas où l'envoi serait un jour synchrone.
        App\Security\User\Domain\Exception\AccountInvitationDeliveryException: 503
        # Parcours public de définition de mot de passe (/api/account/password-setup) :
        # jeton inconnu -> 404, expiré ou déjà consommé -> 410 (cas fusionnés
        # pour ne pas révéler qu'un lien a servi), quota IP dépassé -> 429.
        App\Security\User\Domain\Exception\InvalidPasswordSetupTokenException: 404
        App\Security\User\Domain\Exception\PasswordSetupTokenExpiredException: 410
        App\Security\User\Domain\Exception\PasswordSetupRateLimitExceededException: 429
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

when@prod:
    api_platform:
        # Coupe /api/docs(.json), /api/docs.jsonld et le point d'entrée Hydra
        # /api en production : la SPA appelle des endpoints en dur, personne
        # d'autre n'a besoin du schéma OpenAPI, et le laisser ouvert offrait à
        # un visiteur non authentifié la cartographie complète de l'API — y
        # compris /api/backoffice/*. Reste actif en dev pour l'exploration.
        enable_docs: false
        enable_entrypoint: false
