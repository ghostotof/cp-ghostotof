# Symfony AI — socle de l'ADR 0004 (assistance IA). Deux agents, jamais sur un
# chemin de rendu public (règle héritée de l'ADR 0002) : le traducteur du
# backoffice (ROLE_SUPER, Anthropic) et l'assistant de parcours (ROLE_TRUSTED,
# Scaleway, ADR 0004 D7 amendée). Seule la plateforme Anthropic est déclarée
# ici : celle de Scaleway l'est dans services.yaml (spec 0005 D2).
#
# La recette Flex de symfony/ai-anthropic-platform génère un fichier séparé
# (ai_anthropic_platform.yaml) : il a été fusionné ici pour que la plateforme et
# l'agent qui la consomme se lisent d'un seul tenant. Si `composer recipes:update`
# le recrée, le supprimer à nouveau plutôt que d'avoir deux sources.
ai:
    platform:
        anthropic:
            api_key: '%env(ANTHROPIC_API_KEY)%'
            # Client HTTP dédié (cf. framework.yaml) : timeout 40 s sous les 60 s
            # de nginx et de l'ingress, max_redirects 0 comme pour Portfolio/Watch.
            http_client: 'ai.http_client'

    agent:
        # Traducteur FR/EN du backoffice (contexte Ai/Translation, spec 0002).
        # Consommé uniquement via App\Ai\Translation\Infrastructure\SymfonyAi\
        # SymfonyAiContentTranslator, seule classe du projet à importer Symfony\AI.
        translator:
            platform: 'ai.platform.anthropic'
            model:
                name: 'claude-sonnet-5'
                options:
                    # Nom Anthropic (« max_tokens », pas « max_output_tokens ») : le
                    # bridge fusionne les options telles quelles dans le corps de la
                    # requête. Plafond de sortie = première borne de coût (ADR 0004
                    # D5), avec le quota par compte et le timeout du client HTTP.
                    # Aucun paramètre d'échantillonnage : claude-sonnet-5 refuse
                    # temperature/top_p/top_k (400).
                    max_tokens: 4096
            prompt:
                file: '%kernel.project_dir%/config/ai/prompts/translator.txt'
            # Aucun outil : l'agent traduit, il n'agit pas. Rien à exposer, rien à
            # détourner par injection de prompt.
            tools: false

        # Assistant « interrogez mon parcours » (contexte Ai/Assistant, spec 0005).
        # Le CV nominatif n'est envoyé qu'à ce modèle, opéré par l'hébergeur du
        # site (Scaleway, fr-par — ADR 0004 D3 amendée).
        career_assistant:
            # Id de service, pas un type de plateforme du bundle : cf. services.yaml.
            platform: 'app.ai.platform.scaleway'
            model:
                # Changer de modèle chez Scaleway est de la configuration (spec D3) ;
                # changer d'opérateur demande un amendement de l'ADR.
                name: 'mistral-small-3.2-24b-instruct-2506'
                options:
                    # Plafond de sortie, l'une des quatre bornes de coût (spec D6).
                    # Aucun paramètre d'échantillonnage en v1 (spec D3).
                    max_tokens: 1024
            # Préambule fixe seulement : le corpus est ajouté à chaque requête par
            # l'application (spec D8), jamais précalculé.
            prompt:
                file: '%kernel.project_dir%/config/ai/prompts/career_assistant.txt'
            # Aucun outil : le corpus est dans le contexte, rien à exposer à une
            # injection de prompt (spec 0005, ADR 0004 D7).
            tools: false
