# Serveur MCP du portfolio (ADR 0006, spec 0007) : le canal par lequel
# l'assistant IA d'une personne interroge le site. Lecture seule, aucun appel
# de modèle ; chaque outil rend exactement ce que sert la route du même palier
# (ADR 0006 D1). Le bundle et le SDK sont pinnés en version exacte dans
# composer.json (D7).
mcp:
    servers:
        portfolio:
            name: cp-ghostotof
            version: 0.1.0
            # Lu par n'importe quel client, donc au palier anonyme : rien ici ne
            # nomme l'auteur (ADR 0006 D8).
            description: 'Read-only access to the portfolio of the site''s author.'
            instructions: >-
                This server gives read-only access to the portfolio of the site's author:
                technical background, quality principles, contributions, production incidents,
                tech watch and more. Each tool returns exactly what the matching page of the
                site serves, in French or English. Call the tools rather than guess, and say
                when a question is not covered by what they return.
            transports:
                http: true
                stdio: false
            http:
                # Sous /api : l'Ingress n'envoie au backend que ce préfixe
                # (ADR 0006, alternatives écartées). Écrit une fois, dans la
                # constante (#673) ; McpEndpointPathTest compare le firewall,
                # nginx et le front à sa valeur.
                path: !php/const App\Mcp\Infrastructure\Http\McpEndpoint::PATH
                # Protection contre le rebond DNS, en-tête Host : seul l'hôte du
                # site est servi, casse et port ignorés. Dérivé de l'URL publique
                # déjà posée par overlay, pour n'avoir qu'une source ; `localhost`
                # en dev et en test.
                allowed_hosts: ['%env(key:host:url:APP_FRONTEND_BASE_URL)%']
                # Même protection, en-tête Origin (#731). Le SDK de la version
                # épinglée (composer.json, DnsRebindingProtectionMiddleware) ne
                # juge que l'en-tête présent, et le compare **schéma et port
                # compris**, par égalité stricte après mise en minuscules, à
                # deux choses : l'origine de la requête elle-même, toujours
                # admise (port par défaut écrit ou non), et cette liste. Il
                # normalise la valeur écrite ici — minuscules, barre finale et
                # port par défaut retirés —, jamais l'en-tête reçu : un
                # navigateur l'envoie déjà sous cette forme.
                # L'origine du site est donc admise en plus de celle de l'API :
                # en dev le site, sur Vite, n'en est pas une page (autre port) ;
                # en préprod et en prod c'est la même. Rien d'autre : MCP
                # Inspector, `null` (iframe isolée, file://), un Origin vide et
                # toute page tierce reçoivent 403 « Forbidden: Invalid Origin
                # header. ». Une seule source avec allowed_hosts, donc aucun
                # écart possible entre l'URL du site et l'origine admise ; en
                # contrepartie APP_FRONTEND_BASE_URL doit rester une origine,
                # sans chemin (`*` ouvrirait tout, une valeur vide admettrait
                # un Origin vide) : McpAllowedOriginPerEnvironmentTest l'exige
                # dans chaque environnement.
                allowed_origins: ['%env(APP_FRONTEND_BASE_URL)%']
            # ADR 0005 : deux réplicas, un disque en lecture seule. Le store
            # par défaut (un fichier sous var/cache) n'y fonctionne pas ; les
            # sessions vivent dans un pool DBAL (cache.yaml), dont chaque valeur
            # est authentifiée par AuthenticatedCacheMarshaller (issue #468).
            session:
                store: cache
                cache_pool: app.mcp.session_cache
                ttl: 3600
            # Ce que le serveur expose : les outils et les prompts du contexte
            # Mcp, rien d'autre (le bundle refuse un motif qui ne désigne aucun
            # service).
            registry:
                tools: ['App\Mcp\Presentation\Tool\']
                prompts: ['App\Mcp\Presentation\Prompt\']
