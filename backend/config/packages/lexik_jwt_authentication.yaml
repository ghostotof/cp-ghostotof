lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 3600

    # Tolérance d'horloge, en secondes (#748, A3-9, décision de l'auteur du 2026-10-29) : deux pods
    # dont les horloges divergent de quelques secondes ne doivent pas refuser un jeton légitime — un
    # `iat` en avance d'une seconde est un 401, et depuis F1 ce 401 efface les deux cookies, donc la
    # session. Défaut du bundle : 0. Elle relâche **aussi `exp`** (Lexik 3.2, LoadedJWS et
    # LcobucciJWSProvider::verify()) : un jeton expiré est servi jusqu'à cinq secondes de plus, c'est
    # la raison de ne pas aller au-delà. `nbf`, que le site ne pose pas, suivrait la même règle. Le
    # consentement MCP lit `iat` pour ses dix minutes de fraîcheur (JwtAuthenticationInstant) : un
    # `iat` jusqu'à cinq secondes dans le futur y donne un âge négatif, donc « récent » — sans
    # conséquence. `cv` (CredentialsVersionClaim) ne lit aucune date.
    # JwtClockSkewTest épingle la valeur et les deux bornes.
    clock_skew: 5

    # Le token ne voyage jamais dans le header Authorization : uniquement dans le
    # cookie httpOnly "BEARER" (inaccessible en JS, protégé du vol par XSS).
    token_extractors:
        authorization_header:
            enabled: false
        cookie:
            enabled: true
            name: BEARER

    # Défaut du bundle (true) : le token n'est jamais dupliqué dans le corps JSON
    # de la réponse de login dès lors qu'un cookie est utilisé pour le transporter.
    remove_token_from_body_when_cookies_used: true

    set_cookies:
        BEARER:
            # 0 = cookie de session, sans Expires ni Max-Age (#748, F1) : fermer le navigateur
            # (sans restauration de session) finit la session, en lecture comme en écriture. Le JWT
            # garde son `exp` (token_ttl) ; le XSRF-TOKEN est lui aussi un cookie de session
            # (AuthCookieFactory), et StaleSessionCookiesClearingListener efface les deux au premier
            # 401 d'un cookie refusé. AuthCookieAttributesTest pin le résultat sur la vraie réponse.
            lifetime: 0
            samesite: lax
            path: /
            httpOnly: true
            # Secure partout sauf en dev (#714), comme AuthCookieFactory : test le porte,
            # pour qu'AuthCookieAttributesTest le lise sur la vraie chaîne de pose.
            # BearerCookieSecurePerEnvironmentTest exige cette valeur dans chaque environnement (#703).
            secure: true

# http en dev (localhost:8080 sans TLS) : Chrome et Firefox y acceptent un cookie Secure
# (localhost est un contexte sûr), pas tous les navigateurs, et aucun sur une autre adresse.
when@dev:
    lexik_jwt_authentication:
        set_cookies:
            BEARER:
                secure: false
