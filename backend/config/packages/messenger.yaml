framework:
    messenger:
        # Messages épuisant leurs tentatives de retry (SMTP indisponible, etc.)
        # sont envoyés ici plutôt que perdus silencieusement. Depuis `make sh` :
        # `php bin/console messenger:failed:show` pour les inspecter,
        # `php bin/console messenger:consume failed -vv` pour les rejouer.
        failure_transport: failed

        # Toute enveloppe porte un MAC vérifié avant tout unserialize() (issue
        # #444, AuthenticatedEnvelopeSerializer) : les deux transports en héritent.
        serializer:
            default_serializer: App\Shared\Infrastructure\Messenger\AuthenticatedEnvelopeSerializer

        buses:
            messenger.bus.default:
                middleware:
                    # Issue #491 : la panne de la file devient le 503 que nomme
                    # le message (AsyncMessageInterface), écrit une fois. Symfony
                    # le place avant send_message, qu'il entoure.
                    - App\Shared\Infrastructure\Messenger\QueueUnavailableMiddleware

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # RabbitMQ. Consommé par `make consume` en dev, et par le Deployment
            # `worker` en préprod/prod (k8s/base/messenger-worker-deployment.yaml).
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    # Issue #479 : attendre l'accusé du broker. Sans lui, un refus
                    # (max_message_size de #477, broker qui se coupe) est
                    # asynchrone : le dispatch réussit et le message est perdu en
                    # silence. Avec, il lève une TransportException (500 pour le
                    # contact). 5 s pour l'accusé ; AmqpPublisherConfirmsTest borne
                    # cette option et les quatre suivantes.
                    confirm_timeout: 5
                    # Les attentes qui la précèdent : ext-amqp les laisse
                    # illimitées, et confirm.select comme la déclaration de
                    # l'échange sont des allers-retours. Un broker qui accepte le
                    # TCP sans répondre tenait une requête jusqu'aux 65 s du
                    # request_terminate_timeout. Sans effet sur le worker au
                    # repos : il interroge la file par basic.get, rien n'attend.
                    connect_timeout: 5
                    read_timeout: 5
                    write_timeout: 5
                    rpc_timeout: 5
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            # Jamais Symfony\Component\Mailer\Messenger\SendEmailMessage (ni un
            # joker qui l'atteint) : l'e-mail partirait non rendu, jeton
            # d'invitation compris, dans la file puis le failure_transport
            # (issue #426, garde SendEmailMessageStaysSynchronousTest).
            'App\Contact\Application\Message\SendContactMessageMessage': async
            'App\Security\User\Application\Message\SendAccountInvitationMessage': async
            # Issue #470 : le témoin du smoke préprod fait le trajet réel, par la file.
            'App\Shared\Application\Message\MessengerProbeMessage': async

when@test:
    framework:
        messenger:
            transports:
                # Pas de vrai broker en test : le message est traité en mémoire,
                # synchronement, ce qui permet aux tests d'asserter son contenu
                # sans dépendre de RabbitMQ (cf. zenstruck/messenger-test si des
                # assertions plus riches deviennent nécessaires).
                async: 'in-memory://'
