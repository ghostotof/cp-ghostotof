framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # RabbitMQ (service "rabbitmq" du docker-compose racine), consommé par
            # `make consume` (messenger:consume async -vv).
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            'App\Contact\Application\Message\SendContactMessageMessage': async

when@test:
    framework:
        messenger:
            transports:
                # Pas de vrai broker en test : le message est traité en mémoire,
                # synchronement, ce qui permet aux tests d'asserter son contenu
                # sans dépendre de RabbitMQ (cf. zenstruck/messenger-test si des
                # assertions plus riches deviennent nécessaires).
                async: 'in-memory://'
