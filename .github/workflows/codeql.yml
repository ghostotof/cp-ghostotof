name: CodeQL

# Remplace le template GitLab Security/SAST.gitlab-ci.yml (Ultimate) — gratuit
# et natif sur un dépôt GitHub public. CodeQL ne supporte pas PHP (backend) :
# seul le frontend (javascript-typescript) est couvert ici. Le SAST du backend
# PHP est assuré par le job `sast-backend` de pipeline.yml (Psalm en analyse de
# teinte, point d'audit M4).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '23 4 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: '/language:${{ matrix.language }}'
