name: CodeQL

# Remplace le template GitLab Security/SAST.gitlab-ci.yml (Ultimate) — gratuit
# et natif sur un dépôt GitHub public. CodeQL ne supporte pas PHP (backend) :
# seul le frontend (javascript-typescript) est couvert ici. Le SAST du backend
# PHP est assuré par le job `sast-backend` de pipeline.yml (Psalm en analyse de
# teinte, point d'audit M4).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '23 4 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Habituel ~75 s, téléchargement du bundle CodeQL compris. Sans limite,
    # GitHub laisse un job tourner 360 minutes (issue #285).
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
