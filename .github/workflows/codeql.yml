name: CodeQL

# Remplace le template GitLab Security/SAST.gitlab-ci.yml (Ultimate) — gratuit
# et natif sur un dépôt GitHub public. CodeQL ne supporte pas PHP (backend) :
# seul le frontend (javascript-typescript) est couvert ici. Pas d'équivalent
# CodeQL pour le backend PHP à ce stade — à retravailler séparément si un SAST
# PHP est souhaité (ex. Psalm en mode sécurité).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '23 4 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: '/language:${{ matrix.language }}'
