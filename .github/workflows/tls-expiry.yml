name: Certificats TLS

# Contrôle quotidien des certificats servis (issue #719). Pourquoi, avec quels
# seuils et quelles limites : .claude/rules/deploiement.md, puce « The served
# certificates are checked every day ». Le statut des `Certificate`
# cert-manager, qui demande un accès au cluster, est suivi dans #722.
#
# Un workflow à part, jamais un `schedule:` dans pipeline.yml : un run planifié
# s'exécute sur `refs/heads/main`, où les conditions `github.ref ==
# 'refs/heads/main'` de pipeline.yml lanceraient deploy-prod.
#
# Le signal est le run rouge, envoyé par e-mail à qui a modifié le cron en
# dernier (si ses notifications Actions sont actives). Deux limites de GitHub :
# un `schedule` ne tourne que depuis la branche par défaut, et GitHub le
# désactive sans bruit après 60 jours sans activité sur un dépôt public.

on:
  schedule:
    # Tous les jours à 06:17 UTC, hors de l'heure pile où GitHub retarde les
    # runs planifiés.
    - cron: '17 6 * * *'
  # Pour un contrôle à la demande, après un renouvellement par exemple.
  workflow_dispatch:

# Une poignée de main TLS par hôte : rien à écrire, aucun secret, aucun
# environnement (la Basic Auth de préprod ne joue qu'au niveau HTTP).
permissions:
  contents: read

jobs:
  tls-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # habituel ~15 s, checkout compris ; 10 s au plus par hôte
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Chaque hôte TLS des Ingress de k8s/, ni plus ni moins :
      # TlsExpiryWatchCoversEveryIngressHostTest compare cette ligne aux
      # manifests.
      - name: Validité des certificats servis
        run: tools/check-tls-expiry.sh cp-ghostotof.com www.cp-ghostotof.com preprod.cp-ghostotof.com
