name: Pipeline

# Portage de l'ancien .gitlab-ci.yml : tests sur chaque push (branche ou tag),
# reste de la chaîne (build → deploy preprod → smoke-test/audit (gate) →
# rollback auto → deploy prod (approbation manuelle) → audit post-promotion)
# uniquement sur tag Git — voir docs/agents/ pour le contexte de la migration.

on:
  push:
  pull_request:

# Moindre privilège pour le GITHUB_TOKEN : lecture seule par défaut sur tous
# les jobs. Les jobs qui écrivent (build-images -> packages: write) élèvent
# leurs propres permissions localement.
permissions:
  contents: read

env:
  IMAGE_BACKEND: ghcr.io/ghostotof/cp-ghostotof-backend
  IMAGE_FRONTEND: ghcr.io/ghostotof/cp-ghostotof-frontend

jobs:
  # ---------------------------------------------------------------------------
  # test — toujours exécutés
  # ---------------------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: cp_ghostotof
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d cp_ghostotof"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://app:app@localhost:5432/cp_ghostotof?serverVersion=18&charset=utf8'
      APP_ENV: test
      COMPOSER_ALLOW_SUPERUSER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, zip, sockets, amqp-2.2.0
          coverage: none
      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Audit des dépendances PHP (bloquant)
        working-directory: backend
        # Compare composer.lock aux avis de sécurité connus (packagist).
        # --no-dev : ne bloque que sur une dépendance de production vulnérable ;
        # les avis sur l'outillage de dev (phpunit, maker...) ne cassent pas le
        # pipeline mais restent à traiter via Dependabot (.github/dependabot.yml).
        run: composer audit --no-dev --no-interaction
      - name: Génère les secrets d'environnement de test (jamais commités, cf. .gitignore)
        # backend/.env.test n'est plus versionné (alerte GitGuardian sur sa
        # copie .env.dev jumelle) : les valeurs sont générées à la volée,
        # propres à chaque run, dans .env.test.local (déjà gitignored via
        # /.env.*.local).
        working-directory: backend
        run: |
          cat > .env.test.local <<EOF
          KERNEL_CLASS='App\Kernel'
          APP_SECRET=$(openssl rand -hex 16)
          JWT_PASSPHRASE=$(openssl rand -hex 33)
          CV_FILE_PATH=%kernel.project_dir%/tests/Portfolio/Cv/Fixtures/dummy.pdf
          EOF
      - name: Génère le keypair JWT (jamais commité, cf. .gitignore)
        working-directory: backend
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction
      - name: Prépare la base de test
        working-directory: backend
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction
      - name: PHPUnit
        working-directory: backend
        run: php bin/phpunit

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
      - working-directory: frontend
        run: npm ci
      - name: Audit des dépendances npm (bloquant sur high/critical)
        working-directory: frontend
        run: npm audit --audit-level=high
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # sast-backend — analyse de teinte Psalm (point d'audit M4). CodeQL ne
  # couvre que le frontend (PHP non supporté) ; ce job trace le flux d'une
  # donnée externe jusqu'à un puits dangereux (SQL, shell, include, en-têtes,
  # sortie HTML). Bloquant. Purement statique : ni base ni keypair JWT.
  # ---------------------------------------------------------------------------
  sast-backend:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql
          coverage: none
      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Psalm (analyse de teinte, bloquant)
        working-directory: backend
        run: vendor/bin/psalm.phar --taint-analysis --no-cache --no-progress --output-format=github

  # ---------------------------------------------------------------------------
  # phpstan-backend — analyse statique PHPStan (niveau max + strict-rules +
  # extensions Symfony/Doctrine/PHPUnit). Bloquant, sans baseline : src/ et
  # tests/ sont au vert. Réchauffe le conteneur dev au préalable (phpstan-symfony
  # lit var/cache/dev/App_KernelDevDebugContainer.xml) ; le keypair JWT est
  # requis pour que tests/object-manager.php (phpstan-doctrine) boote le kernel.
  # ---------------------------------------------------------------------------
  phpstan-backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: dev
      COMPOSER_ALLOW_SUPERUSER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql
          coverage: none
      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Génère le keypair JWT (boot du kernel par object-manager.php)
        working-directory: backend
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction
      - name: Réchauffe le conteneur dev (phpstan-symfony)
        working-directory: backend
        run: php bin/console cache:warmup --env=dev
      - name: PHPStan (niveau max, bloquant)
        working-directory: backend
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  # ---------------------------------------------------------------------------
  # rector-backend — Rector en --dry-run (bloquant) : le code doit rester
  # conforme aux règles de rector.php (modernisation PHP + qualité). Purement
  # statique (AST), ni base ni conteneur.
  # ---------------------------------------------------------------------------
  rector-backend:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql
          coverage: none
      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Rector (--dry-run, bloquant)
        working-directory: backend
        run: vendor/bin/rector process --dry-run --no-progress-bar

  # ---------------------------------------------------------------------------
  # build — une image prod + une image preprod, backend et frontend.
  # Uniquement sur tag (équivalent `.only-tag` de l'ancien pipeline GitLab).
  # ---------------------------------------------------------------------------
  build-images:
    needs: [test-backend, test-frontend, sast-backend, phpstan-backend, rector-backend]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (prod + preprod, backend + frontend)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make build-prod           IMAGE=$IMAGE_BACKEND        TAG=$TAG
          make build-preprod        IMAGE=$IMAGE_BACKEND        TAG=$TAG
          make build-front-prod     FRONT_IMAGE=$IMAGE_FRONTEND TAG=$TAG
          make build-front-preprod  FRONT_IMAGE=$IMAGE_FRONTEND TAG=$TAG
          docker push "$IMAGE_BACKEND:$TAG"
          docker push "$IMAGE_BACKEND:$TAG-preprod"
          docker push "$IMAGE_FRONTEND:$TAG"
          docker push "$IMAGE_FRONTEND:$TAG-preprod"

  # ---------------------------------------------------------------------------
  # deploy-preprod
  # ---------------------------------------------------------------------------
  deploy-preprod:
    needs: [build-images]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: preprod
      url: https://preprod.cp-ghostotof.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PREPROD }}" > ~/.kube/config
      - name: Deploy
        working-directory: k8s/overlays/preprod
        env:
          TAG: ${{ github.ref_name }}
        run: |
          kustomize edit set image backend=$IMAGE_BACKEND:$TAG-preprod frontend=$IMAGE_FRONTEND:$TAG-preprod
          kubectl apply -k .
          kubectl -n preprod rollout status deployment/backend --timeout=180s
          kubectl -n preprod rollout status deployment/frontend --timeout=180s
          kubectl -n preprod exec deploy/backend -c php-fpm -- php bin/console doctrine:migrations:migrate --no-interaction

  # ---------------------------------------------------------------------------
  # test-preprod — smoke tests + audit boîte noire (gate bloquant)
  # ---------------------------------------------------------------------------
  smoke-test-preprod:
    needs: [deploy-preprod]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Smoke tests
        run: |
          curl -fsS https://preprod.cp-ghostotof.com/healthz
          status=$(curl -s -o /dev/null -w '%{http_code}' https://preprod.cp-ghostotof.com/api/me)
          if [ "$status" != "401" ]; then
            echo "GET /api/me a répondu $status (401 attendu, non authentifié) : l'API ne semble pas avoir démarré correctement"
            exit 1
          fi
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PREPROD }}" > ~/.kube/config
      # Incident v0.5.0 : RabbitMQ en CrashLoopBackOff (donc le worker aussi,
      # par dépendance) n'était détecté ni par /healthz ni par /api/me — les
      # deux endpoints HTTP démarrent très bien même sans broker AMQP
      # fonctionnel, seule la publication d'un message (POST /api/contact)
      # échouait réellement. `rollout status` échoue/timeout si le déploiement
      # n'atteint jamais l'état Ready, ce qui aurait fait échouer ce job et
      # déclenché rollback-preprod avant même d'arriver au gate deploy-prod.
      - name: Vérifie RabbitMQ et le worker
        run: |
          kubectl -n preprod rollout status deployment/rabbitmq --timeout=60s
          kubectl -n preprod rollout status deployment/worker --timeout=60s

  # Gate bloquant : une régression de sécurité en préprod empêche d'atteindre
  # le gate d'approbation manuelle de deploy-prod (cf. son `needs`).
  audit-preprod:
    needs: [deploy-preprod]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Audit préprod
        run: ./tools/audit-prod.sh preprod.cp-ghostotof.com

  # ---------------------------------------------------------------------------
  # cleanup-preprod — seulement si smoke-test-preprod/audit-preprod échoue
  # ---------------------------------------------------------------------------
  rollback-preprod:
    needs: [smoke-test-preprod, audit-preprod]
    if: failure() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PREPROD }}" > ~/.kube/config
      - name: Rollback
        run: |
          kubectl -n preprod rollout undo deployment/backend
          kubectl -n preprod rollout undo deployment/frontend

  # ---------------------------------------------------------------------------
  # deploy-prod — approbation manuelle (protection de l'environnement
  # `production`, reviewer requis configuré côté GitHub), aucun rebuild :
  # promeut l'image déjà construite et validée en préprod.
  # ---------------------------------------------------------------------------
  deploy-prod:
    needs: [smoke-test-preprod, audit-preprod]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cp-ghostotof.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" > ~/.kube/config
      - name: Deploy
        working-directory: k8s/overlays/prod
        env:
          TAG: ${{ github.ref_name }}
        run: |
          kustomize edit set image backend=$IMAGE_BACKEND:$TAG frontend=$IMAGE_FRONTEND:$TAG
          kubectl apply -k .
          kubectl -n prod rollout status deployment/backend --timeout=180s
          kubectl -n prod rollout status deployment/frontend --timeout=180s
          kubectl -n prod exec deploy/backend -c php-fpm -- php bin/console doctrine:migrations:migrate --no-interaction

  # ---------------------------------------------------------------------------
  # audit-prod — vérification post-promotion, non bloquant (pas de rollback
  # auto en prod, contrairement à rollback-preprod).
  # ---------------------------------------------------------------------------
  audit-prod:
    needs: [deploy-prod]
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Audit prod
        run: ./tools/audit-prod.sh cp-ghostotof.com
