name: Pipeline

# Portage de l'ancien .gitlab-ci.yml : tests sur chaque push (branche ou tag),
# reste de la chaîne (build → deploy preprod → smoke-test/audit (gate) →
# rollback auto → deploy prod (approbation manuelle) → audit post-promotion)
# uniquement sur tag Git — voir docs/agents/ pour le contexte de la migration.

on:
  push:
  pull_request:

# Moindre privilège pour le GITHUB_TOKEN : lecture seule par défaut sur tous
# les jobs. Les jobs qui écrivent (build-images -> packages: write) élèvent
# leurs propres permissions localement.
permissions:
  contents: read

env:
  IMAGE_BACKEND: ghcr.io/ghostotof/cp-ghostotof-backend
  IMAGE_FRONTEND: ghcr.io/ghostotof/cp-ghostotof-frontend

jobs:
  # ---------------------------------------------------------------------------
  # test — toujours exécutés
  # ---------------------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: cp_ghostotof
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d cp_ghostotof"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://app:app@localhost:5432/cp_ghostotof?serverVersion=18&charset=utf8'
      APP_ENV: test
      COMPOSER_ALLOW_SUPERUSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, zip, sockets, amqp-2.2.0
          coverage: none
      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Audit des dépendances PHP (bloquant)
        working-directory: backend
        # Compare composer.lock aux avis de sécurité connus (packagist).
        # --no-dev : ne bloque que sur une dépendance de production vulnérable ;
        # les avis sur l'outillage de dev (phpunit, maker...) ne cassent pas le
        # pipeline mais restent à traiter via Dependabot (.github/dependabot.yml).
        run: composer audit --no-dev --no-interaction
      - name: Génère les secrets d'environnement de test (jamais commités, cf. .gitignore)
        # backend/.env.test n'est plus versionné (alerte GitGuardian sur sa
        # copie .env.dev jumelle) : les valeurs sont générées à la volée,
        # propres à chaque run, dans .env.test.local (déjà gitignored via
        # /.env.*.local).
        working-directory: backend
        run: |
          cat > .env.test.local <<EOF
          KERNEL_CLASS='App\Kernel'
          APP_SECRET=$(openssl rand -hex 16)
          JWT_PASSPHRASE=$(openssl rand -hex 33)
          CV_FILE_PATH=%kernel.project_dir%/tests/Portfolio/Cv/Fixtures/dummy.pdf
          EOF
      - name: Génère le keypair JWT (jamais commité, cf. .gitignore)
        working-directory: backend
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction
      - name: Prépare la base de test
        working-directory: backend
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction
      - name: PHPUnit
        working-directory: backend
        run: php bin/phpunit --log-junit "$RUNNER_TEMP/junit.xml"
      # Carte de synthèse sur la page du run, dans l'esprit de celle que Vitest
      # écrit lui-même (reporter github-actions intégré) : PHPUnit n'en produit
      # pas, le script la construit depuis le rapport JUnit. `if: always()` :
      # c'est précisément quand ça échoue qu'elle sert. Le statut du job reste
      # celui de l'étape PHPUnit.
      - name: Résumé PHPUnit
        if: always()
        run: php .github/scripts/summary-phpunit.php "$RUNNER_TEMP/junit.xml" >> "$GITHUB_STEP_SUMMARY"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'
      - working-directory: frontend
        run: npm ci
      - name: Audit des dépendances npm (bloquant sur high/critical)
        working-directory: frontend
        run: npm audit --audit-level=high
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      # La génération de la carte Open Graph tourne ici, sur chaque push, et pas
      # seulement dans build-images (qui ne s'exécute que sur un tag). Le script
      # dépend d'outils système — Chrome, ImageMagick, polices — dont les
      # versions dérivent sur les runners : la release v0.7.0 a échoué parce
      # qu'il supposait ImageMagick 7 alors qu'Ubuntu livre la 6. Un tel écart
      # doit se voir sur une branche, pas au moment de livrer.
      - name: Dépendances de rendu de la carte Open Graph
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            imagemagick fonts-dejavu-core fonts-liberation
      - name: Génération de la carte Open Graph (contrôle du script)
        working-directory: frontend
        run: npm run og:generate

  # ---------------------------------------------------------------------------
  # sast-backend — analyse de teinte Psalm (point d'audit M4). CodeQL ne
  # couvre que le frontend (PHP non supporté) ; ce job trace le flux d'une
  # donnée externe jusqu'à un puits dangereux (SQL, shell, include, en-têtes,
  # sortie HTML). Bloquant. Purement statique : ni base ni keypair JWT.
  # ---------------------------------------------------------------------------
  sast-backend:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql
          coverage: none
      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Psalm (analyse de teinte, bloquant)
        working-directory: backend
        # `shell: bash` explicite pour `pipefail` : sans lui, le `tee` masquerait
        # le code de sortie de Psalm et le job passerait au vert avec des erreurs.
        shell: bash
        run: vendor/bin/psalm.phar --taint-analysis --no-cache --no-progress --output-format=github | tee "$RUNNER_TEMP/psalm.log"
      - name: Résumé Psalm
        if: always()
        run: .github/scripts/summary-annotations.sh "Psalm (analyse de teinte)" "$RUNNER_TEMP/psalm.log" '^Psalm was able to infer types' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # phpstan-backend — analyse statique PHPStan (niveau max + strict-rules +
  # extensions Symfony/Doctrine/PHPUnit). Bloquant, sans baseline : src/ et
  # tests/ sont au vert. Réchauffe le conteneur dev au préalable (phpstan-symfony
  # lit var/cache/dev/App_KernelDevDebugContainer.xml) ; le keypair JWT est
  # requis pour que tests/object-manager.php (phpstan-doctrine) boote le kernel.
  # ---------------------------------------------------------------------------
  phpstan-backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: dev
      COMPOSER_ALLOW_SUPERUSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql
          coverage: none
      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Génère le keypair JWT (boot du kernel par object-manager.php)
        working-directory: backend
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction
      - name: Réchauffe le conteneur dev (phpstan-symfony)
        working-directory: backend
        run: php bin/console cache:warmup --env=dev
      - name: PHPStan (niveau max, bloquant)
        working-directory: backend
        shell: bash   # pipefail, cf. sast-backend
        run: vendor/bin/phpstan analyse --no-progress --error-format=github | tee "$RUNNER_TEMP/phpstan.log"
      - name: Résumé PHPStan
        if: always()
        run: .github/scripts/summary-annotations.sh "PHPStan (niveau max)" "$RUNNER_TEMP/phpstan.log" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # rector-backend — Rector en --dry-run (bloquant) : le code doit rester
  # conforme aux règles de rector.php (modernisation PHP + qualité). Purement
  # statique (AST), ni base ni conteneur.
  # ---------------------------------------------------------------------------
  rector-backend:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql
          coverage: none
      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Rector (--dry-run, bloquant)
        working-directory: backend
        shell: bash   # pipefail, cf. sast-backend
        # Sortie JSON plutôt que console : les diffs sont repris dans la carte
        # de synthèse (blocs repliés), plus lisibles là que dans le log.
        run: vendor/bin/rector process --dry-run --no-progress-bar --output-format=json | tee "$RUNNER_TEMP/rector.json"
      - name: Résumé Rector
        if: always()
        run: php .github/scripts/summary-rector.php "$RUNNER_TEMP/rector.json" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # build — une image prod + une image preprod, backend et frontend.
  # Uniquement sur tag (équivalent `.only-tag` de l'ancien pipeline GitLab).
  # ---------------------------------------------------------------------------
  build-images:
    needs: [test-backend, test-frontend, sast-backend, phpstan-backend, rector-backend]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # La carte Open Graph est régénérée ICI, juste avant la construction de
      # l'image frontend, et non commitée « en espérant » qu'elle soit à jour :
      # l'image publiée porte donc toujours une carte cohérente avec le gabarit
      # versionné. frontend/public/og.png est aussi commité, pour que
      # `npm run dev` et un build local sans Chrome disposent d'un fichier.
      #
      # Dépendances installées explicitement plutôt que supposées présentes :
      # ImageMagick ne fait plus partie de l'image runner ubuntu-24.04, et un
      # fallback silencieux sur une police manquante décalerait la mise en page
      # sans faire échouer le job.
      - name: Dépendances de rendu de la carte Open Graph
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            imagemagick fonts-dejavu-core fonts-liberation
      - name: Régénération de la carte Open Graph (frontend/public/og.png)
        working-directory: frontend
        run: npm run og:generate

      - name: Build & push (prod + preprod, backend + frontend)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make build-prod           IMAGE=$IMAGE_BACKEND        TAG=$TAG
          make build-preprod        IMAGE=$IMAGE_BACKEND        TAG=$TAG
          make build-front-prod     FRONT_IMAGE=$IMAGE_FRONTEND TAG=$TAG
          make build-front-preprod  FRONT_IMAGE=$IMAGE_FRONTEND TAG=$TAG
          docker push "$IMAGE_BACKEND:$TAG"
          docker push "$IMAGE_BACKEND:$TAG-preprod"
          docker push "$IMAGE_FRONTEND:$TAG"
          docker push "$IMAGE_FRONTEND:$TAG-preprod"

  # ---------------------------------------------------------------------------
  # deploy-preprod
  # ---------------------------------------------------------------------------
  deploy-preprod:
    needs: [build-images]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: preprod
      url: https://preprod.cp-ghostotof.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PREPROD }}" > ~/.kube/config
      - name: Deploy
        working-directory: k8s/overlays/preprod
        env:
          TAG: ${{ github.ref_name }}
          MAINTENANCE_WINDOW: ${{ vars.DEPLOY_MAINTENANCE_WINDOW }}
        run: |
          kustomize edit set image backend=$IMAGE_BACKEND:$TAG-preprod frontend=$IMAGE_FRONTEND:$TAG-preprod
          # Fenêtre de maintenance (v0.11.0, migration UUID) — opt-in, variable de
          # dépôt DEPLOY_MAINTENANCE_WINDOW=true. Certaines migrations sont
          # irréversibles et changent le type de colonne d'une clé primaire :
          # le code de la release lit un `uuid` là où l'ancien code lit un
          # `integer`, donc AUCUN pod ne doit servir de requête pendant la
          # bascule (l'un ou l'autre code hydraterait mal l'entité, 500 sur
          # toute route touchant la base). replicas est patché à 0 plutôt que
          # `kubectl scale` : le Role du déployeur n'a pas la subresource
          # `deployments/scale` (cf. github-actions-rbac/role.yaml — ne pas
          # ajouter ce verbe pour ce besoin), seulement `patch` sur
          # `deployments`. Le mode est opt-in pour qu'une release ordinaire
          # (sans changement de schéma incompatible) reste à zéro interruption.
          # Le frontend continue de répondre normalement pendant la fenêtre ;
          # seule l'API (donc son domaine, à travers l'ingress) répond 503.
          #
          # Échec du Job : le script sort avant d'atteindre `kubectl apply -k .`
          # (via `exit 1` ci-dessous), donc `backend` et `worker` restent à 0
          # replica jusqu'à intervention manuelle — volontaire, pour ne jamais
          # resservir du trafic sur un schéma à moitié migré. Pour reprendre la
          # main : si la migration n'a rien écrit (le DDL PostgreSQL est
          # transactionnel, cf. les logs récupérés ci-dessous), `kubectl apply -k .`
          # sur cet overlay relance l'ancienne image avec l'ancien schéma ; sinon,
          # corriger la migration puis publier un nouveau tag.
          if [ "${MAINTENANCE_WINDOW:-false}" = "true" ]; then
            echo "::notice::Fenêtre de maintenance : arrêt du backend et du worker avant la migration"
            kubectl -n preprod patch deployment/backend --type merge -p '{"spec":{"replicas":0}}'
            kubectl -n preprod patch deployment/worker --type merge -p '{"spec":{"replicas":0}}'
            kubectl -n preprod wait --for=delete pod -l app.kubernetes.io/name=backend --timeout=120s || true
            kubectl -n preprod wait --for=delete pod -l app.kubernetes.io/name=worker --timeout=120s || true
            # Migration sur une base au repos, avec l'image de la release.
            kubectl -n preprod delete job backend-migrate --ignore-not-found
            BACKEND_IMAGE=$IMAGE_BACKEND:$TAG-preprod \
              envsubst < ../../base/migrate-job.yaml | kubectl -n preprod apply -f -
            # Timeout à 300s (contre 180s pour le Job après rollout plus bas) :
            # base réellement au repos et cinq migrations de clé primaire à jouer
            # d'un bloc, pas le simple "Already at the latest version" du Job
            # post-rollout d'une release ordinaire.
            kubectl -n preprod wait --for=condition=complete --timeout=300s job/backend-migrate \
              || { kubectl -n preprod logs job/backend-migrate --tail=200; exit 1; }
          else
            echo "::notice::Fenêtre de maintenance désactivée (DEPLOY_MAINTENANCE_WINDOW≠true) : déploiement standard."
          fi
          kubectl apply -k .
          kubectl -n preprod rollout status deployment/backend --timeout=180s
          kubectl -n preprod rollout status deployment/frontend --timeout=180s
          # Point d'audit C8 : migrations via un Job dédié plutôt que
          # `kubectl exec`, ce qui permet de retirer `pods/exec: create` du Role
          # du déployeur (un shell dans n'importe quel pod = accès à tous les
          # secrets montés). Le Job n'est pas dans les `resources:` de
          # kustomize : l'image est donc substituée ici.
          kubectl -n preprod delete job backend-migrate --ignore-not-found
          BACKEND_IMAGE=$IMAGE_BACKEND:$TAG-preprod \
            envsubst < ../../base/migrate-job.yaml | kubectl -n preprod apply -f -
          kubectl -n preprod wait --for=condition=complete --timeout=180s job/backend-migrate \
            || { kubectl -n preprod logs job/backend-migrate --tail=200; exit 1; }
          # Peuplement du contenu de référence, préprod UNIQUEMENT. La
          # production n'est JAMAIS peuplée automatiquement — décision arrêtée
          # le 2026-09-09 (issue #17), pas un provisoire : son contenu est rédigé
          # au backoffice, et un écrivain automatique braqué dessus serait un
          # risque permanent pour un bénéfice occasionnel. Ne pas « compléter »
          # le pipeline en ajoutant cette étape à deploy-prod ; y peupler une
          # table réellement vide reste un geste manuel, au cas par cas.
          #
          # Sans danger ici, à chaque déploiement : les commandes de seed
          # refusent d'écraser du contenu déjà présent et sortent en code 0
          # (cf. GuardsExistingContent et l'en-tête de seed-job.yaml). `--force`
          # n'est jamais passé : une réinitialisation reste un geste manuel.
          kubectl -n preprod delete job backend-seed --ignore-not-found
          BACKEND_IMAGE=$IMAGE_BACKEND:$TAG-preprod \
            envsubst < ../../base/seed-job.yaml | kubectl -n preprod apply -f -
          kubectl -n preprod wait --for=condition=complete --timeout=180s job/backend-seed \
            || { kubectl -n preprod logs job/backend-seed --tail=200; exit 1; }

  # ---------------------------------------------------------------------------
  # test-preprod — smoke tests + audit boîte noire (gate bloquant)
  # ---------------------------------------------------------------------------
  smoke-test-preprod:
    needs: [deploy-preprod]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Smoke tests
        run: |
          curl -fsS https://preprod.cp-ghostotof.com/healthz
          status=$(curl -s -o /dev/null -w '%{http_code}' https://preprod.cp-ghostotof.com/api/me)
          if [ "$status" != "401" ]; then
            echo "GET /api/me a répondu $status (401 attendu, non authentifié) : l'API ne semble pas avoir démarré correctement"
            exit 1
          fi
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PREPROD }}" > ~/.kube/config
      # Incident v0.5.0 : RabbitMQ en CrashLoopBackOff (donc le worker aussi,
      # par dépendance) n'était détecté ni par /healthz ni par /api/me — les
      # deux endpoints HTTP démarrent très bien même sans broker AMQP
      # fonctionnel, seule la publication d'un message (POST /api/contact)
      # échouait réellement. `rollout status` échoue/timeout si le déploiement
      # n'atteint jamais l'état Ready, ce qui aurait fait échouer ce job et
      # déclenché rollback-preprod avant même d'arriver au gate deploy-prod.
      # Postgres ajouté par cohérence : /api/me ne le sollicite pas non plus
      # (rejet 401 avant toute requête DB pour une requête non authentifiée),
      # donc une régression équivalente sur postgres.yaml passerait tout aussi
      # inaperçue sans cette vérification dédiée.
      - name: Vérifie les datastores et le worker
        run: |
          kubectl -n preprod rollout status deployment/postgres --timeout=60s
          kubectl -n preprod rollout status deployment/rabbitmq --timeout=60s
          kubectl -n preprod rollout status deployment/worker --timeout=60s

  # Gate bloquant : une régression de sécurité en préprod empêche d'atteindre
  # le gate d'approbation manuelle de deploy-prod (cf. son `needs`).
  audit-preprod:
    needs: [deploy-preprod]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit préprod
        env:
          # Préprod exige une Basic Auth (point de sécurité 2026-09-12) :
          # sans elle, cet audit anonyme prendrait chaque 401 pour un
          # chemin sensible exposé. Secret à créer manuellement
          # (`gh secret set PREPROD_BASIC_AUTH`, format "utilisateur:mot_de_passe",
          # identique à celui posé dans Scaleway Secret Manager /
          # preprod-basic-auth-htpasswd) — voir k8s/README.md §2bis.
          AUDIT_BASIC_AUTH: ${{ secrets.PREPROD_BASIC_AUTH }}
        run: ./tools/audit-prod.sh preprod.cp-ghostotof.com

  # ---------------------------------------------------------------------------
  # cleanup-preprod — seulement si smoke-test-preprod/audit-preprod échoue
  # ---------------------------------------------------------------------------
  rollback-preprod:
    needs: [smoke-test-preprod, audit-preprod]
    if: failure() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PREPROD }}" > ~/.kube/config
      - name: Rollback
        run: |
          kubectl -n preprod rollout undo deployment/backend
          kubectl -n preprod rollout undo deployment/frontend

  # ---------------------------------------------------------------------------
  # deploy-prod — approbation manuelle (protection de l'environnement
  # `production`, reviewer requis configuré côté GitHub), aucun rebuild :
  # promeut l'image déjà construite et validée en préprod.
  # ---------------------------------------------------------------------------
  deploy-prod:
    needs: [smoke-test-preprod, audit-preprod]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cp-ghostotof.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" > ~/.kube/config
      - name: Deploy
        working-directory: k8s/overlays/prod
        env:
          TAG: ${{ github.ref_name }}
          MAINTENANCE_WINDOW: ${{ vars.DEPLOY_MAINTENANCE_WINDOW }}
        run: |
          kustomize edit set image backend=$IMAGE_BACKEND:$TAG frontend=$IMAGE_FRONTEND:$TAG
          # Fenêtre de maintenance (v0.11.0, migration UUID) — opt-in, variable de
          # dépôt DEPLOY_MAINTENANCE_WINDOW=true. Certaines migrations sont
          # irréversibles et changent le type de colonne d'une clé primaire :
          # le code de la release lit un `uuid` là où l'ancien code lit un
          # `integer`, donc AUCUN pod ne doit servir de requête pendant la
          # bascule (l'un ou l'autre code hydraterait mal l'entité, 500 sur
          # toute route touchant la base). replicas est patché à 0 plutôt que
          # `kubectl scale` : le Role du déployeur n'a pas la subresource
          # `deployments/scale` (cf. github-actions-rbac/role.yaml — ne pas
          # ajouter ce verbe pour ce besoin), seulement `patch` sur
          # `deployments`. Le mode est opt-in pour qu'une release ordinaire
          # (sans changement de schéma incompatible) reste à zéro interruption.
          # Le frontend continue de répondre normalement pendant la fenêtre ;
          # seule l'API (donc son domaine, à travers l'ingress) répond 503.
          #
          # Échec du Job : même mécanique qu'en préprod, cf. deploy-preprod — le
          # script sort avant `kubectl apply -k .` (via `exit 1` ci-dessous),
          # `backend` et `worker` restent à 0 replica jusqu'à intervention
          # manuelle (voulu : jamais de trafic sur un schéma à moitié migré).
          # Reprise : si la migration n'a rien écrit (DDL PostgreSQL
          # transactionnel), `kubectl apply -k .` sur cet overlay relance
          # l'ancienne image avec l'ancien schéma ; sinon, corriger puis nouveau tag.
          if [ "${MAINTENANCE_WINDOW:-false}" = "true" ]; then
            echo "::notice::Fenêtre de maintenance : arrêt du backend et du worker avant la migration"
            kubectl -n prod patch deployment/backend --type merge -p '{"spec":{"replicas":0}}'
            kubectl -n prod patch deployment/worker --type merge -p '{"spec":{"replicas":0}}'
            kubectl -n prod wait --for=delete pod -l app.kubernetes.io/name=backend --timeout=120s || true
            kubectl -n prod wait --for=delete pod -l app.kubernetes.io/name=worker --timeout=120s || true
            # Migration sur une base au repos, avec l'image de la release.
            kubectl -n prod delete job backend-migrate --ignore-not-found
            BACKEND_IMAGE=$IMAGE_BACKEND:$TAG \
              envsubst < ../../base/migrate-job.yaml | kubectl -n prod apply -f -
            # Timeout à 300s (contre 180s pour le Job après rollout plus bas) —
            # même justification qu'en préprod : base au repos, cinq migrations
            # de clé primaire jouées d'un bloc.
            kubectl -n prod wait --for=condition=complete --timeout=300s job/backend-migrate \
              || { kubectl -n prod logs job/backend-migrate --tail=200; exit 1; }
          else
            echo "::notice::Fenêtre de maintenance désactivée (DEPLOY_MAINTENANCE_WINDOW≠true) : déploiement standard."
          fi
          kubectl apply -k .
          kubectl -n prod rollout status deployment/backend --timeout=180s
          kubectl -n prod rollout status deployment/frontend --timeout=180s
          # Point d'audit C8 — même mécanique qu'en préprod, cf. deploy-preprod.
          kubectl -n prod delete job backend-migrate --ignore-not-found
          BACKEND_IMAGE=$IMAGE_BACKEND:$TAG \
            envsubst < ../../base/migrate-job.yaml | kubectl -n prod apply -f -
          kubectl -n prod wait --for=condition=complete --timeout=180s job/backend-migrate \
            || { kubectl -n prod logs job/backend-migrate --tail=200; exit 1; }

  # ---------------------------------------------------------------------------
  # create-release — publie la release GitHub une fois la prod effectivement
  # déployée. Volontairement APRÈS deploy-prod et pas après build-images : une
  # release est l'annonce publique qu'une version tourne, pas qu'elle a compilé.
  # La v0.7.0 a demandé quatre exécutions avant d'atteindre la prod ; publier
  # plus tôt aurait annoncé trois versions qui n'ont jamais tourné.
  #
  # Pas de dépendance à audit-prod : ce job est `continue-on-error`, sa
  # conclusion vaut « success » même en échec — l'y accrocher donnerait
  # l'illusion d'un contrôle supplémentaire sans en être un.
  # ---------------------------------------------------------------------------
  create-release:
    needs: [deploy-prod]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Seul job à écrire dans le dépôt : permission élevée ici, pas globalement.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nécessaire pour lire l'annotation du tag : un checkout superficiel
          # ne récupère pas l'objet tag lui-même, seulement le commit.
          fetch-depth: 0
      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Idempotent : un re-run du workflow ne doit pas échouer sur une
          # release déjà publiée.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG déjà publiée — rien à faire."
            exit 0
          fi

          # Le corps de la release vient de l'annotation du tag : c'est le seul
          # texte écrit au moment de décider du contenu de la version, donc le
          # seul qui puisse la décrire honnêtement. Première ligne = titre.
          TITLE="$(git tag -l --format='%(contents:subject)' "$TAG")"
          BODY="$(git tag -l --format='%(contents:body)' "$TAG")"

          if [ -n "$BODY" ]; then
            printf '%s' "$BODY" > /tmp/release-notes.md
            gh release create "$TAG" \
              --verify-tag --latest \
              --title "${TITLE:-$TAG}" \
              --notes-file /tmp/release-notes.md
          else
            # Tag sans annotation détaillée (ou tag léger) : on retombe sur les
            # notes générées par GitHub plutôt que de publier une release vide.
            echo "Tag $TAG sans corps d'annotation — notes générées automatiquement."
            gh release create "$TAG" \
              --verify-tag --latest \
              --title "${TITLE:-$TAG}" \
              --generate-notes
          fi

          echo "Release publiée : $(gh release view "$TAG" --json url --jq .url)"

  # ---------------------------------------------------------------------------
  # audit-prod — vérification post-promotion, non bloquant (pas de rollback
  # auto en prod, contrairement à rollback-preprod).
  # ---------------------------------------------------------------------------
  audit-prod:
    needs: [deploy-prod]
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit prod
        run: ./tools/audit-prod.sh cp-ghostotof.com
