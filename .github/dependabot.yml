# Mises à jour de sécurité automatisées. Couvre les quatre écosystèmes du
# dépôt ; les PR groupées limitent le bruit. Point d'audit B4 : c'est aussi
# le mécanisme qui permettra de figer les actions GitHub sur un SHA précis
# (cible: false ci-dessous une fois les SHA en place) tout en gardant un
# canal de mise à jour — sans lui, un pin SHA se périme en silence.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      backend-minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker/node
    schedule:
      interval: weekly
