# Mises à jour de sécurité automatisées. Couvre les quatre écosystèmes du
# dépôt ; les PR groupées limitent le bruit. Point d'audit B4 : les actions
# GitHub sont désormais figées sur un SHA (cf. .github/workflows/*.yml) ;
# c'est ce job `github-actions` qui les fait avancer — il met à jour le SHA
# *et* le commentaire `# vX.Y.Z` — pour qu'un pin ne se périme pas en silence.
#
# `target-branch: develop` sur chaque écosystème, et ce n'est pas cosmétique :
# sans lui Dependabot ouvre ses PR sur la branche par défaut du dépôt, donc sur
# `main`. Une montée de version arrivait ainsi directement sur la branche de
# production, hors du git flow, sans passer par develop ni par une préprod. Rien
# ne se déployait pour autant — le pipeline ne se déclenche que sur un tag — mais
# main et develop divergeaient en silence, et la divergence ne se voyait qu'au
# moment de préparer la release suivante.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      backend-minor-patch:
        update-types: ['minor', 'patch']
    # API Platform : la majeure est écartée tant que sa migration n'est pas
    # faite (#735). Sans cette ligne, Dependabot ne regarde que la
    # *dernière* version publiée : dès la sortie de la 5.0 (2026-09-16), le
    # groupe `backend-minor-patch` rejetait `api-platform/symfony` et
    # `api-platform/doctrine-orm` (« la dernière version est une majeure »),
    # sans jamais examiner les 4.3.20/4.3.21 ni les 4.4.x ; et la PR
    # individuelle qui en résulte vise la 5.0.x, que la résolution refuse
    # (`api-platform/metadata ^5.0` en conflit avec le reste du lock). Le
    # silence a duré de la 5.0.0 à la correction. Avec l'ignore, la « dernière
    # version » devient la dernière 4.x, que le groupe accepte. À retirer
    # quand on migre vers la 5.0.
    #
    # Symfony AI et MCP : toutes les montées de version sont écartées, pas
    # seulement la majeure. Ces paquets sont en 0.x et épinglés en version
    # exacte (ADR 0004 D1, ADR 0006 D7, garde SymfonyAiAndMcpPinsMatchTheLockTest) :
    # une montée y est un acte délibéré, lu dans les changelogs amont, jamais
    # un lot hebdomadaire. Or en 0.x une version qui casse (0.13 -> 0.15)
    # compte pour Dependabot comme une « minor » : le groupe
    # `backend-minor-patch` la proposerait avec le reste, et la PR réécrirait
    # le pin exact.
    # Cet ignore ne retire que ces montées de version hebdomadaires. Les PR de
    # sécurité automatiques sont déjà désactivées pour tout le dépôt
    # (tools/github-settings.sh, étape h : elles viseraient `main`, jamais
    # mergeables), les alertes de vulnérabilité restent actives, et
    # `composer audit --no-dev` bloque déjà la CI (job `test-backend` de
    # .github/workflows/pipeline.yml). Les nouvelles versions se lisent à la
    # main, `composer outdated` ne prenant qu'un nom de paquet :
    #   composer outdated --direct | grep -E '^(symfony/(ai|mcp)-|mcp/)'
    # Cette veille, et la réévaluation de l'ignore à la montée Symfony 8.2,
    # sont suivies dans #764.
    ignore:
      - dependency-name: 'api-platform/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'symfony/ai-*'
      - dependency-name: 'symfony/mcp-bundle'
      - dependency-name: 'mcp/*'

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /docker/php
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker/node
    target-branch: develop
    schedule:
      interval: weekly
