# Le subject n'indique pas de `namespace` : kustomize le complète
# automatiquement avec le namespace de l'overlay (preprod/prod) au même
# titre que ce RoleBinding lui-même — comportement standard du transformer
# de namespace de kustomize pour les subjects ServiceAccount non qualifiés.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-deployer
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
