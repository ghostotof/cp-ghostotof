# Depuis Kubernetes 1.24, un ServiceAccount ne crée plus de token durable
# automatiquement (`kubectl create token` génère un token à courte durée de
# vie, inadapté à un secret GitHub Actions stocké une fois). Ce Secret typé
# déclenche la génération d'un token durable par le control-plane — sa
# valeur (.data.token) n'est jamais commitée, seule cette déclaration l'est.
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-deployer-token
  annotations:
    kubernetes.io/service-account.name: github-actions-deployer
type: kubernetes.io/service-account-token
