# Contrairement au RoleBinding namespaced (rolebinding.yaml), un
# ClusterRoleBinding n'est pas réécrit par le transformer de namespace de
# kustomize : les deux subjects (un par ServiceAccount, un par namespace)
# sont donc listés explicitement ici, objet unique partagé par les deux
# overlays.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-actions-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: github-actions-deployer
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: preprod
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: prod
