# Identité utilisée par le pipeline GitHub Actions pour déployer : un
# kubeconfig autonome, construit par `tools/rotate-deployer-token.sh` autour
# d'un jeton LIÉ à durée limitée (90 jours, `kubectl create token`) et posé
# comme secret d'environnement GitHub — jamais commité, jamais durable (voir
# k8s/README.md §4). Remplace le tunnel GitLab Agent for Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-deployer
