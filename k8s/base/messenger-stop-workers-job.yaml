# Issue #521 — arrêt des workers Messenger, depuis la release de l'image qui tourne.
#
# La commande réécrit dans le cache en base (pool
# `cache.messenger.restart_workers_signal`, adossé à `cache.app` sous son propre
# espace de noms, table `cache_items`) le signal de redémarrage que chaque
# worker relit entre deux messages : il s'arrête, et
# Kubernetes le relance. Elle sert surtout après une rotation d'`APP_SECRET`
# (étape 4) : la ligne du signal, sans expiration, signée sous l'ancienne clé
# (issue #468), serait refusée à chaque tour du worker, un `warning` par tour.
#
# Issue #528 : `app:messenger:stop-workers`, pas `messenger:stop-workers` de
# Symfony. Les deux écrivent le même signal (même pool, même clé, même format),
# mais celle de Symfony ignore le retour de `save()` : une écriture refusée par
# PostgreSQL y donnait `[OK]` et un Job vert pour rien. La nôtre relit la
# valeur écrite et sort en 1 si elle ne se relit pas : le Job échoue. Elle
# n'existe que dans les images qui contiennent #528 : ce manifeste se lance
# depuis un checkout de la release qui tourne (k8s/README.md).
#
# Règle de #520 (`.claude/rules/deploiement.md`, « What never kubectl exec
# covers ») : une commande à effet de bord passe par un Job, jamais par
# `kubectl exec`. La lecture de `failed` (`messenger:failed:show`), elle, reste
# un exec humain en lecture seule : en `-vv`, elle affiche le message lui-même
# (nom, adresse et texte d'un visiteur), qu'un Job écrirait dans ses journaux.
# Procédure : k8s/README.md, « File d'échec Messenger (`failed`) ».
#
# DÉLIBÉRÉMENT ABSENT de kustomization.yaml `resources:`, comme migrate-job.yaml :
# un `apply -k` ne touche jamais à Messenger. Lancé par tools/run-job.sh, qui
# substitue par envsubst (liste explicite) les placeholders nommés ici et
# supprime d'abord le Job précédent (la spec d'un Job est immuable).
# Seul ${BACKEND_IMAGE} est substitué.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-messenger-stop-workers
  labels:
    app.kubernetes.io/name: backend-messenger-stop-workers
spec:
  # Relancer à la main après lecture de l'échec, jamais de reprise automatique.
  backoffLimit: 0
  # Compté dès la création : ordonnancement, deux tirages `Always` de l'image
  # (initContainer et conteneur), puis la commande. Sous les 300 s qu'attend
  # la procédure (tools/run-job.sh … 300), qui voit donc l'échec.
  activeDeadlineSeconds: 240
  # Une heure pour relire `kubectl logs job/backend-messenger-stop-workers`.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-messenger-stop-workers
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Issue #288, cf. migrate-job.yaml : cache.system reste inscriptible.
        - name: seed-cache-system
          image: ${BACKEND_IMAGE}
          imagePullPolicy: Always
          command: ['sh', '-c', 'cp -a /var/www/backend/var/cache/prod/pools/system/. /cache-system/']
          volumeMounts:
            - name: cache-system
              mountPath: /cache-system
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      containers:
        - name: stop-workers
          image: ${BACKEND_IMAGE}
          # Cf. migrate-job.yaml : le Job exécute exactement le code de la release.
          imagePullPolicy: Always
          command: ['php', 'bin/console', 'app:messenger:stop-workers', '--no-interaction']
          env:
            # Issue #525 : attentes de verrou PostgreSQL bornées comme sous FPM (valeur
            # de www.prod.conf ; ConsoleLockWaitBoundTest, .claude/rules/deploiement.md).
            - name: PGOPTIONS
              value: '-c lock_timeout=5s'
            # Revue de #521, comme les Jobs de `failed` : Symfony Console lit
            # aussi SHELL_VERBOSITY, et `env` l'emporte sur `envFrom`.
            - name: SHELL_VERBOSITY
              value: '0'
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          volumeMounts:
            - name: var-log
              mountPath: /var/www/backend/var/log
            - name: cache-system
              mountPath: /var/www/backend/var/cache/prod/pools/system
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Strictement identique au Deployment, comme le Job de migration.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      volumes:
        - name: var-log
          emptyDir: {}
        - name: cache-system
          emptyDir:
            sizeLimit: 64Mi
