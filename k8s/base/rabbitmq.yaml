apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      # Ce nœud est seul (`replicas: 1`, aucune configuration de cluster) : il
      # n'utilise pas `rabbit_peer_discovery_k8s` et ne consulte donc jamais
      # l'API Kubernetes — le jeton du ServiceAccount peut partir sans risque.
      automountServiceAccountToken: false
      # Point d'audit I6 : seccomp SEULEMENT — filtre d'appels système, il ne
      # touche ni à l'utilisateur d'exécution ni aux permissions de fichiers.
      #
      # ATTENTION avant d'étoffer ce bloc : la release v0.5.0 a mis RabbitMQ en
      # CrashLoopBackOff en prod (~15 min de POST /api/contact en 500) en y
      # ajoutant `runAsNonRoot`/`runAsUser`/`fsGroup`. Erlang refuse de démarrer
      # si /var/lib/rabbitmq/.erlang.cookie est accessible au groupe, et le
      # fsGroup rendait exactement ça — le fichier restant fautif sur le PVC même
      # après rollback du manifeste. Un vrai passage non-root ici exige de gérer
      # explicitement ce cookie (initContainer qui le régénère/chmod), et un
      # rollout réel en préprod : un `apply --dry-run=server` ne teste pas le
      # runtime sur un volume déjà initialisé.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.5-management-alpine # garder synchronisé avec RABBITMQ_TAG dans ../.env
          ports:
            - containerPort: 5672
            - containerPort: 15672
          envFrom:
            - secretRef:
                name: rabbitmq-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              # 500m throttlait le broker pendant le boot de l'Erlang VM (observé
              # à 499m/500m d'usage réel), ce qui faisait timeout
              # rabbitmq-diagnostics ping même à 10s — la limite elle-même était
              # le goulot d'étranglement, pas le nœud.
              cpu: 1000m
              memory: 256Mi
          # Issue #295 — sondes TCP sur le port AMQP, comme le RabbitMQ Cluster
          # Operator. L'ancienne sonde `rabbitmq-diagnostics -q ping` démarrait un
          # nœud Erlang à chaque appel : sous charge CPU, pendant un démarrage
          # justement, elle dépassait son délai de 10 s. Le 2026-09-30, RabbitMQ
          # était prêt à 51 s et a pourtant été tué à 86 s, neuvième redémarrage
          # en huit jours. Une connexion TCP ne coûte rien et ne mesure pas la
          # vitesse du CLI.
          #
          # startupProbe : jusqu'à 5 min (30 × 10 s) pour ouvrir le port AMQP.
          # Tant qu'elle n'a pas réussi, les deux autres sondes sont suspendues,
          # d'où l'absence d'initialDelaySeconds.
          startupProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 10
            failureThreshold: 30
          # livenessProbe : ne redémarre que sur un port fermé une minute durant
          # (3 × 20 s). Un processus Erlang qui meurt fait déjà sortir le
          # conteneur : cette sonde ne vise que le cas d'un nœud figé.
          livenessProbe:
            tcpSocket:
              port: 5672
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 5672
            timeoutSeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
