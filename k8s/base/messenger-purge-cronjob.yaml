# Ménage quotidien de la base, trois commandes :
#
# 1. `app:contact:purge-failed-messages` — rétention des messages de contact
#    en échec (point d'audit B6, 30 jours par défaut) — voir
#    src/Contact/Presentation/Command/PurgeFailedContactMessagesCommand.php.
# 2. `app:user:purge-pending-invitations` — RGPD (issue #238) : supprime les
#    comptes invités jamais activés au-delà de 30 jours depuis leur dernière
#    invitation — voir
#    src/Security/User/Presentation/Command/PurgePendingInvitationsCommand.php.
# 3. `cache:pool:prune` — purge des entrées expirées de `cache_items`, la table
#    Doctrine DBAL du cache applicatif (ADR 0005 : l'état des limiteurs de
#    débit et le cache de résultats vivent en base, pas sur le disque du pod).
#    L'adaptateur n'efface jamais une ligne expirée de lui-même : sans cette
#    commande, une ligne par (IP, limiteur) s'accumulerait indéfiniment.
#
# Le nom du CronJob date de la première commande et n'a pas été changé :
# `kubectl apply -k` ne supprime jamais un objet renommé, et le Role du
# déployeur n'a pas `delete` sur les CronJobs — un rename laisserait l'ancien
# tourner à côté du nouveau.
#
# Réutilise l'image backend et les mêmes ConfigMap/Secret que le Deployment
# (DATABASE_URL vient de backend-secrets).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: contact-failed-messages-purge
  labels:
    app.kubernetes.io/name: contact-failed-messages-purge
spec:
  schedule: '17 3 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: contact-failed-messages-purge
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 10001
            # Point d'audit I6 : filtre d'appels système par défaut du runtime.
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Issue #288 : cache.system (var/cache/prod/pools/system) doit rester
            # inscriptible malgré readOnlyRootFilesystem. L'emptyDir `cache-system`
            # masquerait le cache préchauffé de l'image : on l'y recopie d'abord.
            - name: seed-cache-system
              image: backend
              command: ['sh', '-c', 'cp -a /var/www/backend/var/cache/prod/pools/system/. /cache-system/']
              volumeMounts:
                - name: cache-system
                  mountPath: /cache-system
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
          containers:
            - name: purge
              image: backend
              command:
                - sh
                - -c
                - |
                  set -e
                  php bin/console app:contact:purge-failed-messages --no-interaction
                  php bin/console app:user:purge-pending-invitations --no-interaction
                  php bin/console cache:pool:prune --no-interaction
              envFrom:
                - configMapRef:
                    name: backend-config
                - secretRef:
                    name: backend-secrets
              volumeMounts:
                - name: var-log
                  mountPath: /var/www/backend/var/log
                # Issue #288 : seul chemin inscriptible de var/cache, cf. le volume.
                - name: cache-system
                  mountPath: /var/www/backend/var/cache/prod/pools/system
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 192Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
          volumes:
            - name: var-log
              emptyDir: {}
            # Issue #288 — cache dérivé, jetable et identique dans chaque pod : ce
            # n'est pas de l'état applicatif (ADR 0005, amendement du 2026-09-30).
            # Borné pour qu'un cache emballé ne remplisse pas le disque du nœud
            # (préchauffé : ~10 Mo).
            - name: cache-system
              emptyDir:
                sizeLimit: 64Mi
