## Issue #477 — configuration propre au projet, montée dans
## /etc/rabbitmq/conf.d/20-cp-ghostotof.conf, à côté du 10-defaults.conf de
## l'image (k8s : configMapGenerator `rabbitmq-conf` ; dev : docker-compose.yml).

## Plafond du corps d'un message, refusé à la publication (PRECONDITION_FAILED).
## Sans lui, RabbitMQ accepte 16 Mio : le worker (--memory-limit=120M, conteneur
## à 192 Mi) chargerait le message entier avant que AuthenticatedEnvelopeSerializer
## ne le refuse au-delà de MAX_ENVELOPE_BYTES (256 Kio, issue #469). 1 Mio laisse
## passer toute enveloppe légitime à cette borne. Les en-têtes sont bornés par
## frame_max (128 Kio par défaut). RabbitMqMessageSizeCapTest lie les deux valeurs.
max_message_size = 1048576
