# Worker Messenger : consomme le transport `async` (RabbitMQ) — sans lui, les
# messages du formulaire de contact (SendContactMessageMessage) restent dans
# la queue et aucun email n'est envoyé. Équivalent déployé de `make consume`.
#
# Réutilise l'image backend et les mêmes ConfigMap/Secret que le Deployment
# `backend` (MESSENGER_TRANSPORT_DSN, MAILER_DSN, DATABASE_URL, CONTACT_*).
#
# Pas de sonde applicative : `messenger:consume` est le process PID 1 du
# conteneur — s'il meurt, le conteneur s'arrête et k8s le relance
# (restartPolicy: Always par défaut d'un Deployment). `--time-limit` force en
# plus un arrêt propre toutes les heures (connexions AMQP/PDO fraîches, pas de
# fuite mémoire sur la durée). `--memory-limit` sous la limite conteneur.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  strategy:
    # Un seul consommateur : Recreate évite d'avoir brièvement deux workers
    # pendant un rollout (le broker dédoublonne, mais autant rester simple).
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        # Point d'audit I6 : filtre d'appels système par défaut du runtime.
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Issue #288 : cache.system (var/cache/prod/pools/system) doit rester
        # inscriptible malgré readOnlyRootFilesystem. L'emptyDir `cache-system`
        # masquerait le cache préchauffé de l'image : on l'y recopie d'abord.
        - name: seed-cache-system
          image: backend
          imagePullPolicy: Always
          command: ['sh', '-c', 'cp -a /var/www/backend/var/cache/prod/pools/system/. /cache-system/']
          volumeMounts:
            - name: cache-system
              mountPath: /cache-system
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      containers:
        - name: worker
          image: backend
          # `Always` : le tag Git porté par kustomize est mutable, et une release
          # rejouée sous le même nom laisserait le nœud resservir l'image qu'il a
          # en cache — le pod tournerait alors sur un build antérieur tout en
          # affichant le bon tag (cf. invariants de déploiement, CLAUDE.md).
          imagePullPolicy: Always
          command:
            - php
            - bin/console
            - messenger:consume
            - async
            - --time-limit=3600
            - --memory-limit=120M
            - --no-interaction
            - -v
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          volumeMounts:
            - name: var-log
              mountPath: /var/www/backend/var/log
            # Issue #288 : seul chemin inscriptible de var/cache, cf. le volume.
            - name: cache-system
              mountPath: /var/www/backend/var/cache/prod/pools/system
            - name: jwt-keys
              mountPath: /var/www/backend/config/jwt
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      volumes:
        - name: var-log
          emptyDir: {}
        # Issue #288 — cache dérivé, jetable et identique dans chaque pod : ce
        # n'est pas de l'état applicatif (ADR 0005, amendement du 2026-09-30).
        # Borné pour qu'un cache emballé ne remplisse pas le disque du nœud
        # (préchauffé : ~10 Mo).
        - name: cache-system
          emptyDir:
            sizeLimit: 64Mi
        - name: jwt-keys
          secret:
            secretName: jwt-keys
