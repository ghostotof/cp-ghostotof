# Adaptation de docker/nginx/default.conf pour Kubernetes : `fastcgi_pass`
# vise 127.0.0.1 (sidecar dans le même pod que php-fpm, cf. backend-deployment.yaml)
# au lieu du service Compose "backend". `root` pointe sur le volume partagé
# rempli par l'initContainer copy-public (nginx n'a pas le code Symfony dans
# sa propre image).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-nginx-conf
data:
  default.conf: |
    # -----------------------------------------------------------------------
    # Point d'audit C7 — plafonds de débit secondaires, AVANT php-fpm.
    #
    # Zones déclarées au niveau `http` : cette clé de ConfigMap est montée en
    # /etc/nginx/conf.d/default.conf, inclus depuis le bloc http de nginx.conf.
    # Elles doivent donc rester HORS du `server {}` ci-dessous.
    #
    # Complètent, sans les remplacer, les limiteurs métier Symfony (5/h contact,
    # 10/h set-password) : ceux-ci comptent finement mais coûtent un boot
    # Symfony complet. Le plafond nginx est bien plus large — il ne vise pas
    # l'abus métier mais l'inondation qui épuiserait le pool php-fpm.
    #
    # real_ip est INDISPENSABLE ici : le pair TCP de ce sidecar est le pod
    # ingress-nginx, pas le visiteur. Sans ce bloc, $binary_remote_addr serait
    # identique pour tout Internet et les deux zones ci-dessous deviendraient un
    # compteur global unique — un déni de service auto-infligé. Plages de
    # confiance alignées sur `trusted_proxies: private_ranges` (framework.yaml).
    # ingress-nginx écrase X-Forwarded-For par l'IP réelle du client
    # (use-forwarded-headers=false par défaut), l'en-tête n'est donc pas
    # falsifiable par l'appelant.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;

    limit_req_zone $binary_remote_addr zone=contact:1m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=pwsetup:1m rate=20r/m;

    server {
        # Port non privilégié : le sidecar tourne en utilisateur non-root
        # (securityContext.runAsUser, cf. backend-deployment.yaml), et binder
        # le port 80 exigerait CAP_NET_BIND_SERVICE. Même logique que le
        # frontend, cf. docker/node/Dockerfile.
        listen 8080;
        server_name _;

        root /var/www/backend/public;

        # Sonde du sidecar nginx lui-même (process vivant), distincte de la
        # sonde php-fpm (docker/php/healthcheck.sh, exec probe sur le conteneur
        # php-fpm) qui vérifie que PHP répond réellement.
        # add_header propre à cette location : n'hérite plus d'AUCUN
        # add_header du bloc server (pas seulement Content-Type) — nginx
        # oblige à les redéclarer ici s'ils doivent aussi s'appliquer à
        # cette réponse.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        }

        # Endpoints publics et coûteux : plafonnés avant d'atteindre PHP.
        # `^~` : préfixe prioritaire sur les locations régulières, sinon
        # `location ~ \.php$` pourrait matcher en premier.
        # Aligné sur docker/nginx/default.conf — garder les deux synchronisés.
        location ^~ /api/contact {
            limit_req zone=contact burst=5 nodelay;
            limit_req_status 429;
            try_files $uri /index.php$is_args$args;
        }

        location ^~ /api/account/password-setup/ {
            limit_req zone=pwsetup burst=10 nodelay;
            limit_req_status 429;
            try_files $uri /index.php$is_args$args;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        location ~ \.php$ {
            return 404;
        }

        # API pure, jamais destinée à être embarquée dans une page : DENY
        # plutôt que le SAMEORIGIN utilisé côté frontend.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # API pure : aucune réponse n'est un document navigable (enforce).
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

        # API JSON sans upload : 1 Mo largement suffisant, supprime la surface
        # de DoS d'un corps de 32 Mo parsé par PHP. Aligné sur docker/nginx/default.conf.
        client_max_body_size 1m;
        error_log  /dev/stderr;
        access_log /dev/stdout;
    }
