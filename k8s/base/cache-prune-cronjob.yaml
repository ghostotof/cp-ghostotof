# Purge horaire des entrées expirées de `cache_items` (#644).
#
# L'adaptateur Doctrine DBAL n'efface jamais une ligne expirée de lui-même :
# seul `cache:pool:prune` le fait — sans elle, une ligne par (IP, limiteur)
# et par session MCP s'accumulerait indéfiniment (ADR 0005 : l'état des
# limiteurs et le cache de résultats vivent en base). Le ménage quotidien
# (messenger-purge-cronjob.yaml) la lançait une fois par jour ; or chaque
# `initialize` MCP anonyme écrit une session (pool `cache.mcp_sessions`,
# `session.ttl` d'une heure), et la zone nginx `mcp` en admet une par requête :
# purgée chaque jour, une session expirée restait jusqu'à 25 h en base, chaque
# heure, elle vit au plus deux heures. Même un `initialize` refusé laisse une
# ligne qu'aucun `DELETE` du SDK ne retire.
#
# `cache:pool:prune` purge tous les pools, pas seulement celui des sessions :
# la commande ne sait pas en viser un, et chaque pool ne coûte qu'un `DELETE`
# des lignes expirées de son espace de noms (un parcours de la table, sans
# index sur l'échéance : négligeable à ce volume) — les limiteurs de débit
# (`cache.app`) y gagnent aussi. C'est désormais la seule purge du cache : le
# ménage quotidien ne la lance plus (McpSessionsPrunedHourlyTest).
#
# Réutilise l'image backend et les mêmes ConfigMap/Secret que le Deployment :
# comme le ménage quotidien, le pod reçoit tout `backend-secrets` et le rôle
# applicatif `cpg_app` entier, bien plus que le `DELETE` sur `cache_items`
# dont il a besoin. Limite acceptée (relecture de #644) : même exposition que
# le CronJob existant, et restreindre l'environnement demanderait de prouver
# ce que le démarrage du noyau exige, au risque d'un Job cassé en production.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cache-items-prune
  labels:
    app.kubernetes.io/name: cache-items-prune
spec:
  # Minute 23 : jamais en même temps que le ménage quotidien (03:17).
  schedule: '23 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cache-items-prune
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 10001
            # Point d'audit I6 : filtre d'appels système par défaut du runtime.
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Issue #288 : cache.system (var/cache/prod/pools/system) doit rester
            # inscriptible malgré readOnlyRootFilesystem. L'emptyDir `cache-system`
            # masquerait le cache préchauffé de l'image : on l'y recopie d'abord.
            - name: seed-cache-system
              image: backend
              command: ['sh', '-c', 'cp -a /var/www/backend/var/cache/prod/pools/system/. /cache-system/']
              volumeMounts:
                - name: cache-system
                  mountPath: /cache-system
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
          containers:
            - name: prune
              image: backend
              command: ['php', 'bin/console', 'cache:pool:prune', '--no-interaction']
              env:
                # Issue #525 : attentes de verrou PostgreSQL bornées comme sous FPM (valeur
                # de www.prod.conf ; ConsoleLockWaitBoundTest,
                # .claude/rules/deploiement-etat-hors-pod.md).
                - name: PGOPTIONS
                  value: '-c lock_timeout=5s'
              envFrom:
                - configMapRef:
                    name: backend-config
                - secretRef:
                    name: backend-secrets
              volumeMounts:
                - name: var-log
                  mountPath: /var/www/backend/var/log
                # Issue #288 : seul chemin inscriptible de var/cache, cf. le volume.
                - name: cache-system
                  mountPath: /var/www/backend/var/cache/prod/pools/system
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 192Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
          volumes:
            - name: var-log
              emptyDir: {}
            # Issue #288 — cache dérivé, jetable et identique dans chaque pod : ce
            # n'est pas de l'état applicatif (ADR 0005, amendement du 2026-09-30).
            - name: cache-system
              emptyDir:
                sizeLimit: 64Mi
