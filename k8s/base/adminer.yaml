# Interface d'administration de la base PostgreSQL. Volontairement AUCUNE
# route Ingress ici : cet outil donne un accès direct aux données, la seule
# protection fiable pour un projet perso sans VPN/IAP est de ne jamais
# l'exposer sur Internet. Accès via :
#   kubectl port-forward svc/adminer 8081:8080 -n preprod
# puis http://localhost:8081 — voir k8s/README.md.
#
# Point d'audit B2 : en prod, l'overlay met ce Deployment à 0 replica
# (k8s/overlays/prod/kustomization.yaml) — aucun pod Adminer ne tourne en
# prod. Réactivation ponctuelle : `kubectl scale deploy/adminer --replicas=1
# -n prod`, puis remise à 0 après usage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  labels:
    app.kubernetes.io/name: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adminer
    spec:
      # Point d'audit I6 : filtre d'appels système par défaut du runtime.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adminer
          image: adminer:4.8.1-standalone # garder synchronisé avec ADMINER_TAG dans ../.env
          ports:
            - containerPort: 8080
          env:
            # Pré-remplit le champ "Serveur" du formulaire de connexion ;
            # les identifiants restent saisis à la main à chaque session,
            # jamais injectés dans le pod (cf. secret postgres-credentials,
            # à consulter via `kubectl get secret postgres-credentials -o yaml`).
            - name: ADMINER_DEFAULT_SERVER
              value: database
          volumeMounts:
            # /tmp doit rester inscriptible malgré readOnlyRootFilesystem
            # ci-dessous. Adminer y écrit les fichiers uploadés temporaires.
            - name: tmp
              mountPath: /tmp
            # session.save_path réel de cette image (vérifié via `php -i`) —
            # PAS /tmp. Sans ce volume, PHP ne peut jamais persister la
            # session malgré un /tmp inscriptible, et Adminer répond
            # systématiquement "Session expirée" dès la tentative de connexion.
            - name: php-sessions
              mountPath: /var/lib/php/sessions
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: php-sessions
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
spec:
  # ClusterIP (par défaut) : jamais de type LoadBalancer/NodePort ici, sinon
  # le service redevient joignable depuis l'extérieur du cluster sans passer
  # par kubectl port-forward.
  selector:
    app.kubernetes.io/name: adminer
  ports:
    - port: 8080
