# Interface d'administration de la base PostgreSQL. Volontairement AUCUNE
# route Ingress ici : cet outil donne un accès direct aux données, la seule
# protection fiable pour un projet perso sans VPN/IAP est de ne jamais
# l'exposer sur Internet. Accès via :
#   kubectl port-forward svc/adminer 8081:8080 -n preprod
# puis http://localhost:8081 — voir k8s/README.md.
#
# Point d'audit B2 : en prod, l'overlay met ce Deployment à 0 replica
# (k8s/overlays/prod/kustomization.yaml) — aucun pod Adminer ne tourne en
# prod. Depuis le 3e audit (question Q5, 2026-09-21) la PRÉPROD fait pareil
# (k8s/overlays/preprod/kustomization.yaml) : les deux environnements partent
# donc à zéro pod, et `replicas: 1` ci-dessous n'est plus qu'un défaut
# théorique du base/ — aucun overlay ne l'utilise.
# Réactivation ponctuelle et remise à zéro : voir k8s/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  labels:
    app.kubernetes.io/name: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adminer
    spec:
      # Point d'audit I6 : filtre d'appels système par défaut du runtime.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adminer
          image: adminer:5.5.1-standalone # garder synchronisé avec ADMINER_TAG dans ../.env
          ports:
            - containerPort: 8080
          env:
            # Pré-remplit le champ "Serveur" du formulaire de connexion ;
            # les identifiants restent saisis à la main à chaque session,
            # jamais injectés dans le pod (cf. secret postgres-credentials,
            # à consulter via `kubectl get secret postgres-credentials -o yaml`).
            - name: ADMINER_DEFAULT_SERVER
              value: database
          volumeMounts:
            # SEUL chemin écrit au runtime par l'image 5.x, et il doit rester
            # inscriptible malgré readOnlyRootFilesystem ci-dessous. Vérifié
            # image en main sur adminer:5.5.1-standalone :
            #   - `session.save_path` n'a plus de valeur (l'image 4.8.1, sous
            #     Debian/PHP 7.4, la forçait à /var/lib/php/sessions — ce
            #     répertoire n'existe plus du tout ici, le volume dédié qu'on
            #     y montait a donc été supprimé) : PHP retombe sur
            #     sys_get_temp_dir(), soit /tmp ;
            #   - `get_temp_dir()` d'adminer.php = upload_tmp_dir (non défini)
            #     ?: sys_get_temp_dir() — donc /tmp aussi pour les fichiers
            #     temporaires d'import et pour /tmp/adminer.key (clé du cookie
            #     "Permanent login") et /tmp/adminer-invalid (compteur de
            #     tentatives de connexion ratées).
            # Sans ce volume, session_start() échoue ("Read-only file system"),
            # la connexion devient impossible ET les avertissements PHP sont
            # émis avant les en-têtes : Adminer perd sa CSP, X-Frame-Options,
            # X-Content-Type-Options et Referrer-Policy ("Cannot modify header
            # information"). Vérifié par un lancement local avec et sans tmpfs.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            # UID de l'utilisateur `adminer` de l'image 5.x (l'image 4.8.1
            # utilisait 999, et ce manifest disait 1000 : ça marchait parce
            # qu'un emptyDir est créé en 0777, pas parce que l'UID était le
            # bon). Même convention que postgres.yaml (runAsUser: 70 = l'UID
            # de l'image). Testé : 100 et 1000 fonctionnent tous les deux,
            # on prend celui de l'image.
            runAsUser: 100
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          # `medium` non précisé = stockage éphémère du nœud (pas la RAM) : un
          # import SQL passe par ce répertoire et ne doit pas être facturé sur
          # les 128Mi de limits.memory. sizeLimit dimensionné sur le
          # upload_max_filesize / post_max_size de l'image (128M) plus la marge
          # des sessions (~10Ko chacune) ; au-delà, le kubelet évince le pod,
          # ce qui est le comportement voulu pour un outil d'admin ponctuel.
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
spec:
  # ClusterIP (par défaut) : jamais de type LoadBalancer/NodePort ici, sinon
  # le service redevient joignable depuis l'extérieur du cluster sans passer
  # par kubectl port-forward.
  selector:
    app.kubernetes.io/name: adminer
  ports:
    - port: 8080
