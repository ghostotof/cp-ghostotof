# Issue #593 — qui peut se connecter à PostgreSQL, et par où.
#
# Remplace le pg_hba.conf que l'image écrit dans PGDATA, dont la dernière règle
# (`host all all all scram-sha-256`) ouvrait le TCP à tout rôle, le
# superutilisateur bootstrap compris, depuis tout pod du namespace. Monté par
# la ConfigMap générée `postgres-hba` (hachée : un changement de ce fichier
# redémarre PostgreSQL, `Recreate`) et lu par `-c hba_file=…` (postgres.yaml).
#
# PostgreSQL applique la PREMIÈRE règle qui correspond au type de connexion, à
# la base, au rôle et à l'adresse. PostgresHbaTest pince la forme de ce
# fichier ; tools/check-postgres-hba.sh démarre l'image avec lui et mesure les
# refus. Le dev (docker-compose.yml) garde le fichier de l'image : un seul
# rôle, superutilisateur, voulu (.claude/rules/deploiement.md, #575).

# TYPE  DATABASE  USER  ADDRESS  METHOD

# Le socket local, comme dans l'image : sondes pg_isready, entrypoint,
# procédure des rôles du runbook, psql sous cpg_reader. Seul un processus du
# conteneur l'atteint (un `kubectl exec`).
local   all  all  trust

# Les bases que l'image crée à côté de celle de l'application (issue #597) :
# PUBLIC garde CONNECT et TEMP sur `postgres` et `template1`. Refusées par
# leur nom, pour tout rôle et toute adresse, AVANT toute règle TCP qui
# accepte — loopback compris, le lecteur n'y a rien à faire. La base de
# l'application est nommée dans un Secret, pas dans le dépôt : c'est une
# exclusion, qu'une base créée plus tard par le superutilisateur éviterait ;
# verify.sql refuse une base de plus, et privileges.sql retire CONNECT et TEMP
# à PUBLIC sur ces deux bases. `template0` refuse déjà les connexions, nommée
# pour que le refus vienne d'ici. Adminer : saisir le nom de la base, un champ
# vide vise `postgres`.
host    postgres,template0,template1  all  all  reject

# Le loopback, pour cpg_reader SEUL (le SHOW des keepalives se lit par TCP,
# k8s/README.md). L'image y faisait confiance à tout rôle, or un
# `kubectl port-forward` ou un conteneur éphémère (`kubectl debug`) arrive
# aussi par 127.0.0.1 : le superutilisateur y passait sans mot de passe
# (relecture de #593). cpg_reader n'a que pg_read_all_data.
host    all  cpg_reader  127.0.0.1/32  trust
host    all  cpg_reader  ::1/128       trust

# Le réseau du cluster : les deux rôles dont une URL est publiée, par mot de
# passe — l'application (backend-secrets) et les migrations
# (backend-migration-secrets). Nommés, jamais par exclusion : le nom du rôle
# bootstrap est dans un Secret, pas dans le dépôt.
#
# L'adresse reste `all`, sur mesure (issue #597, préprod, 2026-10-14) : un pod
# arrive avec son adresse de pod (pas de NAT), mais le nœud qui héberge
# PostgreSQL arrive avec son adresse `cilium_host`, elle aussi DANS la plage
# des pods — indiscernable d'un pod, et tirée à neuf quand Kapsule remplace le
# nœud. Ce chemin de l'hôte vaut pour tout pod `hostNetwork` posé sur ce nœud,
# quel que soit son namespace : Cilium ne lui applique pas les NetworkPolicy.
# Un pod d'un autre namespace, ou un autre nœud, n'atteint pas le serveur
# (default-deny-ingress + allow-datastores-from-app : timeout mesuré). Une
# plage ici ne refuserait donc rien de ce qui peut se connecter ; elle ne
# servirait qu'à une exposition future par NodePort ou hostPort (SNAT vers
# l'adresse du nœud), qu'aucun manifeste ne fait.
host    all  cpg_app,cpg_migrator  all  scram-sha-256

# La réplication physique, que `all` ne couvre pas : aucun usage (un seul
# serveur). Refusée par sa propre règle plutôt que faute d'entrée.
host    replication  all  all  reject

# Tout le reste : le superutilisateur bootstrap (y compris sur le loopback),
# cpg_reader hors loopback, un rôle créé à la main. PostgreSQL refuserait déjà
# ce qu'aucune règle ne couvre ; la règle explicite garde ce refus si une
# ligne est ajoutée au-dessus.
host    all  all  all  reject
