# Peuplement du contenu de référence — préprod uniquement.
#
# Pourquoi ce Job existe : la préprod naissait vide. Les migrations créent le
# schéma, rien ne créait le contenu, et aucune étape ne le rappelait — si bien
# que « Incidents » et « Contributions » y sont restées vides depuis leurs
# releases respectives, ce qui rend les recettes peu représentatives et les
# smoke tests aveugles à ce que voit réellement un visiteur.
#
# Pourquoi il est SANS DANGER de le jouer à chaque déploiement : depuis le
# 2026-09-08, les commandes `app:*:seed` refusent d'écraser du contenu déjà
# présent (cf. App\Shared\Presentation\Command\GuardsExistingContent). Une base
# neuve se peuple, une base déjà peuplée est laissée intacte, et le refus sort
# en code 0 — sans quoi ce Job ferait échouer tous les déploiements après le
# premier. La réinitialisation délibérée demande `--force`, qui n'est
# volontairement PAS passé ici.
#
# Conséquence à assumer : ce Job ne rattrape jamais une divergence. Si le
# contenu de référence évolue dans le code, la préprod garde l'ancien tant que
# personne ne joue `--force` à la main. C'est le prix de l'innocuité, et c'est
# le bon compromis : un Job qui ne peut rien détruire vaut mieux qu'un Job qui
# synchronise et qui, un jour, se trompera de namespace.
#
# La préprod ne reçoit JAMAIS de copie des données de production : le contenu
# vient du code, pas d'un dump. Un dump transporterait les comptes de
# `cpg_user` — adresses e-mail et empreintes de mots de passe — vers un second
# environnement, ce qui multiplie les endroits d'où ils peuvent fuir sans rien
# apporter ici, le contenu de production étant précisément celui de ces seeds.
#
# Et symétriquement : LA PRODUCTION N'EST JAMAIS PEUPLÉE AUTOMATIQUEMENT
# (décision du 2026-09-09, issue #17). Ce Job est branché sur `deploy-preprod`
# et doit y rester. Son contenu est rédigé au backoffice ; un écrivain
# automatique braqué dessus serait un risque permanent pour un bénéfice
# occasionnel. Le peupler reste un geste délibéré, au cas par cas : appliquer ce
# même Job à la main au namespace `prod` quand une table réellement vide a
# besoin d'un point de départ — typiquement un nouveau contexte borné. Le
# garde-fou rend ce geste sûr (les contextes déjà peuplés refusent), mais
# « sûr » n'est pas « automatique », et c'est là toute la décision.
#
# DÉLIBÉRÉMENT ABSENT de kustomization.yaml `resources:`, pour les mêmes raisons
# que migrate-job.yaml : il est appliqué à la demande par le pipeline, donc le
# transformateur d'images de kustomize ne le voit pas — d'où le placeholder
# ${BACKEND_IMAGE} substitué par envsubst. Ne pas le remplacer par
# `image: backend`, qui serait résolu en `docker.io/library/backend`.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-seed
  labels:
    app.kubernetes.io/name: backend-seed
spec:
  # Aucune reprise : ces commandes sont sans effet quand le contenu est déjà
  # là, et un échec réel (base injoignable, contenu invalide) demande un
  # diagnostic humain plutôt qu'un retry.
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-seed
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: ${BACKEND_IMAGE}
          # Même raison que le Job de migration : un tag Git est mutable, et une
          # release rejouée sous le même nom laisserait le nœud resservir
          # l'image qu'il a en cache — ce Job jouerait alors le contenu d'une
          # version antérieure tout en affichant le bon tag.
          imagePullPolicy: Always
          # `set -e` : on s'arrête au premier échec réel plutôt que de
          # poursuivre sur une base à moitié peuplée. Ajouter un contexte borné
          # doté d'un seed veut dire ajouter sa ligne ici.
          command:
            - sh
            - -c
            - |
              set -e
              php bin/console app:about:seed
              php bin/console app:quality:seed
              php bin/console app:contributions:seed
              php bin/console app:incidents:seed
              php bin/console app:watch:seed
              php bin/console app:case-studies:seed
              php bin/console app:anonymous-cv:seed
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          volumeMounts:
            - name: var-log
              mountPath: /var/www/backend/var/log
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Strictement identique au Deployment : ce Job ne doit pas être une
          # porte dérobée plus permissive que le service qu'il peuple.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      volumes:
        - name: var-log
          emptyDir: {}
