# Issue #521 — `messenger:failed:remove <id>`, un message de `failed` à la fois.
#
# Supprime définitivement le message de la table `messenger_messages`
# (une invitation sans génération une fois renvoyée depuis le backoffice, une
# enveloppe au MAC refusé, un témoin du smoke refusé).
#
# Règle de #520 (`.claude/rules/deploiement.md`, « What never kubectl exec
# covers ») : une commande à effet de bord passe par un Job, jamais par
# `kubectl exec`. La lecture de `failed` (`messenger:failed:show`), elle, reste
# un exec humain en lecture seule : en `-vv`, elle affiche le message lui-même
# (nom, adresse et texte d'un visiteur), qu'un Job écrirait dans ses journaux.
# Procédure : k8s/README.md, « File d'échec Messenger (`failed`) ».
#
# DÉLIBÉRÉMENT ABSENT de kustomization.yaml `resources:`, comme migrate-job.yaml :
# un `apply -k` ne touche jamais à Messenger. Lancé par tools/run-job.sh, qui
# substitue par envsubst (liste explicite) les placeholders nommés ici et
# supprime d'abord le Job précédent (la spec d'un Job est immuable).
# Placeholders : ${BACKEND_IMAGE} et ${FAILED_MESSAGE_ID}, l'Id que donne
# `messenger:failed:show` (procédure du runbook).
#
# Jamais de `-v` : sans `-vv`, Messenger n'affiche du message que sa classe,
# ses dates et l'erreur (déjà expurgée, #356), mesuré pour #521 sur un message
# de contact et une invitation ; la sortie part dans les journaux du pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-messenger-failed-remove
  labels:
    app.kubernetes.io/name: backend-messenger-failed-remove
spec:
  # Aucune reprise : un second passage rejouerait un e-mail, ou ne trouverait
  # plus le message.
  backoffLimit: 0
  # Compté dès la création : ordonnancement, deux tirages `Always` de l'image
  # (initContainer et conteneur), puis la commande. Sous les 300 s qu'attend
  # la procédure (tools/run-job.sh … 300), qui voit donc l'échec.
  activeDeadlineSeconds: 240
  # Une heure pour relire `kubectl logs job/backend-messenger-failed-remove`.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-messenger-failed-remove
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Issue #288, cf. migrate-job.yaml : cache.system reste inscriptible.
        - name: seed-cache-system
          image: ${BACKEND_IMAGE}
          imagePullPolicy: Always
          command: ['sh', '-c', 'cp -a /var/www/backend/var/cache/prod/pools/system/. /cache-system/']
          volumeMounts:
            - name: cache-system
              mountPath: /cache-system
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      containers:
        - name: failed-remove
          image: ${BACKEND_IMAGE}
          # Cf. migrate-job.yaml : le Job exécute exactement le code de la release.
          imagePullPolicy: Always
          # `sh -c` pour refuser un Id qui ne serait pas un entier : tools/run-job.sh
          # admet `-`, et `--all` passé pour un Id serait lu comme une option
          # (`failed:remove --all` vide toute la table). 64 (EX_USAGE) avant toute
          # console, sans citer la valeur. `exec` rend à la commande le PID et le
          # code de sortie ; `--force` : aucune confirmation, le pod n'a pas de
          # terminal. L'Id arrive par l'environnement, sous un autre nom que le
          # placeholder : envsubst remplace aussi `$FAILED_MESSAGE_ID`.
          command:
            - sh
            - -c
            - >-
              case "$MESSAGE_ID" in ''|*[!0-9]*) echo 'FAILED_MESSAGE_ID : un Id numérique de messenger:failed:show est attendu.' >&2; exit 64;; esac;
              exec php bin/console messenger:failed:remove "$MESSAGE_ID" --force --no-interaction
          env:
            # Issue #525 : attentes de verrou PostgreSQL bornées comme sous FPM (valeur
            # de www.prod.conf ; ConsoleLockWaitBoundTest, .claude/rules/deploiement.md).
            - name: PGOPTIONS
              value: '-c lock_timeout=5s'
            - name: MESSAGE_ID
              value: '${FAILED_MESSAGE_ID}'
            # Revue de #521 : Symfony Console lit aussi SHELL_VERBOSITY ; posée à 3
            # dans backend-config, elle mettrait ce Job en -vv (le message dans
            # ses journaux). `env` l'emporte sur `envFrom`.
            - name: SHELL_VERBOSITY
              value: '0'
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          volumeMounts:
            - name: var-log
              mountPath: /var/www/backend/var/log
            - name: cache-system
              mountPath: /var/www/backend/var/cache/prod/pools/system
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Strictement identique au Deployment, comme le Job de migration.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      volumes:
        - name: var-log
          emptyDir: {}
        - name: cache-system
          emptyDir:
            sizeLimit: 64Mi
