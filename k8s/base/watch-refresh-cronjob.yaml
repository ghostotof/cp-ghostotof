# Rafraîchit la veille technique servie par /api/watch : cycles de vie des
# versions (endoflife.date) et vulnérabilités connues des paquets déployés
# (OSV.dev). Exécute `app:watch:refresh` — voir
# src/Portfolio/Watch/Presentation/Command/RefreshWatchCommand.php.
#
# C'est le SEUL objet du cluster qui provoque des appels sortants vers des
# tiers. Les NetworkPolicy du namespace ne restreignent délibérément que
# l'entrée (cf. network-policies.yaml), ces appels passent donc sans règle
# supplémentaire ; l'accès à Postgres est couvert par `allow-datastores-from-app`,
# qui autorise tous les pods du namespace.
#
# Rythme quotidien (décision D9) : les dates de fin de support évoluent au mois,
# et les publications de vulnérabilités ne justifient pas une fréquence plus
# serrée pour une page de démonstration. Le seuil d'obsolescence côté
# application est fixé à 36 h, soit une fois et demie cette période : un cycle
# manqué ne déclenche donc pas l'avertissement, deux le déclenchent.
#
# Horaire décalé de `contact-failed-messages-purge` (17 3 * * *) : rien ne les
# oppose, mais les faire démarrer ensemble ferait converger deux pics sur le
# même nœud sans raison.
#
# Réutilise l'image backend et les mêmes ConfigMap/Secret que le Deployment
# (DATABASE_URL vient de backend-secrets).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: watch-refresh
  labels:
    app.kubernetes.io/name: watch-refresh
spec:
  schedule: '41 4 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Plus large que la purge (300 s) : cette commande attend des tiers. Le
      # pire cas tient dans les bornes du client HTTP — quelques secondes par
      # produit, une trentaine pour l'analyse de vulnérabilités — mais autant
      # laisser de la marge plutôt que de tuer un rafraîchissement en cours.
      activeDeadlineSeconds: 600
      # Une source injoignable fait sortir la commande en échec sans rien
      # écraser : la reprise a du sens, la panne étant généralement passagère.
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: watch-refresh
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 10001
            # Point d'audit I6 : filtre d'appels système par défaut du runtime.
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: backend
              command: ['php', 'bin/console', 'app:watch:refresh', '--no-interaction']
              envFrom:
                - configMapRef:
                    name: backend-config
                - secretRef:
                    name: backend-secrets
              volumeMounts:
                - name: var-log
                  mountPath: /var/www/backend/var/log
              resources:
                requests:
                  cpu: 25m
                  memory: 96Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
          volumes:
            - name: var-log
              emptyDir: {}
