# Postgres en pod dans le cluster (pas de base managée) : le plus économique
# pour un projet personnel, mais AUCUNE sauvegarde automatique — à faire
# évoluer vers Scaleway Managed Database si la donnée devient critique.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  strategy:
    # Recreate, pas RollingUpdate : deux pods Postgres ne peuvent pas partager
    # le même PVC ReadWriteOnce.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      # fsGroup 70 = groupe "postgres" de l'image officielle (vérifié :
      # `id postgres` -> uid=70 gid=70) : le volume est monté déjà accessible
      # en écriture à ce groupe, l'entrypoint (qui gère lui-même le cas
      # non-root, cf. `id -u` = 0 check) n'a pas besoin de démarrer root pour
      # chown le PGDATA.
      securityContext:
        fsGroup: 70
        # Point d'audit I6 : filtre d'appels système par défaut du runtime.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6-alpine # garder synchronisé avec POSTGRES_TAG dans ../.env
          # Issue #279 : un client disparu sans FIN (nœud perdu, partition
          # réseau) gardait sa session — et l'advisory lock de session des
          # limiteurs (#272) — jusqu'au keepalive Linux par défaut, 2 h. Les
          # keepalives la ferment en 60 + 10 × 3 = 90 s (mesuré : 96 s) ;
          # tcp_user_timeout (ms) borne aussi une réponse jamais acquittée, que
          # les keepalives ne couvrent pas (sans lui : ~15 min de
          # retransmissions ; mesuré : 106 s). `args`, pas `command` :
          # l'entrypoint de l'image reste celui qui initialise la base. Ignorés
          # sur un socket Unix, où `SHOW` les lit à 0 : les vérifier par TCP
          # (k8s/README.md). PostgresGhostSessionReleaseTest.
          args:
            - postgres
            - -c
            - tcp_keepalives_idle=60
            - -c
            - tcp_keepalives_interval=10
            - -c
            - tcp_keepalives_count=3
            - -c
            - tcp_user_timeout=90000
            # Issue #593 : le pg_hba.conf du dépôt (postgres-pg_hba.conf), pas
            # celui que l'image écrit dans PGDATA — le superutilisateur
            # bootstrap n'est plus joignable par le réseau. Hors de PGDATA,
            # donc valable sur un PVC déjà initialisé ; l'entrypoint passe
            # aussi ces args au serveur temporaire de l'initialisation, qui
            # n'écoute que le socket local (`trust`). PostgresHbaTest.
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # Cf. commentaire dans ../docker-compose.yml : depuis Postgres 18,
            # l'image officielle range les données dans un sous-répertoire
            # versionné (layout pg_ctlcluster) et refuse de démarrer si le
            # volume pointe directement sur .../data.
            - name: data
              mountPath: /var/lib/postgresql
            # Un fichier, par subPath : /etc/postgresql garde le reste de
            # l'image. Lisible par l'uid 70 (ConfigMap en 0644 par défaut).
            - name: hba
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        # Nom réécrit par kustomize avec le hachage du contenu (configMapGenerator).
        - name: hba
          configMap:
            name: postgres-hba
---
apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
