# Point d'audit C8 — exécution des migrations Doctrine au déploiement.
#
# Remplace le `kubectl exec deploy/backend -c php-fpm -- php bin/console
# doctrine:migrations:migrate` du pipeline. `pods/exec` est un verbe très large :
# il donne au compte de service CI un shell interactif dans n'importe quel pod du
# namespace — donc l'accès à tous les secrets montés (clés JWT, identifiants
# Postgres, CV) et la possibilité d'exécuter du code arbitraire en production.
# Ce Job fait exactement une chose, déclarée en clair et auditable, ce qui permet
# de retirer `pods/exec: create` du Role (cf. github-actions-rbac/role.yaml).
#
# DÉLIBÉRÉMENT ABSENT de kustomization.yaml `resources:` — il n'a pas à être
# recréé à chaque `apply -k`, mais appliqué à la demande par le pipeline
# (tools/run-job.sh : delete + apply + wait). Corollaire : le transformateur
# d'images de kustomize ne le voit pas, d'où le placeholder ${BACKEND_IMAGE}
# substitué par envsubst au moment de l'apply. Ne pas le remplacer par `image: backend` : hors kustomize,
# ce nom serait résolu en `docker.io/library/backend`.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  labels:
    app.kubernetes.io/name: backend-migrate
spec:
  # Une seule reprise : une migration qui échoue deux fois demande un diagnostic
  # humain, pas un retry en boucle sur un schéma peut-être à moitié appliqué.
  backoffLimit: 1
  # Issue #525 : le Job ne survit pas longtemps à l'attente du pipeline. Sans
  # délai, un pod de migration bloqué (un DDL long qui tient son verrou
  # exclusif devant l'API, une connexion pendue) continuait indéfiniment après
  # le `::error::` de `tools/run-job.sh`, qui ne supprime un Job qu'avant de
  # l'appliquer. Compté depuis la création du Job (pull `Always` et reprise
  # compris), et AU-DESSUS des 300 s d'attente de `pipeline.yml` augmentées des
  # ~35 s de dépassement de `tools/wait-rollout.sh` : à l'expiration de
  # l'attente, le pod tourne encore et `run-job.sh` imprime ses journaux — à
  # l'échéance du délai, le contrôleur de Job supprime ses pods, et leurs
  # journaux avec eux. Puis le pod meurt (SIGTERM, SIGKILL après 30 s), sa
  # transaction est annulée et son verrou rendu. `tools/tests/run-job.test.sh`
  # vérifie l'encadrement (attente + 35 s < délai ≤ attente + 120 s).
  activeDeadlineSeconds: 360
  # Le Job disparaît de lui-même 10 min après sa fin ; le pipeline a déjà
  # récupéré les logs en cas d'échec.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Issue #288 : cache.system (var/cache/prod/pools/system) doit rester
        # inscriptible malgré readOnlyRootFilesystem. L'emptyDir `cache-system`
        # masquerait le cache préchauffé de l'image : on l'y recopie d'abord.
        - name: seed-cache-system
          image: ${BACKEND_IMAGE}
          imagePullPolicy: Always
          command: ['sh', '-c', 'cp -a /var/www/backend/var/cache/prod/pools/system/. /cache-system/']
          volumeMounts:
            - name: cache-system
              mountPath: /cache-system
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      containers:
        - name: migrate
          image: ${BACKEND_IMAGE}
          # `Always` et non le défaut `IfNotPresent` : un tag Git est mutable, et
          # une release rejouée sous le même nom (correctif avant tout
          # déploiement réussi) laisse le nœud resservir l'image qu'il a en
          # cache. Ce Job a alors joué les migrations d'une version antérieure
          # tout en affichant le bon tag — un correctif de migration semblait
          # sans effet, alors qu'il n'était simplement jamais exécuté.
          # Le surcoût est nul à l'échelle d'un Job qui tourne une fois par
          # déploiement, et la garantie « ce Job exécute exactement le code de
          # la release » vaut bien plus que ce pull.
          imagePullPolicy: Always
          command: ['php', 'bin/console', 'doctrine:migrations:migrate', '--no-interaction']
          env:
            # Issue #525 : attentes de verrou PostgreSQL bornées comme sous FPM (valeur
            # de www.prod.conf ; ConsoleLockWaitBoundTest, .claude/rules/deploiement.md).
            # Ici, la borne a un sens propre : elle ARRÊTE LE DÉPLOIEMENT, elle
            # ne refuse pas une requête. Un DDL qui attend un verrou exclusif
            # met en file derrière lui chaque requête de l'API sur sa table
            # (chacune échouant au bout de ses 5 s sous FPM) ; borné, il échoue,
            # le Job aussi, `apply -k` n'a pas lieu et l'ancienne release
            # continue de servir sur l'ancien schéma (#175). La reprise
            # (`backoffLimit: 1`) rejoue alors les migrations restantes, ce qui
            # suffit contre un bloqueur passager ; sinon, relancer le job de
            # déploiement. Une migration qui doit attendre plus longtemps
            # l'annonce elle-même : `SET LOCAL lock_timeout = '…'` en tête de
            # son `up()` (portée de sa transaction) ; une migration non
            # transactionnelle (`isTransactional(): false`, pour un
            # `CREATE INDEX CONCURRENTLY`) n'a pas de transaction où SET LOCAL
            # vaille : elle pose `SET lock_timeout = '…'` sur la session.
            - name: PGOPTIONS
              value: '-c lock_timeout=5s'
            # Issue #575 : les migrations tournent sous le rôle PROPRIÉTAIRE du
            # schéma (cpg_migrator), le seul qui puisse faire du DDL ; l'application
            # tourne sous cpg_app, qui n'a que le DML (DATABASE_URL de
            # backend-secrets). Un `env` prime sur `envFrom` : backend-secrets
            # reste monté pour APP_SECRET et le reste du noyau, seule l'URL
            # change. Ce Secret n'est monté nulle part ailleurs
            # (MigrationRoleSecretsTest) : l'URL du propriétaire n'atteint
            # jamais un pod qui sert des requêtes. Rôles et procédure :
            # postgres-roles-job.yaml, k8s/README.md « Rôles PostgreSQL ».
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-migration-secrets
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          volumeMounts:
            # Mêmes montages que le conteneur php-fpm : var/cache arrive
            # pré-chauffé du build et reste en lecture seule, seul var/log doit
            # être inscriptible malgré readOnlyRootFilesystem.
            - name: var-log
              mountPath: /var/www/backend/var/log
            # Issue #288 : seul chemin inscriptible de var/cache, cf. le volume.
            - name: cache-system
              mountPath: /var/www/backend/var/cache/prod/pools/system
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Strictement identique au Deployment : le Job ne doit pas être une
          # porte dérobée plus permissive que le service qu'il migre.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      volumes:
        - name: var-log
          emptyDir: {}
        # Issue #288 — cache dérivé, jetable et identique dans chaque pod : ce
        # n'est pas de l'état applicatif (ADR 0005, amendement du 2026-09-30).
        # Borné pour qu'un cache emballé ne remplisse pas le disque du nœud
        # (préchauffé : ~10 Mo).
        - name: cache-system
          emptyDir:
            sizeLimit: 64Mi
