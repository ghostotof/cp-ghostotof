# Point d'audit C8 — exécution des migrations Doctrine au déploiement.
#
# Remplace le `kubectl exec deploy/backend -c php-fpm -- php bin/console
# doctrine:migrations:migrate` du pipeline. `pods/exec` est un verbe très large :
# il donne au compte de service CI un shell interactif dans n'importe quel pod du
# namespace — donc l'accès à tous les secrets montés (clés JWT, identifiants
# Postgres, CV) et la possibilité d'exécuter du code arbitraire en production.
# Ce Job fait exactement une chose, déclarée en clair et auditable, ce qui permet
# de retirer `pods/exec: create` du Role (cf. github-actions-rbac/role.yaml).
#
# DÉLIBÉRÉMENT ABSENT de kustomization.yaml `resources:` — il n'a pas à être
# recréé à chaque `apply -k`, mais appliqué à la demande par le pipeline
# (delete + apply + wait). Corollaire : le transformateur d'images de kustomize
# ne le voit pas, d'où le placeholder ${BACKEND_IMAGE} substitué par envsubst au
# moment de l'apply. Ne pas le remplacer par `image: backend` : hors kustomize,
# ce nom serait résolu en `docker.io/library/backend`.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  labels:
    app.kubernetes.io/name: backend-migrate
spec:
  # Une seule reprise : une migration qui échoue deux fois demande un diagnostic
  # humain, pas un retry en boucle sur un schéma peut-être à moitié appliqué.
  backoffLimit: 1
  # Le Job disparaît de lui-même 10 min après sa fin ; le pipeline a déjà
  # récupéré les logs en cas d'échec.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ${BACKEND_IMAGE}
          command: ['php', 'bin/console', 'doctrine:migrations:migrate', '--no-interaction']
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          volumeMounts:
            # Mêmes montages que le conteneur php-fpm : var/cache arrive
            # pré-chauffé du build et reste en lecture seule, seul var/log doit
            # être inscriptible malgré readOnlyRootFilesystem.
            - name: var-log
              mountPath: /var/www/backend/var/log
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Strictement identique au Deployment : le Job ne doit pas être une
          # porte dérobée plus permissive que le service qu'il migre.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      volumes:
        - name: var-log
          emptyDir: {}
