# Issue #470 — message témoin du smoke préprod : prouve qu'un message mis en
# file est consommé par le worker.
#
# `smoke-test-preprod` ne vérifiait que `rollout status deployment/worker`. Un
# écart de clé de MAC entre l'API et le worker (un `KEY_CONTEXT` mal déployé, un
# worker resté sur l'ancienne release) laissait la préprod verte avec chaque
# message dans `failed`. Ce Job tourne l'image de la release avec les Secrets
# du backend, comme l'API, donc signe sous la même clé qu'elle, et met en file
# un `MessengerProbeMessage` : un identifiant, sans mail ni donnée métier. Le worker
# pose une marque en cache en le traitant. `app:messenger:probe` sort en 1 si la
# marque ne vient pas, et `smoke-test-preprod`, donc `rollback-preprod`, suit.
#
# DÉLIBÉRÉMENT ABSENT de kustomization.yaml `resources:`, comme migrate-job.yaml :
# appliqué par tools/smoke-messenger-probe.sh, qui substitue ${BACKEND_IMAGE}
# par envsubst (liste explicite) et supprime d'abord le Job précédent (la spec
# d'un Job est immuable).
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-messenger-probe
  labels:
    app.kubernetes.io/name: backend-messenger-probe
spec:
  # Une sonde qui échoue doit faire échouer le smoke, pas réessayer.
  backoffLimit: 0
  # Compté dès la création du Job : ordonnancement, deux pulls de l'image
  # (initContainer et conteneur, `Always`), démarrage, puis les 90 s de la
  # sonde. 150 s laissaient ~55 s aux pulls, une release saine aurait été
  # annulée sur un GHCR lent (relecture de #470). Sous les 300 s que le
  # pipeline attend (tools/smoke-messenger-probe.sh).
  activeDeadlineSeconds: 240
  # Une heure pour relire `kubectl logs job/backend-messenger-probe`.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-messenger-probe
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Issue #288, cf. migrate-job.yaml : cache.system reste inscriptible.
        - name: seed-cache-system
          image: ${BACKEND_IMAGE}
          imagePullPolicy: Always
          command: ['sh', '-c', 'cp -a /var/www/backend/var/cache/prod/pools/system/. /cache-system/']
          volumeMounts:
            - name: cache-system
              mountPath: /cache-system
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      containers:
        - name: messenger-probe
          image: ${BACKEND_IMAGE}
          # Cf. migrate-job.yaml : le Job exécute exactement le code de la release.
          imagePullPolicy: Always
          command: ['php', 'bin/console', 'app:messenger:probe', '--no-interaction', '--timeout=90']
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          volumeMounts:
            - name: var-log
              mountPath: /var/www/backend/var/log
            - name: cache-system
              mountPath: /var/www/backend/var/cache/prod/pools/system
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Strictement identique au Deployment, comme le Job de migration.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      volumes:
        - name: var-log
          emptyDir: {}
        - name: cache-system
          emptyDir:
            sizeLimit: 64Mi
