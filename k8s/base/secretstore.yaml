# External Secrets Operator (à installer sur le cluster, cf. k8s/README.md)
# synchronise les Secrets Kubernetes depuis Scaleway Secret Manager (fr-par —
# hébergement France garanti), au lieu d'un `kubectl create secret` manuel.
# Un seul SecretStore, partagé par les deux namespaces (même projet Scaleway) :
# la séparation préprod/prod se fait par préfixe de nom sur les secrets
# Scaleway eux-mêmes (preprod-*/prod-*), cf. k8s/overlays/*/external-secrets.yaml.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: scaleway-secret-manager
spec:
  provider:
    scaleway:
      region: fr-par
      # projectId reste en clair : c'est un identifiant de projet, pas un
      # identifiant d'accès — il ne permet rien à lui seul.
      projectId: '22e1d98f-ff32-4f91-9c23-66268c63f377'
      # Point d'audit C4 : accessKey était inscrit en clair ici. Ce n'est certes
      # pas un secret au sens IAM Scaleway (c'est la moitié publique d'une paire,
      # comparable à un AccessKeyId AWS), mais dans un dépôt public il désigne
      # nommément l'identité IAM qui a accès au Secret Manager : il réduit le
      # travail d'un attaquant à la seule secretKey, et sert de point de départ
      # à du ciblage (phishing du porteur, corrélation avec d'autres fuites).
      # Les deux moitiés vivent désormais dans le même Secret bootstrap
      # `scaleway-eso-auth`, créé une fois à la main hors dépôt (cf. README).
      accessKey:
        secretRef:
          name: scaleway-eso-auth
          key: access-key
      secretKey:
        secretRef:
          name: scaleway-eso-auth
          key: secret-key
