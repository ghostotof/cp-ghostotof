# Image unique, promue de la préprod vers la prod sans reconstruction :
# l'URL de l'API est injectée au runtime via la variable d'env API_URL
# (docker/node/docker-entrypoint.sh), fournie ici par le ConfigMap de l'overlay.
#
# readOnlyRootFilesystem exige que docker-entrypoint.sh puisse quand même
# écrire config.js dans /usr/share/nginx/html : un initContainer copie donc le
# contenu de l'image (déjà buildé, immuable) vers un emptyDir partagé, monté
# en écriture par le conteneur principal — seul config.js y sera réécrit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      # Packages GHCR rendus publics (cf. k8s/README.md §1bis) : pull
      # anonyme, plus besoin d'imagePullSecrets.
      securityContext:
        fsGroup: 101
        # Point d'audit I6 : filtre d'appels système par défaut du runtime.
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-html
          image: frontend
          command: ['sh', '-c', 'cp -a /usr/share/nginx/html/. /shared-html/']
          volumeMounts:
            - name: shared-html
              mountPath: /shared-html
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      containers:
        - name: nginx
          image: frontend
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: frontend-config
          volumeMounts:
            - name: shared-html
              mountPath: /usr/share/nginx/html
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: shared-html
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
