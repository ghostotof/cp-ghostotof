# Issue #386 — création d'un compte ROLE_SUPER en production, à la main.
#
# `app:user:create` est la seule voie qui crée un compte sans invitation : elle
# sert à amorcer le premier administrateur (ADR 0001), ou à en recréer un si
# tous ont été perdus. Elle émet l'événement `user-created` du journal
# `security_audit`, sur le stderr de son processus. Lancée par `kubectl exec`,
# ce stderr est le terminal de l'opérateur : la ligne s'y affiche puis
# disparaît, et `kubectl logs` ne la verra jamais. Ce Job lance la commande dans
# son propre pod, dont le stderr est celui du conteneur.
#
# Le mot de passe ne passe jamais par l'argv ni par une variable (invariant
# « a secret is never passed as a process argument ») : un Secret temporaire,
# créé depuis un fichier, est monté en lecture seule et lu par
# `--password-stdin`. Procédure complète, suppression du Secret comprise :
# k8s/README.md, « Créer un compte super-administrateur ».
#
# DÉLIBÉRÉMENT ABSENT de kustomization.yaml `resources:`, comme migrate-job.yaml :
# un `apply -k` ne doit jamais créer de compte. D'où les placeholders substitués
# par envsubst au moment de l'apply : ${BACKEND_IMAGE} (même règle que
# migrate-job.yaml) et ${CPG_USERNAME} — aucun nom de compte réel dans ce dépôt.
# Toujours `envsubst '${BACKEND_IMAGE} ${CPG_USERNAME}'`, liste explicite : sans
# elle, envsubst effacerait toute autre `$VARIABLE` inconnue de l'opérateur.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-create-user
  labels:
    app.kubernetes.io/name: backend-create-user
spec:
  # Aucune reprise : un nom déjà pris ou un mot de passe refusé demandent un
  # humain, et une seconde tentative relirait le même Secret pour rien.
  backoffLimit: 0
  # Une journée pour relire `kubectl logs job/backend-create-user` ; le Secret,
  # lui, est supprimé dès la fin du Job (cf. la procédure).
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-create-user
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Issue #288, cf. migrate-job.yaml : cache.system reste inscriptible.
        - name: seed-cache-system
          image: ${BACKEND_IMAGE}
          imagePullPolicy: Always
          command: ['sh', '-c', 'cp -a /var/www/backend/var/cache/prod/pools/system/. /cache-system/']
          volumeMounts:
            - name: cache-system
              mountPath: /cache-system
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      containers:
        - name: create-user
          image: ${BACKEND_IMAGE}
          # Cf. migrate-job.yaml : le Job exécute exactement le code de la release.
          imagePullPolicy: Always
          # `sh -c` pour la redirection seulement ; `exec` rend à la commande le
          # PID et le code de sortie. Le nom arrive par l'environnement, entre
          # guillemets : jamais interprété par le shell. Sous un autre nom que
          # le placeholder : `envsubst` remplace aussi `$CPG_USERNAME`, et la
          # procédure ne lui fait substituer que ${BACKEND_IMAGE} et
          # ${CPG_USERNAME}.
          command:
            - sh
            - -c
            - exec php bin/console app:user:create --no-interaction --username="$NEW_ACCOUNT_USERNAME" --role=ROLE_SUPER --password-stdin < /run/secrets/create-user/password
          env:
            - name: NEW_ACCOUNT_USERNAME
              value: '${CPG_USERNAME}'
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          volumeMounts:
            - name: create-user-password
              mountPath: /run/secrets/create-user
              readOnly: true
            - name: var-log
              mountPath: /var/www/backend/var/log
            - name: cache-system
              mountPath: /var/www/backend/var/cache/prod/pools/system
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Strictement identique au Deployment, comme le Job de migration.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      volumes:
        # Créé à la main juste avant l'apply, supprimé juste après. 288 est
        # 0440 en décimal : le groupe du fsGroup lit, personne n'écrit. Écrit en
        # décimal parce que `0440` est octal en YAML 1.1 (Kubernetes) mais une
        # chaîne en YAML 1.2 — un même fichier, deux lectures.
        - name: create-user-password
          secret:
            secretName: backend-create-user-password
            defaultMode: 288
        - name: var-log
          emptyDir: {}
        - name: cache-system
          emptyDir:
            sizeLimit: 64Mi
