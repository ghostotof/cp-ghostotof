# Un secret Scaleway = une valeur (pas de JSON multi-clés) : plus verbeux,
# mais chaque mapping est trivial à vérifier et à faire tourner isolément.
# Noms Scaleway préfixés "preprod-" — mêmes noms de Secret Kubernetes cible
# que ce que les Deployments référencent déjà (backend-secrets, jwt-keys...).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_SECRET
      remoteRef:
        key: name:preprod-backend-app-secret
    - secretKey: DATABASE_URL
      remoteRef:
        key: name:preprod-backend-database-url
    - secretKey: MESSENGER_TRANSPORT_DSN
      remoteRef:
        key: name:preprod-backend-messenger-dsn
    - secretKey: JWT_PASSPHRASE
      remoteRef:
        key: name:preprod-backend-jwt-passphrase
    - secretKey: MAILER_DSN
      remoteRef:
        key: name:preprod-backend-mailer-dsn
    - secretKey: CONTACT_RECIPIENT_EMAIL
      remoteRef:
        key: name:preprod-backend-contact-email
    # Clé Anthropic de l'assistant de traduction du backoffice (ADR 0004, D5) :
    # ne sert qu'à ROLE_SUPER, aucun chemin public ne l'utilise. Créer le secret
    # Scaleway AVANT le déploiement qui l'attend, sinon ESO laisse
    # `backend-secrets` incomplet et le Deployment ne démarre pas.
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: name:preprod-backend-anthropic-api-key
---
# Déclencheur du profilage Xdebug (3e audit, constat A12, tâche T5.4) —
# préprod uniquement, jamais en prod. Secret DÉDIÉ et non une clé de plus dans
# `backend-secrets` : monté `optional: true` sur le seul Deployment `backend`
# (cf. backend-xdebug.yaml), son absence n'empêche donc pas le pod de démarrer,
# et il n'est injecté ni dans le worker, ni dans les Jobs, ni dans les CronJobs.
#
# Le template porte la propriété de sécurité : c'est lui qui décide si Xdebug
# est armé. `XDEBUG_MODE` vaut `profile` seulement si la valeur distante fait
# au moins 32 caractères — un secret absent (ESO ne crée alors pas le Secret du
# tout), vide ou trop court laisse l'image sur son `xdebug.mode = "off"`, et le
# profilage est impossible. On ne peut PAS s'en remettre à
# `xdebug.trigger_value` seul : une valeur vide signifie pour Xdebug
# « n'importe quelle valeur déclenche », c'est-à-dire ouvert à tous.
#
# `trim` : `scw secret version create data=@fichier` pousse les octets du
# fichier tels quels, saut de ligne final compris — or un cookie ne peut pas
# contenir de saut de ligne, la comparaison échouerait silencieusement.
# La recette du README écrit le fichier sans saut de ligne ; ceci est la
# ceinture. Mode `profile` SEUL, jamais `trace` : une trace écrit les arguments
# des appels de fonction en clair (donc les mots de passe d'un login), là où un
# profil cachegrind ne contient que des chemins, des noms de fonctions et des
# compteurs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-xdebug-trigger
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: backend-xdebug-trigger
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        XDEBUG_MODE: '{{ if ge (len (trim .trigger)) 32 }}profile{{ else }}off{{ end }}'
        XDEBUG_TRIGGER_SECRET: '{{ trim .trigger }}'
  data:
    - secretKey: trigger
      remoteRef:
        key: name:preprod-backend-xdebug-trigger
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: name:preprod-postgres-db
    - secretKey: POSTGRES_USER
      remoteRef:
        key: name:preprod-postgres-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: name:preprod-postgres-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: rabbitmq-credentials
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: name:preprod-rabbitmq-user
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: name:preprod-rabbitmq-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-keys
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: jwt-keys
    creationPolicy: Owner
  data:
    # PEM = texte ASCII : pas d'encodage particulier à l'upload (contrairement
    # à cv-pdf ci-dessous).
    - secretKey: private.pem
      remoteRef:
        key: name:preprod-jwt-private-pem
    - secretKey: public.pem
      remoteRef:
        key: name:preprod-jwt-public-pem

---
# Restriction d'accès à la préprod (point de sécurité posé le 2026-09-12) :
# Basic Auth sur tout l'ingress plutôt qu'un allowlist par IP source, qui ne
# marche pas pour un accès mobile (IP CGNAT partagée et changeante côté
# opérateur — voir le patch d'annotations dans kustomization.yaml). Contenu
# attendu de ce secret : un fichier htpasswd classique (clé `auth`, format
# attendu par défaut par `nginx.ingress.kubernetes.io/auth-secret-type:
# auth-file`) — voir k8s/README.md pour la génération et l'upload.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: preprod-basic-auth
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: preprod-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef:
        key: name:preprod-basic-auth-htpasswd

# Pas d'ExternalSecret pour cv-pdf : Scaleway Secret Manager plafonne une
# version de secret à 64 Ko, très en-dessous de la taille du CV (~416 Ko en
# brut, ~555 Ko encodé en base64). Le Secret Kubernetes `cv-pdf` est donc créé
# manuellement (troisième et dernier bootstrap `kubectl create secret`, cf.
# README) — toujours hébergé en France puisqu'il vit dans le cluster Kapsule
# (fr-par), seule la brique Secret Manager n'est pas utilisable pour ce
# fichier précis.
