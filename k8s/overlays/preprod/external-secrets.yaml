# Un secret Scaleway = une valeur (pas de JSON multi-clés) : plus verbeux,
# mais chaque mapping est trivial à vérifier et à faire tourner isolément.
# Noms Scaleway préfixés "preprod-" — mêmes noms de Secret Kubernetes cible
# que ce que les Deployments référencent déjà (backend-secrets, jwt-keys...).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_SECRET
      remoteRef:
        key: name:preprod-backend-app-secret
    - secretKey: DATABASE_URL
      remoteRef:
        key: name:preprod-backend-database-url
    - secretKey: MESSENGER_TRANSPORT_DSN
      remoteRef:
        key: name:preprod-backend-messenger-dsn
    - secretKey: JWT_PASSPHRASE
      remoteRef:
        key: name:preprod-backend-jwt-passphrase
    - secretKey: MAILER_DSN
      remoteRef:
        key: name:preprod-backend-mailer-dsn
    - secretKey: CONTACT_RECIPIENT_EMAIL
      remoteRef:
        key: name:preprod-backend-contact-email
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: name:preprod-postgres-db
    - secretKey: POSTGRES_USER
      remoteRef:
        key: name:preprod-postgres-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: name:preprod-postgres-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: rabbitmq-credentials
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: name:preprod-rabbitmq-user
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: name:preprod-rabbitmq-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-keys
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: jwt-keys
    creationPolicy: Owner
  data:
    # PEM = texte ASCII : pas d'encodage particulier à l'upload (contrairement
    # à cv-pdf ci-dessous).
    - secretKey: private.pem
      remoteRef:
        key: name:preprod-jwt-private-pem
    - secretKey: public.pem
      remoteRef:
        key: name:preprod-jwt-public-pem

# Pas d'ExternalSecret pour cv-pdf : Scaleway Secret Manager plafonne une
# version de secret à 64 Ko, très en-dessous de la taille du CV (~416 Ko en
# brut, ~555 Ko encodé en base64). Le Secret Kubernetes `cv-pdf` est donc créé
# manuellement (troisième et dernier bootstrap `kubectl create secret`, cf.
# README) — toujours hébergé en France puisqu'il vit dans le cluster Kapsule
# (fr-par), seule la brique Secret Manager n'est pas utilisable pour ce
# fichier précis.
