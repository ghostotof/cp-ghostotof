# Point d'audit A17 — Pod Security Admission. Ces labels sont appliqués par le
# pipeline avec le reste de l'overlay : le ClusterRole du déployeur CI porte
# `namespaces: [get, patch]` restreint par `resourceNames: [preprod, prod]`
# (k8s/base/github-actions-rbac/clusterrole.yaml), ce qui suffit exactement à
# les poser sur un namespace déjà créé. Il n'a PAS `create` : le namespace
# lui-même reste un bootstrap manuel (cf. k8s/README.md, prérequis n°6).
#
# `enforce: baseline` et non `restricted` : RabbitMQ (k8s/base/rabbitmq.yaml)
# ne déclare aucun `securityContext` de conteneur — pas de `runAsNonRoot`, pas
# de `capabilities.drop: [ALL]`, pas d'`allowPrivilegeEscalation: false` —, il
# est donc refusé par `restricted` et accepté par `baseline`, qui n'interdit
# pas l'exécution en root. C'est le constat A18, assumé : la release v0.5.0 a
# mis ce broker en CrashLoopBackOff en prod en touchant à son utilisateur
# d'exécution, et `enforce: restricted` reproduirait l'incident sous une autre
# forme — le pod ne serait même plus admis.
#
# `audit`/`warn: restricted` : la contrainte stricte reste évaluée et
# rapportée (journal d'audit du control-plane pour `audit`, avertissement dans
# la réponse de l'API pour `warn`), sans jamais rien bloquer. Tous les autres
# workloads passent déjà `restricted` ; seul RabbitMQ ressortira, ce qui est
# le but : le jour où il sera durci, ces avertissements disparaîtront et le
# passage d'`enforce` à `restricted` sera visiblement sans risque.
#
# `enforce-version: v1.36` — la mineure du control-plane relevée le 2026-09-22
# (`kubectl version` : Server v1.36.1, Kapsule `auto_upgrade=false`, donc une
# montée de version est un geste explicite, jamais une surprise). Épinglé, le
# mode bloquant garde la sémantique validée en préprod : une version de
# Kubernetes qui ajouterait un contrôle à `baseline` ne refusera pas un pod au
# premier déploiement d'après la mise à jour. `audit`/`warn` restent sur
# `latest`, et c'est voulu : non bloquants, ils sont le pré-avis de ce qu'un
# futur `enforce` refuserait — un nouveau contrôle doit être signalé, pas masqué.
# Après une montée de version du cluster : relancer la simulation
# `--dry-run=server` de k8s/README.md, puis déplacer cette épingle sur la
# nouvelle mineure, préprod d'abord.
apiVersion: v1
kind: Namespace
metadata:
  name: preprod
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
