apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - ../../base
  - external-secrets.yaml
  - ingress-www-redirect.yaml

configMapGenerator:
  - name: backend-config
    # Incident v0.6.0 : cf. le commentaire jumeau dans overlays/preprod — nom
    # stable indispensable pour que k8s/base/migrate-job.yaml (hors kustomize,
    # point C8) puisse référencer ce ConfigMap sans CreateContainerConfigError.
    options:
      disableNameSuffixHash: true
    literals:
      # Point d'audit I2 : ancre de fin `\z` et non `$`. En PCRE (nelmio_cors
      # compile cette valeur en regex, cf. origin_regex: true), `$` accepte
      # aussi une position AVANT un saut de ligne final — `https://cp-ghostotof.com\n`
      # passerait donc le contrôle d'origine. `\z` n'accepte que la fin absolue.
      - CORS_ALLOW_ORIGIN=^https://cp-ghostotof\.com\z
      - DEFAULT_URI=https://cp-ghostotof.com
      # Base des liens construits dans les e-mails sortants (ex. lien de
      # définition de mot de passe d'un utilisateur invité). Consommé par le
      # backend ET le worker Messenger (envoi effectif des e-mails).
      - APP_FRONTEND_BASE_URL=https://cp-ghostotof.com
      - CV_DOWNLOAD_FILENAME=cv.pdf
      # From des notifications du formulaire de contact (non secret, adresse
      # d'envoi dédiée du domaine validé Scaleway TEM). CONTACT_RECIPIENT_EMAIL
      # et MAILER_DSN restent dans le Secret backend-secrets (ESO).
      - CONTACT_SENDER_EMAIL=noreply@cp-ghostotof.com
  - name: frontend-config
    literals:
      - API_URL=https://cp-ghostotof.com

# newTag est un placeholder, écrasé par le job `deploy-prod` du pipeline
# (`kustomize edit set image`) avant `kubectl apply -k .` — jamais rebuildé,
# c'est exactement l'image déjà validée en préprod (cf. .gitlab-ci.yml).
images:
  - name: backend
    newTag: unset-by-ci
  - name: frontend
    newTag: unset-by-ci

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2
  # Point d'audit B2 : Adminer (UI d'admin BDD, sans authentification propre
  # au-delà des creds Postgres) est défini dans base/ pour la préprod, mais
  # ne doit pas tourner en prod — surface d'attaque inutile même sans route
  # Ingress. On le met à zéro replica ici (Deployment/Service conservés, aucun
  # pod). Accès ponctuel prod : `kubectl scale deploy/adminer --replicas=1 -n
  # prod` puis remise à 0.
  - name: adminer
    count: 0

patches:
  - target:
      kind: Ingress
      name: cp-ghostotof
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: cp-ghostotof.com
      - op: replace
        path: /spec/tls/0/hosts
        value: [cp-ghostotof.com]
      - op: replace
        path: /spec/tls/0/secretName
        value: cp-ghostotof-prod-tls
