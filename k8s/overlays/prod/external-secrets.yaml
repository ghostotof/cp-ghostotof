# Un secret Scaleway = une valeur (pas de JSON multi-clés) : plus verbeux,
# mais chaque mapping est trivial à vérifier et à faire tourner isolément.
# Noms Scaleway préfixés "prod-" — mêmes noms de Secret Kubernetes cible
# que ce que les Deployments référencent déjà (backend-secrets, jwt-keys...).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_SECRET
      remoteRef:
        key: name:prod-backend-app-secret
    - secretKey: DATABASE_URL
      remoteRef:
        key: name:prod-backend-database-url
    - secretKey: MESSENGER_TRANSPORT_DSN
      remoteRef:
        key: name:prod-backend-messenger-dsn
    - secretKey: JWT_PASSPHRASE
      remoteRef:
        key: name:prod-backend-jwt-passphrase
    - secretKey: MAILER_DSN
      remoteRef:
        key: name:prod-backend-mailer-dsn
    - secretKey: CONTACT_RECIPIENT_EMAIL
      remoteRef:
        key: name:prod-backend-contact-email
    # Clé Anthropic de l'assistant de traduction du backoffice (ADR 0004, D5) :
    # ne sert qu'à ROLE_SUPER, aucun chemin public ne l'utilise. Créer le secret
    # Scaleway AVANT le déploiement qui l'attend, sinon ESO laisse
    # `backend-secrets` incomplet et le Deployment ne démarre pas.
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: name:prod-backend-anthropic-api-key
    # Assistant « interrogez mon parcours » (spec 0005, ADR 0004 D7 amendée) :
    # Scaleway Generative APIs, appelé pour le seul palier ROLE_TRUSTED. Clé
    # d'une application IAM DÉDIÉE (permission Generative APIs seule, distincte
    # de l'application d'ESO). Même règle que la clé Anthropic : les deux
    # secrets Scaleway doivent exister AVANT le déploiement qui les attend.
    - secretKey: SCALEWAY_AI_API_KEY
      remoteRef:
        key: name:prod-backend-scaleway-ai-api-key
    # Identifiant du projet visé par la politique IAM de la clé ci-dessus : il
    # entre dans le chemin des appels (api.scaleway.ai/<projet>/v1). Absent ou
    # faux, l'API répond 403, que le bridge 0.13.0 réduit à « Unknown error »,
    # et l'assistant répond 503. Pas un secret au sens IAM, mais hors dépôt
    # public : il désigne le projet qui porte la facturation de l'assistant.
    - secretKey: SCALEWAY_AI_PROJECT_ID
      remoteRef:
        key: name:prod-backend-scaleway-ai-project-id
---
# Issue #575 : l'URL du rôle PostgreSQL PROPRIÉTAIRE du schéma (cpg_migrator),
# lue par le seul Job de migration (migrate-job.yaml, `env` DATABASE_URL). La
# DATABASE_URL de backend-secrets ci-dessus est celle du rôle applicatif
# (cpg_app, DML seulement). Secret séparé, et non une clé de plus dans
# backend-secrets, pour que l'URL du propriétaire n'entre jamais dans
# l'environnement d'un pod qui sert des requêtes. Pas de `deploy-gate:
# optional` : le Job de migration en a besoin pour démarrer, la garde #325
# arrête le déploiement en nommant la clé si elle manque. Créer le secret
# Scaleway par le Job postgres-roles (k8s/README.md, « Rôles PostgreSQL »)
# AVANT de pousser la branche de release.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-migration-secrets
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: backend-migration-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: name:prod-backend-migration-database-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: name:prod-postgres-db
    - secretKey: POSTGRES_USER
      remoteRef:
        key: name:prod-postgres-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: name:prod-postgres-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: rabbitmq-credentials
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: name:prod-rabbitmq-user
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: name:prod-rabbitmq-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-keys
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: jwt-keys
    creationPolicy: Owner
  data:
    # PEM = texte ASCII : pas d'encodage particulier à l'upload (contrairement
    # à cv-pdf ci-dessous).
    - secretKey: private.pem
      remoteRef:
        key: name:prod-jwt-private-pem
    - secretKey: public.pem
      remoteRef:
        key: name:prod-jwt-public-pem

# Pas d'ExternalSecret pour cv-pdf : Scaleway Secret Manager plafonne une
# version de secret à 64 Ko, très en-dessous de la taille du CV (~416 Ko en
# brut, ~555 Ko encodé en base64). Le Secret Kubernetes `cv-pdf` est donc créé
# manuellement (troisième et dernier bootstrap `kubectl create secret`, cf.
# README) — toujours hébergé en France puisqu'il vit dans le cluster Kapsule
# (fr-par), seule la brique Secret Manager n'est pas utilisable pour ce
# fichier précis.
