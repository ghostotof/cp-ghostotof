# Un secret Scaleway = une valeur (pas de JSON multi-clés) : plus verbeux,
# mais chaque mapping est trivial à vérifier et à faire tourner isolément.
# Noms Scaleway préfixés "prod-" — mêmes noms de Secret Kubernetes cible
# que ce que les Deployments référencent déjà (backend-secrets, jwt-keys...).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_SECRET
      remoteRef:
        key: name:prod-backend-app-secret
    - secretKey: DATABASE_URL
      remoteRef:
        key: name:prod-backend-database-url
    - secretKey: MESSENGER_TRANSPORT_DSN
      remoteRef:
        key: name:prod-backend-messenger-dsn
    - secretKey: JWT_PASSPHRASE
      remoteRef:
        key: name:prod-backend-jwt-passphrase
    - secretKey: MAILER_DSN
      remoteRef:
        key: name:prod-backend-mailer-dsn
    - secretKey: CONTACT_RECIPIENT_EMAIL
      remoteRef:
        key: name:prod-backend-contact-email
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: name:prod-postgres-db
    - secretKey: POSTGRES_USER
      remoteRef:
        key: name:prod-postgres-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: name:prod-postgres-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: rabbitmq-credentials
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: name:prod-rabbitmq-user
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: name:prod-rabbitmq-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-keys
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: jwt-keys
    creationPolicy: Owner
  data:
    # PEM = texte ASCII : pas d'encodage particulier à l'upload (contrairement
    # à cv-pdf ci-dessous).
    - secretKey: private.pem
      remoteRef:
        key: name:prod-jwt-private-pem
    - secretKey: public.pem
      remoteRef:
        key: name:prod-jwt-public-pem
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cv-pdf
spec:
  secretStoreRef:
    name: scaleway-secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: cv-pdf
    creationPolicy: Owner
  data:
    # Contenu binaire : uploadé en base64 dans Scaleway Secret Manager (cf.
    # README), décodé ici pour que le Secret Kubernetes contienne le PDF brut.
    - secretKey: cv.pdf
      remoteRef:
        key: name:prod-cv-pdf
        decodingStrategy: Base64
