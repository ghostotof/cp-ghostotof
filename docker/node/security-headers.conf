# =============================================================================
# En-têtes de sécurité du frontend — source unique.
# -----------------------------------------------------------------------------
# nginx : un bloc `location` qui déclare SON PROPRE add_header n'hérite plus
# d'AUCUN add_header du niveau parent — pas seulement de celui qu'il
# redéfinit. Or /assets/, /healthz et /config.js posent chacun leur propre
# Cache-Control ou Content-Type : leurs réponses partaient donc sans CSP ni
# HSTS (audit du 2026-09-16, constat A16), alors que la page d'accueil, elle,
# les portait — un audit mené sur `/` seul ne pouvait pas le voir.
#
# Ce fichier est la parade structurelle : il est inclus au niveau `server` ET
# dans chacune de ces locations. Ajouter un en-tête ici le fait apparaître
# partout d'un coup, ce qu'une copie manuelle par bloc ne garantissait pas —
# c'est précisément par recopie incomplète que la dérive s'était installée.
#
# Il vit délibérément HORS de /etc/nginx/conf.d/ : le nginx.conf de l'image y
# inclut déjà `*.conf`, un fichier posé là serait donc aussi interprété au
# niveau `http`, en double et hors de tout contrôle de ce fichier-ci.
# Copié par docker/node/Dockerfile (stage `production`) vers
# /etc/nginx/security-headers.conf : déplacer l'un sans l'autre casse le
# démarrage de nginx (échec franc au `nginx -t`, pas une dérive silencieuse).
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# HSTS : le pod n'est joignable que derrière l'ingress qui termine le TLS
# (cf. k8s/base/ingress.yaml), donc systématiquement servi en HTTPS malgré le
# `listen 8080` en clair. ingress-nginx pose déjà le sien par défaut, mais on
# ne s'en remet plus à cette valeur par défaut : c'est exactement ce
# raisonnement qui avait justifié de ne pas le redéclarer par location.
# Pas de `preload` (question Q3, tranchée le 2026-09-16 : engagement sur tous
# les sous-domaines, retrait long, gain marginal derrière la redirection 308
# et un max-age d'un an).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CSP en mode enforce. Le bundle Vite ne contient aucun script ni style inline
# dans index.html (vérifié) ; style-src 'unsafe-inline' couvre les styles
# inline injectés par Bootstrap/Vue au runtime ; connect-src 'self' suffit car
# l'API est servie sur la même origine (cf. k8s/base/ingress.yaml).
# Ne JAMAIS ajouter 'unsafe-inline' à script-src : c'est ce `script-src 'self'`
# qui neutralise un href `javascript:` republié depuis une source tierce
# (cf. Portfolio/Watch, revue de sécurité du 2026-09-08).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
