server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx : un bloc location qui définit SON PROPRE add_header n'hérite plus
    # d'AUCUN add_header du bloc server parent (pas seulement celui qu'il
    # redéfinit). Chaque location ci-dessous qui a son propre add_header doit
    # donc redéclarer explicitement les en-têtes de sécurité, sinon ils ne
    # partent jamais pour les réponses servies par cette location.
    #
    # Ils ne sont plus recopiés à la main mais inclus depuis
    # docker/node/security-headers.conf (une seule source, voir ce fichier) :
    # la recopie partielle est précisément ce qui avait laissé /assets/,
    # /healthz et /config.js sans CSP ni HSTS (audit du 2026-09-16, A16).

    # Sonde de vivacité : réponse immédiate, sans accès disque.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        # `return` sert la réponse avec le type par défaut du bloc
        # (`application/octet-stream` hérité de nginx.conf) : un `add_header
        # Content-Type` s'ajoute à ce type au lieu de le remplacer, d'où deux
        # en-têtes Content-Type contradictoires. `default_type` fixe le type
        # de la réponse elle-même ; ce n'est pas un `add_header`, l'héritage
        # A16 n'est donc pas en cause ici.
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
    }

    # Les assets générés par Vite portent un hash dans leur nom : leur contenu
    # ne change jamais pour une URL donnée, on peut donc les mettre en cache
    # indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # index.html ne doit JAMAIS être mis en cache : c'est lui qui référence les
    # nouveaux assets hashés après un déploiement. C'est aussi la location qui
    # sert réellement `/` : try_files (location /, ci-dessous) redirige en
    # interne vers /index.html, ce qui fait matcher CETTE location plutôt que
    # de rester dans location /.
    #
    # C'est la réponse « document » de la SPA : la CSP posée par l'include
    # ci-dessous est celle qui compte réellement pour le navigateur.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # config.js est régénéré à chaque démarrage du conteneur (voir
    # docker-entrypoint.sh) : jamais de cache, sinon un navigateur pourrait
    # garder l'URL d'API d'un déploiement précédent.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # -------------------------------------------------------------------------
    # Vrais 404, déclarés AVANT le fallback SPA.
    #
    # Le fallback ci-dessous répond 200 + index.html pour n'importe quelle URL.
    # C'est le comportement voulu pour une route applicative (/fr/about), mais
    # il a deux effets de bord sur tout le reste :
    #   - un moteur de recherche indexe des URL fantômes comme autant de pages
    #     valides, toutes avec le même contenu ;
    #   - GET /.env ou /composer.json répond 200. Aucune fuite réelle (c'est
    #     index.html qui est servi), mais tout scanner de sécurité — et tout
    #     robot de moissonnage — le compte comme un fichier exposé.
    #
    # Les chemins ci-dessous ne peuvent correspondre à aucune route de la SPA :
    # ils méritent un vrai 404.
    # -------------------------------------------------------------------------

    # Déclaré en premier et en `^~` : un préfixe marqué `^~` l'emporte sur les
    # expressions régulières qui suivent, sans quoi la règle sur les fichiers
    # cachés avalerait aussi /.well-known (ACME, security.txt).
    # N'a pas son propre add_header, donc hérite de ceux du bloc server.
    location ^~ /.well-known/ {
        # RFC 9116 §3 : security.txt se sert en `text/plain; charset=utf-8`.
        # `charset` n'est pas un add_header : l'héritage des en-têtes du bloc
        # server n'est pas rompu.
        charset utf-8;
        try_files $uri =404;
    }

    # Fichiers et répertoires cachés : /.env, /.git/HEAD, /.htaccess…
    location ~ /\. {
        return 404;
    }

    # Extensions qu'aucun artefact du build ne porte (dist/ ne contient que
    # .html, .js, .css, .svg et .png). Volontairement sans `xml` : un
    # sitemap.xml ajouté plus tard tomberait dans le panneau en silence.
    # Ajouter ici une extension revient à interdire de servir ce type de
    # fichier depuis l'origine du frontend.
    location ~* \.(env|ya?ml|ini|conf|log|sql|bak|old|swp|lock|toml|sh|php|py|rb|pl|cgi|json|tpl|twig)$ {
        return 404;
    }

    # Routage côté client : toute autre URL inconnue renvoie l'application, qui
    # se charge d'afficher la bonne vue (ou sa propre page 404, en noindex —
    # cf. presentation/router/seo.ts). N'a pas son propre add_header, donc
    # hérite normalement de ceux du bloc server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Niveau server : hérité par toutes les locations sans add_header propre
    # (`location /`, les deux blocs 404, /.well-known/) et par les réponses
    # d'erreur générées par nginx lui-même hors location.
    include /etc/nginx/security-headers.conf;
}
