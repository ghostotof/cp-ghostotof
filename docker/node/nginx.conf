server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx : un bloc location qui définit SON PROPRE add_header n'hérite plus
    # d'AUCUN add_header du bloc server parent (pas seulement celui qu'il
    # redéfinit). Chaque location ci-dessous qui a son propre add_header doit
    # donc redéclarer explicitement les en-têtes de sécurité, sinon ils ne
    # partent jamais pour les réponses servies par cette location.

    # Sonde de vivacité : réponse immédiate, sans accès disque.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Les assets générés par Vite portent un hash dans leur nom : leur contenu
    # ne change jamais pour une URL donnée, on peut donc les mettre en cache
    # indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    # index.html ne doit JAMAIS être mis en cache : c'est lui qui référence les
    # nouveaux assets hashés après un déploiement. C'est aussi la location qui
    # sert réellement `/` : try_files (location /, ci-dessous) redirige en
    # interne vers /index.html, ce qui fait matcher CETTE location plutôt que
    # de rester dans location /.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # CSP posée ici (et dans le bloc server) : c'est la réponse "document"
        # de la SPA — try_files de `location /` réécrit en interne vers
        # /index.html, qui fait matcher CE bloc. Enforce : le bundle Vite ne
        # contient aucun script ni style inline dans index.html (vérifié) ;
        # style-src 'unsafe-inline' couvre les styles inline injectés par
        # Bootstrap/Vue au runtime ; connect-src 'self' suffit car l'API est
        # servie sur la même origine (cf. k8s/base/ingress.yaml).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # config.js est régénéré à chaque démarrage du conteneur (voir
    # docker-entrypoint.sh) : jamais de cache, sinon un navigateur pourrait
    # garder l'URL d'API d'un déploiement précédent.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Routage côté client : toute URL inconnue renvoie l'application, qui se
    # charge d'afficher la bonne vue (ou sa propre page 404). N'a pas son
    # propre add_header, donc hérite normalement de ceux du bloc server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # HSTS : le pod n'est joignable que derrière l'ingress qui termine le TLS
    # (cf. k8s/base/ingress.yaml), donc systématiquement servi en HTTPS malgré
    # le `listen 8080` en clair ci-dessus. Pas besoin de le redéclarer dans
    # chaque location : ingress-nginx l'ajoute déjà lui-même globalement par
    # défaut, celui-ci n'est qu'une ceinture-bretelles pour un déploiement
    # hors ingress-nginx.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Hérité par `location /` (fallback SPA) qui n'a pas d'add_header propre.
    # Doublé dans `location = /index.html` (voir plus haut) car un bloc avec
    # son propre add_header n'hérite plus de rien.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
