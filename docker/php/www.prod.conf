[global]
; Le master lui-même tourne en `app` : aucun processus root dans le conteneur,
; ce qui permet `runAsNonRoot: true` côté Kubernetes.
error_log = /proc/self/fd/2
daemonize = no

[www]
user = app
group = app

listen = 0.0.0.0:9000

; `static` plutôt que `dynamic` : en conteneur, la mise à l'échelle se fait en
; ajoutant des pods, pas des workers. Un nombre fixe rend la consommation
; mémoire prévisible, ce qui est indispensable pour calibrer les limits.
pm = static
pm.max_children = 8
pm.max_requests = 500

; Aucun worker n'attend indéfiniment (issue #272, constat M1). Le verrou des
; limiteurs de débit est un advisory lock PostgreSQL de session, et
; `pg_advisory_lock()` attend sans fin si son détenteur disparaît sans fermer
; son socket (nœud perdu : PostgreSQL le garde jusqu'au keepalive TCP, ~2 h).
; `max_execution_time` ne compte pas cette attente, qui n'est pas du temps CPU.
;  - 65 s : juste au-dessus du fastcgi_read_timeout de 60 s (nginx, ingress),
;    donc après le 504 — le worker n'a plus personne à servir. Tué, il ferme ses
;    connexions et PostgreSQL annule son attente. Durée totale, pas d'inactivité :
;    elle doit rester au-dessus de toute requête légitime (assistant en flux,
;    max_duration 50 s ; traduction, timeout 40 s).
request_terminate_timeout = 65s

; Statut interne, consommé par la sonde de santé et le scraping Prometheus.
pm.status_path = /-/fpm-status
ping.path = /-/fpm-ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; Les variables sensibles proviennent de l'orchestrateur (Secret Kubernetes),
; jamais de l'image. On les laisse simplement traverser.
env[APP_ENV] = $APP_ENV
env[DATABASE_URL] = $DATABASE_URL
env[MESSENGER_TRANSPORT_DSN] = $MESSENGER_TRANSPORT_DSN

; Toute attente de verrou PostgreSQL d'une requête web est bornée à 5 s, puis
; échoue (LockAcquiringException sur un limiteur → 500) au lieu d'immobiliser
; le worker (issue #272, constat M1). Le DSN ne permet pas de viser la seule
; connexion du verrou (DBAL ne transmet pas `options` à pdo_pgsql) : libpq lit
; PGOPTIONS pour toutes les connexions du worker, ORM compris — aucune requête
; web n'a de raison d'attendre un verrou de ligne plus de 5 s. Réservé aux
; workers FPM : la console (migrations, worker Messenger, CronJobs) ne lit pas
; ce fichier, et une migration peut légitimement attendre un verrou.
env[PGOPTIONS] = "-c lock_timeout=5s"
