; Réglages PHP pour les environnements déployés (production ET préprod).
memory_limit = 256M
max_execution_time = 30
date.timezone = Europe/Paris

; OPcache verrouillé : le code ne change jamais au sein d'une image, la
; revalidation sur disque est donc du gaspillage pur.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Preloading : Symfony génère config/preload.php, qui charge le conteneur DI et
; les classes du framework une seule fois au démarrage du master php-fpm.
; Si le fichier est absent, PHP émet un avertissement au démarrage sans planter.
opcache.preload = /var/www/backend/config/preload.php
opcache.preload_user = app

; Aucune erreur ne doit fuiter vers le client : tout part dans les logs, qui
; sont récupérés par la sortie standard du conteneur.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; Les traces d'exception ne portent pas les arguments des appels (issue #278) :
; un DSN, un mot de passe ou un jeton passé en argument n'y figure jamais, même
; dans une signature qui aurait oublié #[\SensitiveParameter]. Valeur
; recommandée par php.ini-production ; la valeur intégrée de PHP est Off.
zend.exception_ignore_args = On

expose_php = Off
upload_max_filesize = 16M
post_max_size = 16M

; Sessions en mémoire partagée uniquement si nécessaire ; par défaut on
; privilégie des jetons sans état (JWT) ou un stockage externe.
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; Suivi de progression des uploads éteint (CVE-2026-109619, GHSA-6wmf-4rv5-p3rp,
; corrigée par PHP 8.5.12) : actif par défaut et sans `session_start()`, il
; agit sur tout POST multipart avant l'application, et l'avis l'a exploité sur
; FPM. Rien ne s'en sert (aucune session, aucun upload) ; l'avis recommande de
; l'éteindre même après la mise à jour. SessionUploadProgressDisabledTest.
session.upload_progress.enabled = Off
