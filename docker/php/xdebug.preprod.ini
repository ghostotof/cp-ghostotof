; Xdebug en PRÉPRODUCTION uniquement.
;
; Jamais le mode `debug` : on ne veut pas ouvrir de port d'attachement sur un
; environnement partagé et accessible.
;
; --- FERMÉ PAR DÉFAUT (3e audit, constat A12) --------------------------------
; `xdebug.mode = off` dans l'image : telle quelle, cette extension ne profile
; rien, ne trace rien et ne coûte rien, quel que soit le déclencheur envoyé.
;
; L'activation ne vient JAMAIS de l'image : elle vient de la variable
; d'environnement `XDEBUG_MODE`, qui prime sur ce réglage, et que seul le
; Secret Kubernetes `backend-xdebug-trigger` (préprod uniquement, ESO, monté
; `optional: true`) fournit — en même temps que `XDEBUG_TRIGGER_SECRET`.
; Secret absent, vide ou trop court : les deux variables sont absentes ou
; `XDEBUG_MODE=off`, et le profilage est impossible. Voir k8s/README.md,
; « Profilage Xdebug en préprod ».
;
; Pourquoi ce verrou-là et pas seulement `xdebug.trigger_value` : quand la
; variable d'environnement interpolée ci-dessous n'existe pas, PHP la remplace
; par une chaîne VIDE, et une `trigger_value` vide signifie pour Xdebug
; « n'importe quelle valeur déclenche ». Le réglage qui était censé restreindre
; le déclenchement l'ouvrait donc à tout le monde — c'est exactement le constat
; A12. Le gate se trouve maintenant sur `xdebug.mode`, dont la valeur par
; défaut ne peut pas dégénérer en « ouvert ».
;
; Le mode activé est `profile` SEUL, délibérément : une trace de fonctions
; (`trace`) écrit les ARGUMENTS des appels en clair dans le fichier .xt — le
; mot de passe d'un `POST /api/login_check` s'y retrouverait tel quel. Un
; profil cachegrind, lui, ne contient que des chemins de fichiers, des noms de
; fonctions et des compteurs. Ne pas réintroduire `trace` sans avoir décidé
; ce qu'on fait du contenu des variables.
;
; `"off"` entre guillemets, et non `off` nu : l'analyseur d'ini de PHP traite
; `off` comme un booléen et le réduit à la chaîne VIDE. Xdebug n'active rien
; non plus sur une valeur vide, mais on ne veut pas que la propriété de
; sécurité repose sur cette coïncidence — entre guillemets, c'est bien le mot
; `off`, que Xdebug documente, qui arrive au réglage.
xdebug.mode = "off"

; Déclenchement MANUEL : rien n'est profilé tant que la requête ne porte pas le
; déclencheur `XDEBUG_TRIGGER` ou `XDEBUG_PROFILE` avec la valeur EXACTE du
; secret. Le surcoût est donc nul sur le trafic normal, ce qui rend les mesures
; de perf exploitables. Xdebug 3.5 cherche ce déclencheur dans un COOKIE, un
; paramètre GET/POST ou une variable d'environnement — PAS dans un en-tête HTTP
; (vérifié image en main). Utiliser le cookie : nginx journalise la query
; string, le secret finirait dans les logs du pod.
xdebug.start_with_request = trigger
xdebug.trigger_value = ${XDEBUG_TRIGGER_SECRET}

; Répertoire monté en `emptyDir` par l'overlay préprod : le filesystem du pod
; est en lecture seule (ADR 0005), sans ce volume Xdebug n'écrirait nulle part.
; Les profils meurent donc avec le pod, ce qui est voulu.
xdebug.output_dir = /var/www/backend/var/profiler
; Horodatage + PID : aucune donnée de la requête (surtout pas l'URL ni sa query
; string) ne doit se retrouver dans un nom de fichier.
xdebug.profiler_output_name = cachegrind.out.%t.%p
xdebug.use_compression = 0
