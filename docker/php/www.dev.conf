[global]
; Longueur maximale d'une ligne relayée par le master (octets). Le défaut de
; php-fpm est 1024 : une ligne de sortie de worker plus longue est coupée en
; morceaux qui ne sont plus du JSON, alors que Monolog écrit un enregistrement
; JSON par ligne sur stderr. Directive globale, donc dans [global] : ce fichier
; est inclus par php-fpm.conf, comme php-fpm.d/docker.conf qui fixe déjà cette valeur.
log_limit = 8192

[www]
user = dev
group = dev

; Écoute TCP plutôt qu'un socket Unix : nginx est dans un autre conteneur.
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Les logs des workers sont renvoyés vers la sortie standard du conteneur,
; donc visibles via `docker compose logs backend`.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
