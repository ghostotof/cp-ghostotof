; Réglages PHP pour l'environnement de développement
memory_limit = 512M
max_execution_time = 60
date.timezone = Europe/Paris

; OPcache activé mais avec revalidation immédiate : les modifications de code
; sont prises en compte sans redémarrer php-fpm (indispensable en dev).
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Affichage complet des erreurs en dev
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Aucun corps de formulaire analysé, comme en production (php.prod.ini, #686) :
; le dev sert l'API par le même FPM.
enable_post_data_reading = Off
max_multipart_body_parts = 0
file_uploads = Off
post_max_size = 1M

; Suivi de progression des uploads éteint, comme en production (php.prod.ini,
; CVE-2026-109619) : le dev sert l'API par le même FPM.
session.upload_progress.enabled = Off
