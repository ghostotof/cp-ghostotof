server {
    listen 80;
    server_name _;

    # La racine web pointe sur public/ : seul ce dossier est exposé.
    root /var/www/backend/public;

    # Toute URL inconnue est renvoyée au contrôleur frontal de Symfony.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Exécution du contrôleur frontal via FastCGI vers le conteneur php-fpm.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # $realpath_root résout les liens symboliques : indispensable pour que
        # les chemins vus par PHP correspondent à ceux du montage.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # `internal` : empêche l'accès direct à /index.php depuis l'extérieur.
        internal;
    }

    # Sécurité : aucun autre .php ne doit être exécutable.
    location ~ \.php$ {
        return 404;
    }

    # Alignés sur k8s/base/backend-nginx-conf.yaml (le même service en prod) :
    # à garder synchronisés si l'un des deux change. Strict-Transport-Security
    # est ignoré par les navigateurs sur une réponse HTTP non chiffrée (ce
    # qu'est ce service en dev) : header inoffensif ici, cohérent avec la prod.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # API pure : aucune réponse n'est un document navigable, une CSP verrouillée
    # est donc sans risque. En Report-Only le temps d'observer d'éventuelles
    # violations (aucune attendue), à passer en enforce ensuite. Aligné sur
    # k8s/base/backend-nginx-conf.yaml.
    add_header Content-Security-Policy-Report-Only "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    # API JSON sans upload : 1 Mo suffit très largement (message de contact
    # ~5 Ko max) et supprime la surface de DoS d'un corps de 32 Mo parsé par PHP.
    client_max_body_size 1m;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
