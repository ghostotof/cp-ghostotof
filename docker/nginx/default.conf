# ---------------------------------------------------------------------------
# Point d'audit C7 — plafonds de débit secondaires, AVANT php-fpm.
#
# Ces zones vivent au niveau `http` (ce fichier est inclus par
# `include /etc/nginx/conf.d/*.conf;` depuis le bloc http de nginx.conf), donc
# hors du `server {}` ci-dessous.
#
# Complètent, sans les remplacer, les limiteurs métier Symfony (5/h sur le
# contact, 10/h sur le set-password, cf. config/packages/rate_limiter.yaml) :
# ceux-ci comptent finement mais coûtent un boot Symfony complet par requête.
# Le plafond nginx est volontairement bien plus large — il ne vise pas l'abus
# métier mais l'inondation qui épuiserait le pool de workers php-fpm.
#
# Clé = $binary_remote_addr, qui n'a de sens QUE si nginx connaît la vraie IP
# cliente. Derrière l'ingress (cf. k8s/base/backend-nginx.conf, dont ce
# fichier est le miroir dev), le pair TCP est le pod ingress-nginx : sans le
# bloc real_ip ci-dessous, tout Internet partagerait UN SEUL compteur — un déni
# de service qu'on s'infligerait soi-même. Mêmes plages de confiance que
# `trusted_proxies: private_ranges` côté Symfony (framework.yaml).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
# RFC 6598 (« shared address space ») : c'est la plage des pods du cluster
# Kapsule (Cilium), donc celle du pod ingress-nginx qui nous parle. Sans
# elle, real_ip ne s'appliquait jamais : $binary_remote_addr valait l'IP du
# pod ingress pour tout Internet et chaque zone ci-dessous était UN compteur
# global (audit du 2026-09-16, constat A25 — le déni de service que C7
# voulait éviter, en place depuis le début). Symfony, lui, la compte déjà
# dans `private_ranges`.
set_real_ip_from 100.64.0.0/10;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
# X-Forwarded-For peut porter plusieurs sauts (client, puis le LB si le
# proxy-protocol n'était pas actif) : remonter la chaîne jusqu'à la
# première adresse hors des plages de confiance, plutôt que prendre la
# dernière — sinon un LB de confiance passerait pour le visiteur.
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=contact:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pwsetup:1m rate=20r/m;
# Accès au palier de base (ADR 0003 D6, POST /api/account/base-access) : chaque
# appel signe un JWT RS256. Le limiteur Symfony (20/h) est le vrai plafond ;
# cette zone est le filet en amont de php-fpm, comme les deux précédentes —
# sans elle, seule `publicapi` (600 r/min) bornerait cet endpoint (issue #77).
limit_req_zone $binary_remote_addr zone=baseaccess:1m rate=20r/m;
# Login (POST /api/login_check, audit du 2026-09-16, constat A1/A8) : le vrai
# plafond est le `login_throttling` de Symfony (5 essais / 15 min par couple
# IP+identifiant), mais son état vit dans un stockage partagé (ADR 0005) et un
# jour où ce stockage ferait défaut, cette zone est la seule chose qui
# sépare un brute-force des 600 r/min de `publicapi`. Personne ne se connecte
# dix fois par minute : ce plafond ne gêne aucun usage légitime.
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
# Filet général, d'une autre nature que les deux ci-dessus : celles-là protègent
# un effet de bord (un envoi d'e-mail, un jeton devinable), celle-ci protège la
# ressource. Sans elle, toute lecture publique — /api/watch, /api/about,
# /api/quality… — traverse PHP et Postgres autant de fois qu'on la demande.
#
# Le plafond est volontairement très au-dessus de tout usage réel : une page en
# demande trois ou quatre, 10 r/s en laisse passer l'équivalent d'une centaine de
# pages par minute pour une seule IP. Cette marge n'est pas de la timidité, c'est
# le point d'audit C7 : derrière un CGNAT d'opérateur mobile, des milliers de
# visiteurs partagent une adresse, et un plafond serré les couperait tous
# ensemble — le déni de service qu'on prétend éviter.
limit_req_zone $binary_remote_addr zone=publicapi:5m rate=600r/m;

server {
    listen 80;
    server_name _;

    # La racine web pointe sur public/ : seul ce dossier est exposé.
    root /var/www/backend/public;

    # Endpoints publics et coûteux : plafonnés avant d'atteindre PHP.
    # `^~` : préfixe prioritaire sur les locations régulières, sinon
    # `location ~ \.php$` pourrait matcher en premier.
    # `burst=N nodelay` : tolère une rafale courte (rechargement, double-clic)
    # sans étaler les requêtes dans le temps, puis rejette.
    location ^~ /api/contact {
        limit_req zone=contact burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }

    # Sans barre oblique finale (audit A7) : le jeton voyage dans le corps,
    # les deux routes sont `/api/account/password-setup` (définition) et
    # `…/password-setup/validate` — l'ancien préfixe `…/password-setup/`
    # aurait laissé la route racine hors de la zone. Un préfixe nginx couvre
    # aussi une éventuelle route sœur (`…/password-setup-x`) : sans
    # conséquence, c'est un plafond de débit, pas une exemption.
    location ^~ /api/account/password-setup {
        limit_req zone=pwsetup burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }

    # nginx décode les `%XX` de l'URI avant de choisir la location : ce bloc
    # attrape aussi `/api/account/base%2Daccess`, contrairement à un listener
    # PHP qui lirait le chemin brut (issue #77).
    location ^~ /api/account/base-access {
        limit_req zone=baseaccess burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }

    # burst=10 : le smoke test de la préprod (tools/smoke-login-throttling.sh)
    # envoie six tentatives d'affilée, et un humain qui se trompe recommence
    # vite ; Symfony freine de toute façon au sixième essai.
    location ^~ /api/login_check {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }

    # Toute URL inconnue est renvoyée au contrôleur frontal de Symfony.
    # Le filet général s'applique ici, donc à tout ce que les deux locations
    # ci-dessus n'ont pas déjà plafonné plus sévèrement (nginx retient le
    # préfixe `^~` le plus long, elles gardent leur propre compteur).
    location / {
        limit_req zone=publicapi burst=200 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }

    # Exécution du contrôleur frontal via FastCGI vers le conteneur php-fpm.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # $realpath_root résout les liens symboliques : indispensable pour que
        # les chemins vus par PHP correspondent à ceux du montage.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # `internal` : empêche l'accès direct à /index.php depuis l'extérieur.
        internal;
    }

    # Sécurité : aucun autre .php ne doit être exécutable.
    location ~ \.php$ {
        return 404;
    }

    # Alignés sur k8s/base/backend-nginx.conf (le même service en prod) :
    # à garder synchronisés si l'un des deux change. Strict-Transport-Security
    # est ignoré par les navigateurs sur une réponse HTTP non chiffrée (ce
    # qu'est ce service en dev) : header inoffensif ici, cohérent avec la prod.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # API pure : aucune réponse n'est un document navigable, une CSP verrouillée
    # est donc sans risque (enforce). Aligné sur k8s/base/backend-nginx.conf.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    # API JSON sans upload : 1 Mo suffit très largement (message de contact
    # ~5 Ko max) et supprime la surface de DoS d'un corps de 32 Mo parsé par PHP.
    client_max_body_size 1m;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
